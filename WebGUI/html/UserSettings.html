		function escapeHtml(str) {
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		}

		//=====================================================================================
		//init called once body has loaded
		function init() {
			Debug.log("init()");

			//check for wiz mode
			if (DesktopContent._sequence) {
				Debug.log("Wiz mode detected!");

				document.body.innerHTML = "";
				var str = "<div id='accountsDiv'></div><div id='newAccountFeedbackDiv'></div>";
				document.body.innerHTML = str;

				//get current settings from server
				DesktopContent.XMLHttpRequest("Request?RequestType=getSettings&accounts=1",
					"", settingsRequestHandler);
				return;
			}
			//else handle normal mode

			document.getElementById("omni").style.display = "block";

			document.body.onmouseup = handleBodyMouseUp;
			try {
				_mailbox = DesktopContent._theWindow.parent.document.getElementById("DesktopContent-updateSettingsMailbox");
				_settingsLayoutMailbox = DesktopContent._theWindow.parent.document.getElementById("DesktopContent-settingsLayoutMailbox");
			}
			catch (e) {
				_mailbox = undefined;
				_settingsLayoutMailbox = undefined;
				Debug.log("Ignoring likely cross-origin settings box... here is the error:", e);
				var els = document.getElementsByClassName("prefBtn");
				for (var i = 0; i < els.length; ++i)
					els[i].style.display = "none"; //hide ability to save gen preferences if cross-origin
				var el = document.getElementById("genPreferences");
				if (el) el.style.display = "none";
			}

			var windowTooltip =
				"Welcome to the <b>User Settings</b> window. Here you can personalize " +
				"your user experience.\n\n";

			windowTooltip +=
				"Here is what you can personalize:" +
				"<INDENT>";
			if (_mailbox)
				windowTooltip +=
					"- <b>Color Scheme:</b> " +
					"<INDENT>You can change your color scheme by choosing colors for " +
					"the desktop dashboard, the desktop background, and desktop windows." +
					"</INDENT>" +
					"- <b>Window Layouts:</b> " +
					"<INDENT>Each user can customize their window layout presets. " +
					"A layout preset is a set of windows (including their size and position on your " +
					"desktop) that you can recall any time you would like by clicking 'Layouts' " +
					"in the top left of the desktop environment and choosing a preset. This is useful" +
					"of you find yourself always using the same few windows - you can open them all with one click!" +
					"</INDENT>";

			windowTooltip += "- <b>Tooltips:</b> " +
				"<INDENT>Each user can silence any tooltip as they popup. And in this User Settings window, you can silence all tooltips for yourself (or re-enable all tooltips)." +
				"</INDENT>";

			if (!_mailbox)
				windowTooltip += "</INDENT>\nIt looks like this is a Remote Gateway Settings Window. Use the Primary Gateway Setting Window, in the top-right of the desktop, to control <b>Color Scheme</b> and <b>Window Layouts</b>.\n";
			else
				windowTooltip += "</INDENT>";

			windowTooltip +=
				"\nWhen security is enabled, users with admin privileges can create/modify/delete user accounts, " +
				"and manipulate which user holds the <b>lock</b> (the ots lock mechanism enforces one-user-at-a-time for particular operations).";


			DesktopContent.XMLHttpRequest("Request?RequestType=getSettings&accounts=1",
				"", layoutSettingsHandler);

			////////Tooltips/////////
			DesktopContent.tooltip("User Settings Introduction", windowTooltip);
			DesktopContent.setWindowTooltip(windowTooltip);
		} //end init()

		//==============================================================================
		function layoutSettingsHandler(req) {
			_layoutAliasArray = DesktopContent.getXMLValue(req, "pref_aliaslayout")
			_sysLayoutAliasArray = DesktopContent.getXMLValue(req, "pref_sysalias_layout");
			_layoutAliasArray = _layoutAliasArray == undefined ? _defaultAliasArray : _layoutAliasArray.split(",");
			_sysLayoutAliasArray = _sysLayoutAliasArray == undefined ? _defaultAliasArray : _sysLayoutAliasArray.split(",");
			loadLayoutSettings();
			settingsRequest();
		}

		//==============================================================================
		function loadLayoutSettings() {
			var str = "";
			//create windows layout div
			for (var i = 0; i < _NUM_USER_LAYOUTS; ++i) {
				if (i) str += "<br>";
				str += "<a onmouseup='Javascript:setLayout(" + (i + 1) +
					",event)' class='winLayoutLink' id='winLayoutLink" + (i + 1) + "'>" +
					"<span>User Preset-" + (i + 1) + " (Click to set)</span></a>";

				Debug.log("_layoutAliasArray[" + i + "] " + _layoutAliasArray[i]);

				str += "Layout Alias: ";
				if (_layoutAliasArray[i] == "-1" || _layoutAliasArray[i] == (i + 1).toString())
					str += " <input type='text' id='winLayoutAlias" + (i + 1) + "' placeholder='Enter Alias'>";
				else
					str += " <input type='text' id='winLayoutAlias" + (i + 1) + "' value='" + escapeHtml(_layoutAliasArray[i]) + "'>";
				str += "<div class='winLayoutText' id='winLayoutText" + (i + 1) + "'></div>";
			}
			document.getElementById("windLayoutDiv").innerHTML = str;

			//system presets get their own column (#windSystemLayoutDiv); visibility for
			//system admins is toggled in extractLayoutToForm() based on _sysLayoutArray privileges
			var sysStr = "";
			for (var i = 0; i < _NUM_SYS_LAYOUTS; ++i) {
				if (i) sysStr += "<br>";
				sysStr += "<a onmouseup='Javascript:setLayout(" + (_NUM_USER_LAYOUTS + i + 1) +
					",event)' class='winLayoutLink' id='winSysLayoutLink" + (i + 1) + "'>" +
					"<span>System Preset-" + (i + 1) + " (Click to set)</span></a>";

				sysStr += "Layout Alias: ";
				if (_sysLayoutAliasArray[i] == "-1" || _sysLayoutAliasArray[i] == (i + 1).toString())
					sysStr += " <input type='text' id='winSysLayoutAlias" + (i + 1) + "' placeholder='Enter Alias'>";
				else
					sysStr += " <input type='text' id='winSysLayoutAlias" + (i + 1) + "' value='" + escapeHtml(_sysLayoutAliasArray[i]) + "'>";
				sysStr += "<div class='winLayoutText' id='winSysLayoutText" + (i + 1) + "'></div>";
			}
			document.getElementById("windSystemLayoutDiv").innerHTML = sysStr;
		}

		//=====================================================================================
		//request current settings immediately once page loads
		function settingsRequest() {
			Debug.log("settingsRequest()");

			//setup input fields
			var colorDiv = document.getElementById("colorInputs");
			var el;
			var colorNames = ["Desktop", "Dashboard", "Window"];
			var colorPrefix = ["r&nbsp;", "g&nbsp;", "b&nbsp;"];
			for (var i = 0; i < colorNames.length; ++i) {

				el = document.createElement("div");
				el.setAttribute("id", "Settings-colorText" + i);
				el.setAttribute("class", "Settings-el Settings-colorName");
				el.innerHTML = colorNames[i] + " Color: ";
				colorDiv.appendChild(el); //add input field name

				for (var j = 0; j < colorPrefix.length; ++j) {
					el = document.createElement("div");
					el.setAttribute("class", "Settings-el");
					el.innerHTML = colorPrefix[j];
					el.style.marginRight = "0";
					colorDiv.appendChild(el); //add r g b

					el = document.createElement("input");
					el.setAttribute("id", "Settings-colorInput" + i + j);
					el.setAttribute("class", "Settings-el");
					el.setAttribute("spellcheck", "false");
					el.setAttribute("type", "number");
					el.setAttribute("min", "0");
					el.setAttribute("max", "255");
					el.setAttribute("step", "5");
					el.onkeyup = colorEditHandler;
					// el.onchange = colorEditHandler;
					el.oninput = colorEditHandler;
					colorDiv.appendChild(el); //add inputs
				}

				el = document.createElement("div");
				el.setAttribute("id", "Settings-colorBox" + i);
				el.setAttribute("class", "Settings-el Settings-colorBox");
				el.style.cursor = "pointer";
				el.title = "Click to open color picker";
				el.setAttribute("role", "button");
				el.setAttribute("tabindex", "0");
				el.setAttribute("aria-label", "Open color picker");
				(function (colorIndex) {
					el.onmouseup = function (e) {
						openColorPicker(colorIndex);
						if (e) e.stopPropagation(); //eat event away from body
					};
					el.onkeydown = function (e) {
						var key = e && (e.key || e.keyCode);
						if (key === "Enter" || key === " " || key === 13 || key === 32) {
							openColorPicker(colorIndex);
							if (e.preventDefault) e.preventDefault();
							if (e.stopPropagation) e.stopPropagation();
						}
					};
				})(i);
				colorDiv.appendChild(el); //add inputs

				el = document.createElement("div");
				el.setAttribute("class", "clearDiv");
				colorDiv.appendChild(el); //new line
			}

			_triedNewAccount = false;
			//get current settings from server
			DesktopContent.XMLHttpRequest("Request?RequestType=getSettings&accounts=1",
				"", settingsRequestHandler);
		} //end settingsRequest()

		//=====================================================================================
		//called to extract color string into form
		function extractRGBtoForm(clr, i) {
			Debug.log("Settings User Preferences: " + i + " - " + clr, Debug.LOW_PRIORITY);

			var el, c;
			el = document.getElementById("Settings-colorBox" + i);
			el.style.backgroundColor = clr;
			clr = clr.substr(clr.indexOf("(") + 1);
			for (var j = 0; j < 3; ++j) {
				el = document.getElementById("Settings-colorInput" + i + j);
				el.value = parseInt(clr);
				clr = clr.substr(clr.indexOf(",") + 1);
			}
		} //end extractRGBtoForm()

		//=====================================================================================
		//extractLayoutToForm ~~
		function extractLayoutToForm() {
			var el;
			for (var i = 0; i < _layoutArray.length && i < _NUM_USER_LAYOUTS; ++i) //_NUM_USER_LAYOUTS user layouts
			{
				el = document.getElementById("winLayoutText" + (i + 1));
				if (_layoutArray[i] == "0") //then unset
					el.innerHTML = "Layout Details: no layout set";
				else
					el.innerHTML = "Layout Details: <a href='#' onmouseup='showLayoutText(" +
						(i + 1) + ",true,event); return false;'>show</a>";
			}

			//if user has privileges _sysLayoutArray is populated
			//toggle the whole sub-column wrapper (not just the inner div) so that, for
			//non-admin users, the hidden column doesn't reserve empty flex space and
			//the remaining title/column stay centered
			el = document.getElementById("windSystemLayoutCol");
			if (!_sysLayoutArray || !_sysLayoutArray.length) //no priveleges
			{
				el.style.display = "none";
				return;
			}
			el.style.display = "block";
			for (var i = 0; i < _sysLayoutArray.length && i < _NUM_SYS_LAYOUTS; ++i) //_NUM_SYS_LAYOUTS system layouts
			{
				el = document.getElementById("winSysLayoutText" + (i + 1));
				if (_sysLayoutArray[i] == "0") //then unset
					el.innerHTML = "Layout Details: no layout set";
				else
					el.innerHTML = "Layout Details: <a href='#' onmouseup='showLayoutText(" +
						(i + 1) + ",true,event,1); return false;'>show</a>";
			}

		} //end extractLayoutToForm()

		//=====================================================================================
		//handle request for current settings
		function settingsRequestHandler(req) {
			Debug.log("settingsRequestHandler " + req.responseText);

			if (DesktopContent._sequence) {
				showPermissionsTooltip();

				//handle wiz mode specially
				extractUserAccounts(req);
				return;
			}


			//extract alert from server
			var serverAlert = DesktopContent.getXMLValue(req, "server_alert");
			if (serverAlert) Debug.log("Message from Server: " + serverAlert, Debug.HIGH_PRIORITY);

			//get username with lock, "" means no one has lock
			_usernameWithLock = DesktopContent.getXMLValue(req, "username_with_lock");
			var pref_username = DesktopContent.getXMLValue(req, "pref_username");
			_prefUsername = pref_username;
			var ots_owner = DesktopContent.getXMLValue(req, "ots_owner");
			var ots_remote_address = DesktopContent.getXMLValue(req, "ots_remote_address");
			var desktop_user_permissions = DesktopContent.getXMLValue(req, "desktop_user_permissions");
			_desktopUserPermissions = desktop_user_permissions;


			var el = document.getElementById("header");
			var lockedBySelf = _usernameWithLock && _usernameWithLock == pref_username;
			var lockedByOther = _usernameWithLock && _usernameWithLock != "" && !lockedBySelf;
			var lockBadgeClass = lockedByOther ? "lockBadge--lockedOther" :
				(lockedBySelf ? "lockBadge--lockedSelf" : "lockBadge--unlocked");
			var lockBadgeText = lockedByOther ?
				("<b>" + escapeHtml(_usernameWithLock) + "</b> currently has the " + escapeHtml(ots_owner) + " ots lock") :
				(lockedBySelf ?
					("You currently have the " + escapeHtml(ots_owner) + " ots lock") :
					(escapeHtml(ots_owner) + " ots is currently unlocked"));
			var lockBadgeAction = (_usernameWithLock && _usernameWithLock != "") ?
				(lockedBySelf ?
					(" &ndash; <a onclick='lockToUsername(-1,false," + escapeHtml(JSON.stringify(pref_username)) + ");'>Click to unlock</a>") :
					((desktop_user_permissions && desktop_user_permissions.indexOf("allUsers: 255") >= 0) ?
						(" &ndash; <a style='color:inherit' onclick='lockToUsername(-1,false," + escapeHtml(JSON.stringify(_usernameWithLock)) + ");'>Click to force unlock</a>") :
						"")) :
				(" &ndash; <a onclick='lockToUsername(-1,true," + escapeHtml(JSON.stringify(pref_username)) + ");'>Click to lock</a>");
			el.innerHTML =
				"<div class='userHeaderCard'>" +
					"<div class='userHeaderTitle'>Preferences &amp; Account Settings for <b>" + escapeHtml(pref_username) + "</b> " +
						"<span class='userHeaderSub'>on " + escapeHtml(ots_owner) + " ots" +
						(ots_remote_address ? (" (" + escapeHtml(ots_remote_address) + ")") : "") + "</span>" +
					"</div>" +
					"<div class='userHeaderMeta'>" +
						"<span class='permBadge'>Access: " + escapeHtml(desktop_user_permissions) + "</span> " +
						"<span class='lockBadge " + lockBadgeClass + "'>" + lockBadgeText + lockBadgeAction + "</span>" +
					"</div>" +
				"</div>";

			//pass preferences to Desktop	but remove user accounts from message to Desktop
			if (_mailbox) {
				var uaStart = req.responseText.indexOf("<users_accounts v");
				var uaEnd = req.responseText.indexOf("</users_accounts>") + String("</users_accounts>").length;
				_mailbox.innerHTML = req.responseText.substr(0, uaStart) + req.responseText.substr(uaEnd);
			}

			//handle colors
			var xmlfields = ["pref_bgcolor", "pref_dbcolor", "pref_wincolor"];
			for (var i = 0; i < xmlfields.length; ++i)
				extractRGBtoForm(DesktopContent.getXMLValue(req, xmlfields[i]), i);

			//get layout array
			_layoutArray = DesktopContent.getXMLValue(req, "pref_layout").split(";");
			Debug.log("Settings layout array " + _layoutArray);

			while (_layoutArray.length < _NUM_USER_LAYOUTS) {
				Debug.log("_layoutArray received invalid. Attempting to fix.");
				_layoutArray.push("0");
			}
			//for array to proper size for sever communication (just in case)
			_layoutArray = _layoutArray.slice(0, _NUM_USER_LAYOUTS);

			//cleanse layoutArray
			for (var i = 0; i < _layoutArray.length; ++i) {
				var layoutEntry = _layoutArray[i].split(',');
				if (_layoutArray[i] == "") _layoutArray[i] = "0";
				Debug.log("layoutEntry", layoutEntry);

				if (_layoutArray[i] != "0" &&
					layoutEntry.length % _NUM_OF_LAYOUT_FIELDS != 0 &&
					layoutEntry.length % 8 != 0) //legacy 8-field format (without per-window scroll fields)
				{
					Debug.log("Error invalid user layout found. Clearing invalid layout: " +
						_layoutArray[i], Debug.HIGH_PRIORITY);
					_layoutArray[i] = "0";
				}
			}

			//get system layout array (only populated if user has sufficient privileges)
			_sysLayoutArray = [];
			if (DesktopContent.getXMLValue(req, "desktop_user_permissions").indexOf(
				"allUsers: 255") >= 0) {
				//we have a super user then
				_sysLayoutArray = DesktopContent.getXMLValue(req, "pref_syslayout").split(";");

				Debug.log("Has system preferences permission. _sysLayoutArray length " + _sysLayoutArray.length);
				while (_sysLayoutArray.length < _NUM_SYS_LAYOUTS) {
					Debug.log("_sysLayoutArray received invalid. Attempting to fix.");
					_sysLayoutArray.push("0");
				}
				//for array to proper size for sever communication (just in case)
				_sysLayoutArray = _sysLayoutArray.slice(0, _NUM_SYS_LAYOUTS);

				//cleanse _sysLayoutArray
				for (var i = 0; i < _sysLayoutArray.length; ++i) {
					var layoutEntry = _sysLayoutArray[i].split(',');
					if (_sysLayoutArray[i] == "") _sysLayoutArray[i] = "0";
					Debug.log("layoutEntry", layoutEntry);

					if (_sysLayoutArray[i] != "0" &&
						layoutEntry.length % _NUM_OF_LAYOUT_FIELDS != 0 &&
						layoutEntry.length % 8 != 0) //legacy 8-field format (without per-window scroll fields)
					{
						Debug.log("Error invalid system layout found. Clearing invalid layout: " +
							_sysLayoutArray[i], Debug.HIGH_PRIORITY);
						_sysLayoutArray[i] = "0";
					}
				}
			} //end admin layouts handling


			Debug.log("System settings layout array " + _sysLayoutArray);
			Debug.log("User settings layout array " + _layoutArray);

			setLayout(-1); //reset layout selection

			//get user accounts
			extractUserAccounts(req);
		} //end settingsRequestHandler()

		//=====================================================================================
		//called to extract from form to RGB string
		function extractUserAccounts(req) {

			el = document.getElementById("accountsTableDiv");
			if (el)
				el.innerHTML = "<img id='loaderGif' src='" + _loaderImagePath + "'>";

			_accountsArray = new Array();
			for (i = 0; i < _accountFields.length && req.responseXML.getElementsByTagName("users_accounts")[0]; ++i)
				_accountsArray.push(req.responseXML.getElementsByTagName("users_accounts")[0].getElementsByTagName(_accountFields[i]));


			//feedback on new account
			if (_triedNewAccount) {
				Debug.log("Settings _triedNewAccount");

				_triedNewAccount = false;
				el = document.getElementById("newAccountFeedbackDiv");

				if (_accountsArray[0].length != _oldAccountSize) {
					var str = "New account added successfully!";
					Debug.log(str, Debug.INFO_PRIORITY);
					if (el) el.innerHTML = "<center  style='padding:5px'><font color='green'>" +
						str + "</font></center>";
				}
				else {
					var str = "New account was not created. Did you have at least 4 characters in the username?";
					Debug.log(str, Debug.HIGH_PRIORITY);
					if (el) el.innerHTML = "<center style='padding:5px'><font color='red'>" +
						str + "</font></center>";
				}

			}


			//apply current sort, search and then display
			sortAccountsBy(_AccountsLastSort, true); //with true, does not display accounts or increment sort type
			displayAccounts();
		} // end extractUserAccounts()

		//=====================================================================================
		//applyAccountsSearch ~~
		//	search through all 3 columns of _AccountsOrderArray
		// 	and delete entries that do not have needle
		function applyAccountsSearch(needle) {

			Debug.log("Settings applyAccountsSearch " + needle);

			_AccountsTriedSearch = true;
			_AccountsLastSearch = needle;

			//reload all entries as possibilities
			if (_AccountsOrderArray.length != _accountsArray[0].length)
				sortAccountsBy(_AccountsLastSort, true); //with true, does not display accounts or increment sort type

			if (needle != "") {
				//apply current sort but do not display
				//sortAccountsBy(_AccountsLastSort,true); //with true, does not display accounts or increment sort type

				//init keep Array
				var keepArray = new Array(_AccountsOrderArray.length);
				for (i = 0; i < _AccountsOrderArray.length; ++i) keepArray[i] = 0;

				//find entries to keep
				for (j = 0; j < _accountFields.length; ++j)
					for (i = 0; i < _AccountsOrderArray.length; ++i)
						if (_accountsArray[j][_AccountsOrderArray[i]].getAttribute('value').indexOf(needle) != -1)
							keepArray[i] = 1; //keep entry at i

				//remove unkept
				for (i = 0; i < _AccountsOrderArray.length; ++i)
					if (!keepArray[i]) {
						keepArray.splice(i, 1);
						_AccountsOrderArray.splice(i--, 1); //remove entry at i, and rewind i to look at new i entry
					}
			}
		} //end applyAccountsSearch()

		//=====================================================================================
		function setAccountsPage(pg) {
			_AccountsPageIndex = pg;
			displayAccounts();
		} //end setAccountsPage()

		//=====================================================================================
		//sortAccountsBy ~~
		//	col is the column to sort on
		//	_AccountsNextSortArray holds the next sort to do for each column
		//		For username and display name... sort=0 := alpha, sort=1 := reverse alpha
		function sortAccountsBy(col, rerunCurrentSort) {
			if (col < 0 || col > 2) { //validate col

				//default sort
				_AccountsOrderArray = new Array(); //reset order to be order from server
				for (i = 0; _accountsArray[0] && i < _accountsArray[0].length; ++i)
					_AccountsOrderArray.push(i);
				if (!rerunCurrentSort) displayAccounts();
				return;
			}

			Debug.log("Settings sortAccountsBy " + col + " - " + _AccountsNextSortArray[col]);

			el = document.getElementById("accountsTableDiv");
			el.innerHTML = "<img id='loaderGif' src='" + _loaderImagePath + "'>";

			_AccountsOrderArray.length = 0; //clear array


			if (rerunCurrentSort) _AccountsNextSortArray[col] = !_AccountsNextSortArray[col]; //revert back to previous, in the end will leave state unchanged
			var hi, lo, p;
			for (i = 0; i < _accountsArray[0].length; ++i) {
				if (!_AccountsOrderArray.length) //empty case
					_AccountsOrderArray.push(i);
				else  //place in proper location within [lo, hi) range
				{
					lo = 0; hi = _AccountsOrderArray.length;
					while (lo < hi) {
						p = lo + Math.floor((hi - lo) / 2);

						//alpha sort and less OR reverse-alpha and more, then look at half-range below
						if ((!_AccountsNextSortArray[col] &&
							_accountsArray[col][i].getAttribute('value') < _accountsArray[col][_AccountsOrderArray[p]].getAttribute('value')) ||
							(_AccountsNextSortArray[col] &&
								_accountsArray[col][i].getAttribute('value') > _accountsArray[col][_AccountsOrderArray[p]].getAttribute('value')))
							hi = p;
						else if (_accountsArray[col][i].getAttribute('value') == _accountsArray[col][_AccountsOrderArray[p]].getAttribute('value'))
							lo = hi = p; //found equal
						else		//look at half range above
							lo = p + 1;
					}

					//new always splice into lo position
					_AccountsOrderArray.splice(lo, 0, i);
				}
				Debug.log(_accountsArray[col][i].getAttribute('value') + " added to " + lo);
			}

			_AccountsNextSortArray[col] = !_AccountsNextSortArray[col]; //get ready for next sort, or leave state unchanged if rerun
			_AccountsLastSort = col;

			applyAccountsSearch(_AccountsLastSearch); //apply search string to new entry list

			if (!rerunCurrentSort) displayAccounts();
		} //end sortAccountsBy()

		//handleAccountsInputKeyDown ~~
		//	allow alphanumeric character only
		function handleAccountsInputKeyDown(e) {
			//Debug.log("Settings handleAccountsInputKeyDown " + e.keyCode);
			if (e.keyCode == 9) return true;		//if tab focus on next box
			else if ((!e.shiftKey && (e.keyCode >= 48 && e.keyCode <= 57)) || //accept numbers but not shifted numbers
				(e.keyCode >= 96 && e.keyCode <= 105) ||	//accept keypad numbers
				(e.keyCode >= 65 && e.keyCode <= 90) || //accept letters and shifted letters
				e.keyCode == 46 || e.keyCode == 8 || //delete, backspace
				e.keyCode == 35 || e.keyCode == 36 ||  //home and end
				(e.keyCode >= 37 && e.keyCode <= 40 || //arrows are accepted
					e.keyCode == 188 || e.keyCode == 186 || e.keyCode == 32)) // Space, Colon, and Comma
				return true;

			return false; //to stop tab and enter (and unaccepted chars) from propagating to window
		}

		//=====================================================================================
		function handleEmailInputKeyDown(e) {
			//Debug.log("Settings handleAccountsInputKeyDown " + e.keyCode);
			if (e.keyCode == 9) return true;		//if tab focus on next box
			else if ((e.keyCode >= 48 && e.keyCode <= 57) || //accept numbers and shifted numbers
				(e.keyCode >= 96 && e.keyCode <= 105) ||	//accept keypad numbers
				(e.keyCode >= 65 && e.keyCode <= 90) || //accept letters and shifted letters
				e.keyCode == 46 || e.keyCode == 8 || //delete, backspace
				e.keyCode == 35 || e.keyCode == 36 ||  //home and end
				(e.keyCode >= 37 && e.keyCode <= 40) ||   //arrows are accepted
				e.keyCode == 188 || e.keyCode == 190) // Comma and dot
				return true;


			return false; //to stop tab and enter (and unaccepted chars) from propagating to window
		}

		//=====================================================================================
		//setServerSettings ~~
		//	This saves the user pref to server.
		//
		//	Note: this is very similar to what happens in DesktopLogin.js/_updateLayoutTimeoutHandler()
		//		They should be changed together.
		function setServerSettings() {
			Debug.log("Settings setServerSettings");
			var data = "";

			//colors
			var colorFields = ["bgcolor", "dbcolor", "wincolor"];
			for (var j = 0; j < 3; ++j)
				data += colorFields[j] + "=" + extractFormToRGB(j) + "&";

			////////////////////////
			//layout

			var tmpAlias, tmpAliasEl;
			if (_selectedLayout >= 1 && _selectedLayout <= _NUM_USER_LAYOUTS) //set new  default layout from desktop mailbox
			{
				_layoutArray[_selectedLayout - 1] = _settingsLayoutMailbox.innerHTML;
			}
			//for array to proper size for sever communication (just in case)
			_layoutArray = _layoutArray.slice(0, _NUM_USER_LAYOUTS);

			//read all user layout alias inputs and sync array
			for (var j = 0; j < _NUM_USER_LAYOUTS; ++j) {
				tmpAliasEl = document.getElementById("winLayoutAlias" + (j + 1));
				if (tmpAliasEl) {
					tmpAlias = tmpAliasEl.value.trim();
					_layoutAliasArray[j] = tmpAlias.length == 0 ? (j + 1) : tmpAlias;
					if (tmpAlias.length == 0) {
						tmpAliasEl.value = "";
						tmpAliasEl.setAttribute("placeholder", "Enter Alias");
					}
				}
			}

			var layoutStr = "";
			for (var j = 0; j < _layoutArray.length; ++j)
				layoutStr += _layoutArray[j] + (j == _layoutArray.length - 1 ? "" : ";");
			data += "layout=" + layoutStr + "&";

			////////////////////////
			//system layout
			if (_selectedLayout >= _NUM_USER_LAYOUTS + 1 && //set new  default layout from desktop mailbox
				_selectedLayout <= _NUM_USER_LAYOUTS + _NUM_SYS_LAYOUTS) {
				_sysLayoutArray[_selectedLayout - 1 - _NUM_USER_LAYOUTS] = _settingsLayoutMailbox.innerHTML;
			}
			//for array to proper size for sever communication (just in case)
			_sysLayoutArray = _sysLayoutArray.slice(0, _NUM_SYS_LAYOUTS);

			//read all system layout alias inputs and sync array
			for (var j = 0; j < _NUM_SYS_LAYOUTS; ++j) {
				tmpAliasEl = document.getElementById("winSysLayoutAlias" + (j + 1));
				if (tmpAliasEl) {
					tmpAlias = tmpAliasEl.value.trim();
					_sysLayoutAliasArray[j] = tmpAlias.length == 0 ? (j + 1) : tmpAlias;
					if (tmpAlias.length == 0) {
						tmpAliasEl.value = "";
						tmpAliasEl.setAttribute("placeholder", "Enter Alias");
					}
				}
			}

			layoutStr = "";
			Debug.log("_sysLayoutArray length " + _sysLayoutArray.length);
			for (var j = 0; j < _sysLayoutArray.length; ++j)
				layoutStr += _sysLayoutArray[j] + (j == _sysLayoutArray.length - 1 ? "" : ";");
			data += "syslayout=" + layoutStr + "&";

			////////////////////////
			//send save req
			data += "aliaslayout=" + _layoutAliasArray + "&";
			data += "sysAliaslayout=" + _sysLayoutAliasArray + "&";

			_triedNewAccount = false;
			Debug.log("Settings Save Preferences -- " + data);
			DesktopContent.XMLHttpRequest("Request?RequestType=setSettings",
				data,
				settingsRequestHandler);
		} //end setServerSettings()

		//=====================================================================================
		//openColorPicker ~~
		//	open a custom color-wheel popup for color box 'i'. As the user drags on the
		//	wheel (hue/saturation) and the brightness slider, the R/G/B inputs are updated
		//	live and the form is refreshed.
		var _colorWheelState = { index: -1, hue: 0, sat: 0, val: 1 };
		function openColorPicker(i) {
			_colorWheelState.index = i;

			//seed wheel HSV from the color box's current R/G/B values
			function clamp255(v) {
				v = parseInt(v);
				if (isNaN(v) || v < 0) return 0;
				return v > 255 ? 255 : v;
			}
			var r = clamp255(document.getElementById("Settings-colorInput" + i + "0").value);
			var g = clamp255(document.getElementById("Settings-colorInput" + i + "1").value);
			var b = clamp255(document.getElementById("Settings-colorInput" + i + "2").value);
			var hsv = _rgbToHsv(r, g, b);
			_colorWheelState.hue = hsv[0];
			_colorWheelState.sat = hsv[1];
			_colorWheelState.val = hsv[2];

			_buildColorWheelPopup();
			_drawColorWheel();
			_syncColorWheelToInputs(); //ensure inputs reflect seed (in case clamped)

			var popup = document.getElementById("Settings-colorWheelPopup");
			popup.style.display = "block";

			//position the popup near the clicked color box
			var box = document.getElementById("Settings-colorBox" + i);
			if (box && box.getBoundingClientRect) {
				var rect = box.getBoundingClientRect();
				var top = rect.bottom + window.pageYOffset + 6;
				var left = rect.left + window.pageXOffset;
				//keep it on-screen horizontally
				var maxLeft = window.pageXOffset + document.documentElement.clientWidth - 230;
				if (left > maxLeft) left = maxLeft;
				if (left < 4) left = 4;
				popup.style.top = top + "px";
				popup.style.left = left + "px";
			}
		} //end openColorPicker()

		//=====================================================================================
		//_buildColorWheelPopup ~~ lazily create the color-wheel popup DOM (once)
		function _buildColorWheelPopup() {
			if (document.getElementById("Settings-colorWheelPopup")) return;

			var popup = document.createElement("div");
			popup.setAttribute("id", "Settings-colorWheelPopup");
			popup.style.position = "absolute";
			popup.style.zIndex = "10000";
			popup.style.display = "none";
			popup.style.padding = "10px";
			popup.style.background = "rgba(40,40,40,0.97)";
			popup.style.border = "1px solid #888";
			popup.style.borderRadius = "6px";
			popup.style.boxShadow = "0 4px 16px rgba(0,0,0,0.5)";
			popup.style.textAlign = "center";
			popup.onmouseup = function (e) { if (e) e.stopPropagation(); }; //don't let body cancel
			popup.onmousedown = function (e) { if (e) e.stopPropagation(); };

			//custom cursor ~~ a transparent ring (no crosshair lines) so the wheel color
			//under the pointer stays visible while picking
			var _wheelCursorSvg = "<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'>" +
				"<circle cx='11' cy='11' r='8' fill='none' stroke='white' stroke-width='2'/>" +
				"<circle cx='11' cy='11' r='8' fill='none' stroke='black' stroke-width='1'/>" +
				"</svg>";
			var _wheelCursor = "url('data:image/svg+xml;utf8," +
				encodeURIComponent(_wheelCursorSvg) + "') 11 11, default";

			var canvas = document.createElement("canvas");
			canvas.setAttribute("id", "Settings-colorWheelCanvas");
			canvas.width = 200;
			canvas.height = 200;
			canvas.style.cursor = _wheelCursor;
			canvas.style.borderRadius = "50%";
			canvas.style.display = "block";

			//wrapper adds a margin around the wheel so the mouse can travel past the
			//edge; edge colors remain selectable because saturation is clamped to 1.
			var WHEEL_PAD = 24; //px of interactive margin around the wheel
			var wheelWrap = document.createElement("div");
			wheelWrap.setAttribute("id", "Settings-colorWheelWrap");
			wheelWrap.style.display = "inline-block";
			wheelWrap.style.padding = WHEEL_PAD + "px";
			wheelWrap.style.cursor = _wheelCursor;
			wheelWrap.appendChild(canvas);
			popup.appendChild(wheelWrap);

			var computeHueSat = function (e) {
				var rect = canvas.getBoundingClientRect();
				var cx = canvas.width / 2, cy = canvas.height / 2;
				var x = (e.clientX - rect.left) - cx;
				var y = (e.clientY - rect.top) - cy;
				var dist = Math.sqrt(x * x + y * y);
				var radius = canvas.width / 2;
				var sat = dist / radius;
				if (sat > 1) sat = 1;
				var hue = Math.atan2(y, x) * 180 / Math.PI;
				if (hue < 0) hue += 360;
				return [hue, sat];
			};
			//hover/drag: preview the color on the swatch only (do NOT commit to inputs)
			wheelWrap.onmousemove = function (e) {
				var hs = computeHueSat(e);
				var rgb = _hsvToRgb(hs[0], hs[1], _colorWheelState.val);
				var swatch = document.getElementById("Settings-colorWheelSwatch");
				if (swatch)
					swatch.style.backgroundColor = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";

				//Throttle expensive wheel redraws
				_colorWheelState._previewHue = hs[0];
				_colorWheelState._previewSat = hs[1];
				if (_colorWheelState._rafPending) return;
				_colorWheelState._rafPending = true;
				requestAnimationFrame(function () {
					_colorWheelState._rafPending = false;
					_drawColorWheel(_colorWheelState._previewHue, _colorWheelState._previewSat);
				});
			};
			//leaving the wheel area: restore preview to the committed color
			wheelWrap.onmouseleave = function () {
				_drawColorWheel();
				var rgb = _hsvToRgb(_colorWheelState.hue, _colorWheelState.sat, _colorWheelState.val);
				var swatch = document.getElementById("Settings-colorWheelSwatch");
				if (swatch)
					swatch.style.backgroundColor = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
			};
			//left click: lock in the selected color and commit to the R/G/B inputs
			wheelWrap.onmousedown = function (e) {
				if (e && e.button !== 0) return; //left click only
				var hs = computeHueSat(e);
				_colorWheelState.hue = hs[0];
				_colorWheelState.sat = hs[1];
				_drawColorWheel();
				_syncColorWheelToInputs(); //commit
				if (e) e.preventDefault();
			};

			//brightness (value) slider
			var sliderWrap = document.createElement("div");
			sliderWrap.style.margin = "8px 0 4px 0";
			var sliderLabel = document.createElement("div");
			sliderLabel.setAttribute("id", "Settings-colorWheelValueLabel");
			sliderLabel.innerHTML = "Brightness";
			sliderLabel.style.color = "#fff";
			sliderLabel.style.fontSize = "12px";
			sliderLabel.style.marginBottom = "2px";
			sliderWrap.appendChild(sliderLabel);
			var slider = document.createElement("input");
			slider.setAttribute("id", "Settings-colorWheelValue");
			slider.setAttribute("type", "range");
			slider.setAttribute("min", "0");
			slider.setAttribute("max", "100");
			slider.setAttribute("value", "100");
			slider.style.width = "180px";
			slider.oninput = function () {
				_colorWheelState.val = parseInt(slider.value) / 100;
				_drawColorWheel();
				_syncColorWheelToInputs();
			};
			sliderWrap.appendChild(slider);
			popup.appendChild(sliderWrap);

			//preview swatch + Close button
			var footer = document.createElement("div");
			footer.style.marginTop = "6px";
			footer.style.display = "flex";
			footer.style.alignItems = "center";
			footer.style.justifyContent = "space-between";

			var swatch = document.createElement("div");
			swatch.setAttribute("id", "Settings-colorWheelSwatch");
			swatch.style.width = "40px";
			swatch.style.height = "24px";
			swatch.style.border = "1px solid #fff";
			swatch.style.borderRadius = "3px";
			footer.appendChild(swatch);

			var closeBtn = document.createElement("input");
			closeBtn.setAttribute("type", "submit");
			closeBtn.setAttribute("class", "DesktopDashboard-button");
			closeBtn.setAttribute("value", "Close");
			closeBtn.onmouseup = function (e) {

				if (e) e.stopPropagation();
			};
			footer.appendChild(closeBtn);

			popup.appendChild(footer);
			document.body.appendChild(popup);

			//Close popup when clicking outside of it (capture to work even when other handlers stopPropagation)
			if (!window._settingsColorWheelCloseHooked) {
				window._settingsColorWheelCloseHooked = true;
				document.addEventListener("mouseup", function (e) {
					var p = document.getElementById("Settings-colorWheelPopup");

					p.style.display = "none";
				}, true);

		//=====================================================================================
		//_drawColorWheel ~~ render the HSV wheel at current brightness with a selection marker.
		//	If previewHue/previewSat are provided, also draw a lighter hover marker there.
		function _drawColorWheel(previewHue, previewSat) {
			var canvas = document.getElementById("Settings-colorWheelCanvas");
			if (!canvas) return;
			var ctx = canvas.getContext("2d");
			var w = canvas.width, h = canvas.height;
			var cx = w / 2, cy = h / 2, radius = w / 2;
			var val = _colorWheelState.val;

			var image = ctx.createImageData(w, h);
			var data = image.data;
			for (var py = 0; py < h; ++py) {
				for (var px = 0; px < w; ++px) {
					var dx = px - cx, dy = py - cy;
					var dist = Math.sqrt(dx * dx + dy * dy);
					var idx = (py * w + px) * 4;
					if (dist > radius) {
						data[idx + 3] = 0; //transparent outside circle
						continue;
					}
					var hue = Math.atan2(dy, dx) * 180 / Math.PI;
					if (hue < 0) hue += 360;
					var sat = dist / radius;
					var rgb = _hsvToRgb(hue, sat, val);
					data[idx] = rgb[0];
					data[idx + 1] = rgb[1];
					data[idx + 2] = rgb[2];
					data[idx + 3] = 255;
				}
			}
			ctx.putImageData(image, 0, 0);

			//draw selection marker
			var ang = _colorWheelState.hue * Math.PI / 180;
			var mr = _colorWheelState.sat * radius;
			var mx = cx + mr * Math.cos(ang);
			var my = cy + mr * Math.sin(ang);
			ctx.beginPath();
			ctx.arc(mx, my, 6, 0, 2 * Math.PI);
			ctx.strokeStyle = "#000";
			ctx.lineWidth = 2;
			ctx.stroke();
			ctx.beginPath();
			ctx.arc(mx, my, 6, 0, 2 * Math.PI);
			ctx.strokeStyle = "#fff";
			ctx.lineWidth = 1;
			ctx.stroke();

			//draw hover preview marker (if provided and different from committed)
			if (typeof previewHue === "number" && typeof previewSat === "number") {
				var pang = previewHue * Math.PI / 180;
				var pr = previewSat * radius;
				var pmx = cx + pr * Math.cos(pang);
				var pmy = cy + pr * Math.sin(pang);
				ctx.beginPath();
				ctx.arc(pmx, pmy, 5, 0, 2 * Math.PI);
				ctx.strokeStyle = "rgba(255,255,255,0.9)";
				ctx.lineWidth = 2;
				ctx.stroke();
			}
		} //end _drawColorWheel()

		//=====================================================================================
		//_syncColorWheelToInputs ~~ push current wheel HSV into the R/G/B inputs + refresh form
		function _syncColorWheelToInputs() {
			var i = _colorWheelState.index;
			if (i < 0) return;
			var rgb = _hsvToRgb(_colorWheelState.hue, _colorWheelState.sat, _colorWheelState.val);
			for (var j = 0; j < 3; ++j)
				document.getElementById("Settings-colorInput" + i + j).value = rgb[j];
			extractRGBtoForm(extractFormToRGB(i), i); //refresh box + inputs (handles alpha)
			var swatch = document.getElementById("Settings-colorWheelSwatch");
			if (swatch) swatch.style.backgroundColor = "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")";
			var slider = document.getElementById("Settings-colorWheelValue");
			if (slider) slider.value = Math.round(_colorWheelState.val * 100);
		} //end _syncColorWheelToInputs()

		//=====================================================================================
		//_hsvToRgb ~~ h in [0,360), s,v in [0,1] -> [r,g,b] each in [0,255]
		function _hsvToRgb(h, s, v) {
			var c = v * s;
			var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
			var m = v - c;
			var r = 0, g = 0, b = 0;
			if (h < 60) { r = c; g = x; b = 0; }
			else if (h < 120) { r = x; g = c; b = 0; }
			else if (h < 180) { r = 0; g = c; b = x; }
			else if (h < 240) { r = 0; g = x; b = c; }
			else if (h < 300) { r = x; g = 0; b = c; }
			else { r = c; g = 0; b = x; }
			return [
				Math.round((r + m) * 255),
				Math.round((g + m) * 255),
				Math.round((b + m) * 255)
			];
		} //end _hsvToRgb()

		//=====================================================================================
		//_rgbToHsv ~~ r,g,b in [0,255] -> [h(0-360), s(0-1), v(0-1)]
		function _rgbToHsv(r, g, b) {
			r /= 255; g /= 255; b /= 255;
			var max = Math.max(r, g, b), min = Math.min(r, g, b);
			var d = max - min;
			var h = 0;
			if (d != 0) {
				if (max == r) h = ((g - b) / d) % 6;
				else if (max == g) h = (b - r) / d + 2;
				else h = (r - g) / d + 4;
				h *= 60;
				if (h < 0) h += 360;
			}
			var s = max == 0 ? 0 : d / max;
			return [h, s, max];
		} //end _rgbToHsv()

		//=====================================================================================
		//showLayoutText ~~
		//	layout window fields (per window, 10 fields):
		//		0: _windows[i].getWindowName()
		//		1: _windows[i].getWindowSubName()
		//		2: _windows[i].getWindowUrl().replace(/&/g,'%38').replace(/=/g,'%61')  //global replace & and =
		//		3: (((_windows[i].getWindowX()-dx)/dw)|0)
		//		4: (((_windows[i].getWindowY()-dy)/dh)|0)
		//		5: ((_windows[i].getWindowWidth()/dw)|0)
		//		6: ((_windows[i].getWindowHeight()/dh)|0)
		//		7: window state encoding ("0" = minimized, "1" = normal, "2" = maximized)
		//		8: iframeScrollX  //per-window iframe scroll left in pixels
		//		9: iframeScrollY  //per-window iframe scroll top in pixels
		//
		function showLayoutText(i, show, mouseEvent, isSystemLayout) {
			if (mouseEvent)
				mouseEvent.stopPropagation(); //do nothing but eat event away from body, so body mouseup doesn't cancel

			var str = "";
			var sysTxt = isSystemLayout ? "Sys" : "";
			var el = document.getElementById("win" + sysTxt + "LayoutText" + i);
			if (show) {
				str = "Layout Details: <a href='#' onmouseup='showLayoutText(" + i + ",false,event," +
					(isSystemLayout ? 1 : 0) + "); return false;'>hide</a><br>";
				var winLayArr = (isSystemLayout ?
					_sysLayoutArray : _layoutArray)[i - 1].split(",");

				//auto-detect layout format: 10 fields (with per-window scroll) vs 8 fields (legacy)
				var numOfFields = 8; //default to legacy format
				var rem10 = winLayArr.length % 10;
				var rem8 = winLayArr.length % 8;
				if (rem10 == 0) {
					if (rem8 == 0 && winLayArr.length > 10) {
						//ambiguous - check if field 8 is numeric (scroll value) to disambiguate
						if (!isNaN(winLayArr[8]))
							numOfFields = 10;
					} else
						numOfFields = 10; //unambiguously new format
				}

				//destroy 7 field approach (new way adds the 8th field for isMinimized)
				var num = parseInt(winLayArr.length / numOfFields); //numOfFields fields per window
				str += "~ Layout of " + num + " Window" + ((num == 1) ? "" : "s") + " ~<br>";

				var fieldArr = ["X", "Y", "W", "H", ""];
				for (var i = 0; i < num; ++i) {
					str += "&nbsp;&nbsp;&nbsp;&nbsp;" +
						decodeURIComponent(winLayArr[i * numOfFields]) +
						" - " +
						decodeURIComponent(winLayArr[i * numOfFields + 1]) +
						" - ";

					for (var j = 3; j < 8; ++j)
						if (j < 7)
							str += ((j - 3) ? ", " : "") + fieldArr[j - 3] + ":" +
								(Math.round(winLayArr[i * numOfFields + j] / 100) | 0) + "%";
						else if (winLayArr[i * numOfFields + j] == "0") //then minimized
							str += ", Minimized";
						else if (winLayArr[i * numOfFields + j] == "2") //then maximized
							str += ", Maximized";

					//display per-window scroll position (if present in 10-field format)
					if (numOfFields >= 10) {
						var winScrollX = winLayArr[i * numOfFields + 8] | 0;
						var winScrollY = winLayArr[i * numOfFields + 9] | 0;
						if (winScrollX || winScrollY)
							str += ", Scroll - Left:" + winScrollX + "px, Top:" + winScrollY + "px";
					}
					str += "<br>";
				}
			}
			else
				str = "Layout Details: <a href='#' onmouseup='showLayoutText(" + i + ",true,event," +
					(isSystemLayout ? 1 : 0) + "); return false;'>show</a>";

			el.innerHTML = str;
		} //end showLayoutText()

		function updateAccount(i) {
			Debug.log("Settings updateAccount-" + i);

			var dnEl = document.getElementById("accountsDisplayName" + i);
			var pEl = document.getElementById("accountsPermissions" + i);
			var emEl = document.getElementById("accountsEmail" + i);
			var username = _accountsArray[0][i].getAttribute('value');
			var beforePermissions = _accountsArray[3][i].getAttribute('value');
			var requestedPermissions = pEl.value;

			Debug.log("Settings updateAccount-" + username + ":" + emEl.value +
				":" + dnEl.value + ":" + pEl.value);

			var data = "";
			data += "type=updateAccount&";
			data += "username=" + username + "&";
			data += "useremail=" + emEl.value + "&";
			data += "displayname=" + dnEl.value + "&";
			data += "permissions=" + pEl.value + "&";

			_triedNewAccount = false;

			var updateAccountHandler = function(req) {
				settingsRequestHandler(req);

				if (beforePermissions == requestedPermissions)
					return;

				var assignedPermissionsNote = "";
				var trimmedRequestedPermissions = requestedPermissions ? requestedPermissions.trim() : "";
				if (beforePermissions && beforePermissions.indexOf(",") >= 0 &&
					trimmedRequestedPermissions && trimmedRequestedPermissions.indexOf(",") < 0 &&
					trimmedRequestedPermissions.indexOf(":") < 0)
					assignedPermissionsNote =
						"The assigned permissions value was <b>" + trimmedRequestedPermissions +
						"</b>, which will be assigned to the allUsers permissions group.<br>";

				var afterPermissions = requestedPermissions;
				for (var accountIndex = 0; _accountsArray && _accountsArray[0] &&
					accountIndex < _accountsArray[0].length; ++accountIndex)
					if (_accountsArray[0][accountIndex].getAttribute('value') == username) {
						afterPermissions = _accountsArray[3][accountIndex].getAttribute('value');
						break;
					}

				Debug.info(assignedPermissionsNote +
					"Updated permissions for user '<b>" + username + "</b>'.<br>" +
					"Before: <b>" + beforePermissions + "</b><br>" +
					"After: <b>" + afterPermissions + "</b>");
			}; //end updateAccountHandler()

			DesktopContent.XMLHttpRequest("Request?RequestType=accountSettings&accounts=1",
				data, updateAccountHandler);

		} //end updateAccount()

				"The expected interpretation of <b>permission index</b> values are as follows (any number from 0 to 255 is valid): " +

				"</b></INDENT>" +
				"\n\n" +
				"On the server side, system administrators must setup <b>Application Supervisor</b> request handling for custom <b>group names</b> to be effective. " +
				"<b>Application Supervisor properties</b> can be created in the <b>configuration tree</b> to override default request handling settings. " +
				"<b>Front-End Macros</b> also have a <b>permissions string</b> which must be setup by the plugin creators in the source code." +
				"");

		} //end showPermissionsTooltip()

	</script>

</head>
