    <style type="text/css">
        body {
            background-color: transparent;
            font-family: 'Comfortaa', serif;
        }

        #clearDiv {
            clear: both;
        }

        #consoleInstructions, #consoleConnectionStatus {
            float: left;
            margin: 6px 0 0 6px;
            font-size: 12px;
            color: #4D2600;
        }

            #consoleConnectionStatus a {
                color: rgb(255,51,51);
            }


        #userLink, #clearConsoleLink, #downloadIconDiv,
        #pauseControlsLink, #navLatestControlsLink, #navOldestControlsLink {
            float: right;
            margin: 2px 2px 2px 20px;
        }


        button, select, input, option {
            font-family: 'Comfortaa', serif;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: #4D2600;
            font-weight: 800;
            cursor: pointer;
        }

            a:hover {
                text-decoration: underline;
            }

        #consoleHistory a {
            color: inherit;
        }

            #consoleHistory a:hover {
                font-size: 14px;
            }

        .userTitle {
            color: #4D2600;
            font-style: italic;
            text-decoration: underline;
        }

        .consoleLink {
            font-size: 12px;
            font-weight: 400;
            white-space: nowrap;
        }


        .controlsCheckbox {
            float: left;
            margin-left: 0px;
            margin-bottom: -10px;
        }

            .controlsCheckbox div {
                float: left;
                margin: -4px 6px 0 2px;
            }

            .controlsCheckbox input {
                float: left;
                margin: 0 0 0 0;
            }

        #noWrapCheckboxText { /*make sure this checkbox doesnt wrap (haha) to new line*/
            margin-right: -10px;
            margin-bottom: 18px; /*push down 2nd row*/
        }


        /* ***************** CONSOLE HISTORY ******************************************/
        #consoleHistoryContainer {
            position: absolute;
            padding: 15px 2px 15px 15px;
            text-align: left;
            color: #4D2600;
            box-shadow: inset rgba(255,254,255,0.6) 0 0.3em .3em, inset rgba(0,0,0,0.15) 0 -0.1em .3em, /* inner shadow */
            rgba(200, 200, 200,0.6) 0 .1em 3px, rgba(200, 200, 200,0.6) 0 .1em 1px, /* color border */
            rgba(0,0,0,0.2) 0 .5em 5px; /* drop shadow */
            border-radius: 3px;
            font-family: 'Inconsolata', monospace;
            font-size: 14px;
        }

        #consoleHistory {
            overflow-x: auto;
            overflow-y: scroll;
            font-weight: 600;
        }

            #consoleHistory::-webkit-scrollbar {
                height: 12px;
                width: 12px;
                background: rgba(0,0,0,0);
            }

                #consoleHistory::-webkit-scrollbar:hover {
                    background: rgba(0,0,0,0.3);
                }

                #consoleHistory::-webkit-scrollbar:vertical:hover {
                    border-top: 1px solid #4D2600;
                    border-bottom: 1px solid #4D2600;
                }

                #consoleHistory::-webkit-scrollbar:horizontal:hover {
                    border-left: 1px solid #4D2600;
                    border-right: 1px solid #4D2600;
                }

            #consoleHistory::-webkit-scrollbar-thumb {
                background: white;
                -webkit-border-radius: 1ex;
            }

            #consoleHistory::-webkit-scrollbar-corner {
                display: none;
            }

            #consoleHistory .lineNumberEntry {
                font-size: 8px;
            }

        /* ***************** USER AREA ******************************************/

        #usersContainer {
            position: absolute;
            padding: 15px 2px 8px 8px;
            text-align: left;
            color: #4D2600;
            box-shadow: inset rgba(255,254,255,0.6) 0 0.3em .3em, inset rgba(0,0,0,0.15) 0 -0.1em .3em, /* inner shadow */
            rgba(200, 200, 200,0.6) 0 .1em 3px, rgba(200, 200, 200,0.6) 0 .1em 1px, /* color border */
            rgba(0,0,0,0.2) 0 .5em 5px; /* drop shadow */
            border-radius: 3px;
        }

        #usersArea {
            overflow-y: scroll;
            overflow-x: auto;
        }

            #usersArea::-webkit-scrollbar {
                height: 12px;
                width: 12px;
                background: rgba(0,0,0,0);
            }

                #usersArea::-webkit-scrollbar:hover {
                    background: rgba(0,0,0,0.3);
                }

                #usersArea::-webkit-scrollbar:vertical:hover {
                    border-top: 1px solid #4D2600;
                    border-bottom: 1px solid #4D2600;
                }

                #usersArea::-webkit-scrollbar:horizontal:hover {
                    border-left: 1px solid #4D2600;
                    border-right: 1px solid #4D2600;
                }

            #usersArea::-webkit-scrollbar-thumb {
                background: #4D2600;
                -webkit-border-radius: 1ex;
            }

            #usersArea::-webkit-scrollbar-corner {
                background: rgba(0,0,0,0.0);
            }


        /* ***************** CONTROLS AREA ******************************************/

        #consoleMenuBar {
            display: flex;
        }

        #controlsContainer, #advancedArea {
            position: absolute;
            padding: 13px 13px 17px 8px;
            text-align: left;
            color: #4D2600;
            border-style: groove;
            border-top-style: none;
            border-radius: 0 5px 5px 5px;
        }

        #controlsContainer {
            box-shadow: inset rgba(255,254,255,0.6) 0 0.3em .3em, inset rgba(0,0,0,0.15) 0 -0.1em .3em, /* inner shadow */
            rgba(200, 200, 200,0.6) 0 .1em 3px, rgba(200, 200, 200,0.6) 0 .1em 1px, /* color border */
            rgba(0,0,0,0.2) 0 .5em 5px; /* drop shadow */
        }


        #advancedControlsLink {
            margin-left: 25px;
        }

        .countsTable {
            font-size: 12px;
        }

            .countsTable a {
                white-space: nowrap;
            }

        .advancedTabButton {
            background-color: #010101;
        }

        #advancedContainer {
            display: none;
            z-index: 1000;
            padding: 15px 0px 15px 15px;
            width: 60%; /* Workaround for absolute placement of usersContainer */

            -webkit-user-select: none; /* to stop text highlights */
            -moz-user-select: none;
            user-select: none;
            /* background-color: #c4cec6; */
        }

        #advancedArea {
            background-color: #efd8d8;
            overflow: none;
            font-size: 13px;
        }

        #ac_traceModeSelectDiv, ac_traceModeSelectDivButtons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #ac_traceModeSelect {
            height: 30px;
            border: none;
            overflow: hidden;
            background-color: transparent;
            cursor: default;
        }

            #ac_traceModeSelect:focus {
                outline: none;
            }

            #ac_traceModeSelect option {
                display: inline-block;
                background-color: transparent;
                width: 60px;
                padding: 5px 0;
                font-weight: bold;
                text-align: center;
                margin-right: 20px;
                border: solid 1px #4D2600;
                color: rgb(35, 108, 176);
                border-radius: 5px;
                box-shadow: inset rgba(255,254,255,0.6) 0 0.3em .3em, inset rgba(0,0,0,0.15) 0 -0.1em .3em, /* inner shadow */
                rgba(200, 200, 200,0.6) 0 .1em 3px, rgba(200, 200, 200,0.6) 0 .1em 1px, /* color border */
                rgba(0,0,0,0.2) 0 .5em 5px; /* drop shadow */
            }

                #ac_traceModeSelect option:hover {
                    background-color: #706f97;
                    color: white;
                }

                #ac_traceModeSelect option:checked {
                    background-color: #4D2600;
                    color: white;
                }

        #advancedArea table {
            border-spacing: 0;
        }

        #advancedControlsTabs {
            margin-top: 20px;
            display: flex;
            flex-flow: row wrap-reverse;
        }

        #advancedControlsCloseButton {
            float: right;
            font-family: Comfortaa, serif;
            font-weight: bold;
            margin: -10px 5px -8px 0;
            font-size: 10px;
            cursor: pointer;
        }

        #advancedControlsTable {
            overflow-x: auto;
            overflow-y: hidden;
            width: 100%;
            height: 90%;
            background-color: rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.2);
            border-top: 2px solid rgba(255,255,255,0.5);
        }

        #advancedControlsTableHeader {
            width: fit-content;
            background-color: rgba(0,0,0,0.2);
            height: 16px;
            border-bottom: 1px solid rgba(0,0,0,0.3);
            margin-bottom: 1px;
        }

            #advancedControlsTableHeader div {
                border-left: 1px solid rgba(0,0,0,0.3);
                border-right: 1px solid rgba(0,0,0,0.3);
                padding: 2px 4px 1px;
                float: left;
                font-weight: bold;
            }

        #advancedControlsTableRows {
            overflow-x: hidden;
            overflow-y: auto;
            width: fit-content;
            height: calc(100% - 20px);
        }

            #advancedControlsTableRows td {
                white-space: nowrap;
                border-left: 1px solid rgba(0,0,0,0.3);
                border-right: 1px solid rgba(0,0,0,0.3);
                padding: 2px 4px 0;
            }

            #advancedControlsTableRows tr:nth-child(even) {
                background: rgba(255,255,255,0.3);
            }

        .ac_bitstring {
            width: 256px; /*64*4*/
        }

        .ac_maskbit {
            width: 4px;
            height: 10px;
            float: left;
            cursor: pointer;
        }

        .ac_maskbitOFF {
            background-color: rgb(14, 97, 28);
            border-top: 1px solid #c4cec6;
            border-bottom: 1px solid black;
        }

            .ac_maskbitOFF:hover {
                background-color: rgb(239, 160, 63);
            }

        .ac_maskbitON {
            background-color: rgb(102, 255, 51);
            border-top: 1px solid white;
            border-bottom: 1px solid green;
        }

            .ac_maskbitON:hover {
                background-color: rgb(255, 26, 26);
            }

        #ac_popupBox {
            position: absolute;
            padding: 4px 0 4px 4px;
            background-color: rgb(216, 232, 241);
            color: rgb(68, 76, 107);
            /*border:				2px solid rgb(185,185,185);*/
            border-radius: 2px;
            font-size: 11px;
            box-shadow: 1px 1px 5px #666;
            width: 260px;
        }

        .ac_checkboxSelect {
            margin: -1px -3px -3px;
            cursor: pointer;
        }

        #advancedControlsTableHeader .ac_checkboxSelect {
            margin: -1px -3px -3px;
        }

        #advancedControlsTableRows .ac_checkboxSelect {
            margin: 1px -3px -3px;
        }

        #ac_bitstringEditable {
            margin: 2px 0 4px 22px;
            height: 12px;
        }

        #chatText {
            border-bottom: 3px solid rgb(123 13 13);
        }
    </style>

        function init() {
            DesktopContent.setWindowTooltip(
                "Welcome to the Console web app!\n\n" +
                "This web app provides a read-only view of the printouts generated " +
                "by your <i>ots</i> system. " +
                "TRACE is the tool that <i>ots</i> uses to printout, save, and manage messages with consideration for level/severity." +
                "\n\n" +
                "This web app is composed of two primary panels: the <b>main display panel</b> on the left, and the <b>controls side bar</b> on the right. " +
                "The main display panel shows the printouts in a scrolling box with the most recent messages on the bottom. The updating can be paused, and old messages can be cleared from the scrolling box by using the links in the top-right. " +
                "The control side bar allows for filtering and counting of the messages shown in the scrolling message display box." +
                "\n\n" +
                "In the control side bar, there is also access to <b>Advanced Controls</b>. There you can access the TRACE severity enabling masks " +
                "to disable message generation during run-time by setting or clearing the TRACE level/severity bit masks. For additional information on the Advanced Controls, " +
                "click Advanced in the control side bar and a dedicated tooltip will appear." +
                "");

            var styleEl = document.getElementsByTagName('style')[0];
            var str = styleEl.innerHTML;
            Debug.log("Changing primary foreground color to " + DesktopContent.getDefaultDesktopColor());
            str = str.replace(/#4D2600/g, DesktopContent.getDefaultDesktopColor());
            styleEl.innerHTML = str;

            document.body.style.backgroundColor = DesktopContent.getDefaultWindowColor();

            _historyEl = document.getElementById('consoleHistory');
            _historyContainerEl = document.getElementById('consoleHistoryContainer');
            _usersEl = document.getElementById('usersArea');
            _usersContainerEl = document.getElementById('usersContainer');
            _consoleEl = document.getElementById('chatText');
            _linkEl = document.getElementById('userLinkText');
            _controlsContainerEl = document.getElementById('controlsContainer');
            _controlsEl = document.getElementById('controlsArea');

            _consoleContainerEl = document.getElementById('consoleHistoryContainer');
            _advancedContainerEl = document.getElementById('advancedContainer');
            _advancedContainerEl.style.backgroundColor = DesktopContent.getDefaultWindowColor();
            _advancedEl = document.getElementById('advancedArea');

            _compactViewCheckbox = document.getElementById('compactView');
            _compactViewCheckbox.onmouseup = toggleCompactView;
            _noWrapCheckbox = document.getElementById('noWrapCheckbox');
            _noWrapCheckbox.onmouseup = toggleNoWrap;
            _hideLineNumbersCheckbox = document.getElementById('hideLineNumbersCheckbox');
            _hideLineNumbersCheckbox.onmouseup = toggleHideLineNumber;
            _noHostCheckbox = document.getElementById('noHostCheckbox');
            _noHostCheckbox.onmouseup = toggleNoHost;


            //init console history
            _consoleEl.innerHTML = _CONSOLE_START_MESSAGE;

            window.onresize = function (e) { redrawConsoleWindow(); /*ignore event and pass undefined to keep same side bar status*/ };
            _historyEl.onmousewheel = handleUserInputScroll;
            _historyEl.onmousedown = handleUserInputScroll;
            _historyEl.onscroll = handleUserScroll;
            _historyEl.onmousemove = handleMouseMoveScroll;

            redrawConsoleWindow(); //setup window divs
            initSideBar();

            getConsoleUpdates(); //get initial update

            _compactViewCheckbox.disabled = false; 	//enable compact view checkbox selection
            _compactViewCheckbox.checked = true; 	//inverse of default value
            _noWrapCheckbox.disabled = false; 		//enable checkbox selection
            _noWrapCheckbox.checked = false;		//inverse of default value
            _hideLineNumbersCheckbox.disabled = false; 		//enable checkbox selection
            _hideLineNumbersCheckbox.checked = true;		//inverse of default value
            _noHostCheckbox.disabled = false; 				//enable checkbox selection
            _noHostCheckbox.checked = true;				//inverse of default value (hidden by default)

            toggleNoWrap(undefined, undefined, true /*doNotSave*/); 			//call to setup no wrap first time
            toggleCompactView(undefined, undefined, true /*doNotSave*/); 		//call to setup compact view first time

        //=====================================================================================
        //getShortenedHostname ~
        //  Returns the shortened display name for a hostname. Caches results.
        //  On first call for a new hostname, recomputes all short names.
        function getShortenedHostname(hostname) {
            if (!hostname) return "";
            if (_hostnameShortMap.hasOwnProperty(hostname))
                return _hostnameShortMap[hostname];

            _knownHostnames.push(hostname);
            _recomputeShortenedHostnames();
            return _hostnameShortMap[hostname] || hostname;
        } //end getShortenedHostname()

        //=====================================================================================
        //_recomputeShortenedHostnames ~
        //  Splits each hostname into segments (by -, _, .), finds segments common
        //  to ALL hostnames, and strips them — keeping only the unique parts.
        //  Segments that are purely numeric or adjacent to a numeric segment are never stripped.
        //  Single hostname: just strip the domain suffix.
        function _recomputeShortenedHostnames() {
            var hosts = _knownHostnames;
            if (hosts.length === 0) return;

            if (hosts.length === 1) {
                var h = hosts[0];
                var dotIdx = h.indexOf(".");
                _hostnameShortMap[h] = (dotIdx > 0) ? h.substring(0, dotIdx) : h;
                return;
            }

            // Strip domain suffix (everything after the first '.') before
            // shortening — domain segments like "fnal.gov" are always common
            // and would interfere with the adjacency logic below.
            var primaryNames = [];
            for (var i = 0; i < hosts.length; i++) {
                var dotIdx = hosts[i].indexOf(".");
                primaryNames.push(dotIdx > 0 ? hosts[i].substring(0, dotIdx) : hosts[i]);
            }

            // Tokenize each primary hostname by '-' and '_'
            var tokenized = [];
            for (var i = 0; i < primaryNames.length; i++) {
                var parts = [];
                var delims = [];
                var cur = "";
                for (var c = 0; c < primaryNames[i].length; c++) {
                    var ch = primaryNames[i][c];
                    if (ch === '-' || ch === '_') {
                        parts.push(cur);
                        delims.push(ch);
                        cur = "";
                    } else {
                        cur += ch;
                    }
                }
                parts.push(cur);
                tokenized.push({parts: parts, delims: delims});
            }

            // Find common segments: a segment position is common if identical
            // across ALL hostnames AND not purely numeric
            var maxLen = 0;
            for (var i = 0; i < tokenized.length; i++)
                if (tokenized[i].parts.length > maxLen) maxLen = tokenized[i].parts.length;

            var isCommon = [];
            for (var pos = 0; pos < maxLen; pos++) {
                var val = (tokenized[0].parts.length > pos) ? tokenized[0].parts[pos] : null;
                var allSame = (val !== null);
                if (allSame) {
                    for (var h = 1; h < tokenized.length; h++) {
                        if (tokenized[h].parts.length <= pos || tokenized[h].parts[pos] !== val) {
                            allSame = false;
                            break;
                        }
                    }
                }
                var isNum = (val !== null && /^\d+$/.test(val));
                isCommon.push(allSame && !isNum);
            }

            // Keep common segments adjacent to a varying numeric segment so they
            // act as a label (e.g. "mu2e-calo-01"/"mu2e-calo-02" → "calo-01"/
            // "calo-02" instead of just "01"/"02").
            for (var pos = 0; pos < isCommon.length; pos++) {
                if (!isCommon[pos]) continue;
                for (var side = -1; side <= 1; side += 2) {
                    var adj = pos + side;
                    if (adj < 0 || adj >= isCommon.length || isCommon[adj]) continue;
                    var anyNum = false;
                    var allSameAdj = true;
                    var firstVal = (tokenized[0].parts.length > adj) ? tokenized[0].parts[adj] : null;
                    for (var h = 0; h < tokenized.length; h++) {
                        var v = (tokenized[h].parts.length > adj) ? tokenized[h].parts[adj] : null;
                        if (/^\d+$/.test(v)) anyNum = true;
                        if (v !== firstVal) allSameAdj = false;
                    }
                    if (anyNum && !allSameAdj) { isCommon[pos] = false; break; }
                }
            }

            // Build short names from non-common segments
            for (var i = 0; i < hosts.length; i++) {
                var t = tokenized[i];
                var shortParts = [];
                for (var pos = 0; pos < t.parts.length; pos++) {
                    if (!isCommon[pos]) {
                        if (shortParts.length > 0)
                            shortParts.push(t.delims[pos - 1] || "-");
                        shortParts.push(t.parts[pos]);
                    }
                }
                var shortName = shortParts.join("");
                if (shortName.length <= 3)
                    shortName = primaryNames[i];
                _hostnameShortMap[hosts[i]] = shortName;
            }

            // If stripping domains created collisions (e.g. same primary name,
            // different domains), append the domain to disambiguate.
            var seen = {};
            var collisions = {};
            for (var i = 0; i < hosts.length; i++) {
                var sn = _hostnameShortMap[hosts[i]];
                if (seen[sn] !== undefined) {
                    collisions[sn] = true;
                }
                seen[sn] = i;
            }
            if (Object.keys(collisions).length > 0) {
                for (var i = 0; i < hosts.length; i++) {
                    var sn = _hostnameShortMap[hosts[i]];
                    if (collisions[sn]) {
                        var dotIdx = hosts[i].indexOf(".");
                        var domain = (dotIdx > 0) ? hosts[i].substring(dotIdx) : "";
                        _hostnameShortMap[hosts[i]] = sn + domain;
                    }
                }
            }
        } //end _recomputeShortenedHostnames()

        //=====================================================================================
        //cleanHostForDisplay ~
        //  Strips 'artdaq..' prefix, '-data'/'-ipmi' suffixes, then shortens via
        //  getShortenedHostname(). Used for Advanced tab host display.
        function cleanHostForDisplay(rawHost) {
            if (!rawHost) return "";
            var h = rawHost;
            if (h.indexOf("artdaq..") === 0) h = h.substring(8);
            h = h.replace(/-data(?=\.|$)/g, "").replace(/-ipmi(?=\.|$)/g, "");
            return getShortenedHostname(h);
        } //end cleanHostForDisplay()

        //=====================================================================================
        //convertForClient ~
        //	replace html/xhtml reserved characters with equivalent for client display.
        //	reserved: ", ', &, <, >, newline, space
        function convertForClient(str) {

            //tab &#009; %09
            //is 8 spaces on linux console - do the same
            var t;
            var s;
            var i, c;
            var tabSz = 8;
            while ((t = str.indexOf("\t")) != -1) {
                s = ""; //determine the number of spaces to represent the tab as
                c = (tabSz - (t % tabSz));
                if (c <= 1) c += tabSz; //make sure tab space is > 1
                for (i = 0; i < c; ++i)
                    s += "&nbsp;";
                str = [str.slice(0, t), s, str.slice(t + 1)].join('');
            }

            //replace special HTML chars-----------
            return str
                .replace(/%26/g, "&amp;")  			//&
                .replace(/%3C/g, "&lt;") 				//<
                .replace(/%3E/g, "&gt;")				//>
                .replace(/</g, "&lt;") 				//< (double check depending on how data was inserted by user)
                .replace(/>/g, "&gt;")					//> (double check depending on how data was inserted by user)
                .replace(/%22/g, "&quot;")				//"
                .replace(/%27/g, "&#039;")				//'
                .replace(/%0A%0D/g, "<br>")			//newline
                .replace(/%20%20/g, "&nbsp;&nbsp;");	//space

        } //end convertForClient()

        //=====================================================================================
        //handleRefreshConsole ~
        // 	handle server response, even on error
        var _localRefreshTimeout = _REFRESH_INTERVAL;
        function handleRefreshConsole(req, param) {
            // Debug.logv({_scrollWithNewChats});

            if (param && param == "prepend") {
                Debug.log("Prepending older messages!");
            }

            if (!req) {
                Debug.log("Console handleRefreshConsole req=0!");// + req.responseText);
                document.getElementById("consoleConnectionStatus").style.display = "block"; //show DISCONNECTED
                return;
            }

            var err = DesktopContent.getXMLValue(req, "Error");
            if (err) {
                Debug.log(err, Debug.HIGH_PRIORITY);
                document.getElementById("consoleConnectionStatus").style.display = "block"; //show DISCONNECTED
                return; //this stops refershing, because no future refresh is schedule
            }

            var tmp = DesktopContent.getXMLValue(req, "last_update_index");
            if (tmp) { _lastUpdateIndex = tmp; /*Debug.logv({_lastUpdateIndex});*/ }
            tmp = DesktopContent.getXMLValue(req, "last_update_count");
            if (tmp) { _lastUpdateCount = tmp; /*Debug.logv({_lastUpdateCount});*/ }
            tmp = DesktopContent.getXMLValue(req, "earliest_update_count");
            if (tmp && ((tmp | 0) < _firstUpdateCount || _firstUpdateCount == -1)) { _firstUpdateCount = tmp | 0; /*Debug.logv({_firstUpdateCount});*/ }

            //Debug.log("Chat _lastUpdateIndex now is " + _lastUpdateIndex);

            var msgs = req.responseXML.getElementsByTagName("messages")[0];
            let msgStr;
            if (msgs && msgs.children.length && //if messages list is present in req
                (msgStr = DesktopContent.getXMLValue(msgs.children[0])) &&
                msgStr.length > 5) //and has data
            {
                //giant JSON blob is faster than filling xml on server side
                _consoleMessageArray = JSON.parse(msgStr);

                if (_consoleMessageArray.length)
                    Debug.log("Received", _consoleMessageArray.length, "messages with",
                        Object.keys(_consoleMessageArray[0]).length, "fields.");
                if (Object.keys(_consoleMessageArray[0]).length != _consoleMessageFields.length) {
                    Debug.err("Console message field count mismatch! Expected " +
                        _consoleMessageFields.length + " got " +
                        Object.keys(_consoleMessageArray[0]).length);
                }
                else {
                    updateConsoleHistory(param);
                    updateSideBarCounts(); //must be called after console history update

                    _localRefreshTimeout = 100; //ms, refresh more often if we just got data
                }
            }
            else //set timeout in ms, refresh more often if we just got data
            {
                if (_localRefreshTimeout != _REFRESH_INTERVAL)
                    _localRefreshTimeout *= 4;
                if (_localRefreshTimeout > _REFRESH_INTERVAL)
                    _localRefreshTimeout = _REFRESH_INTERVAL;
                Debug.logv({ _localRefreshTimeout });
            }

            document.getElementById("consoleConnectionStatus").style.display = "none"; //hide DISCONNECTED

            if (_consoleUpdateTimer) //only allow one timer for updates at a time
                clearTimeout(_consoleUpdateTimer);
            _consoleUpdateTimer = window.setTimeout(getConsoleUpdates, _localRefreshTimeout); //schedule next update
        } //end handleRefreshConsole()

        //=====================================================================================
        //updateConsoleHistory ~
        // 	add console history from _consoleMessageArray
        //	param can be "prepend" to prepend older messages to the top of the history
        function updateConsoleHistory(param) {
            if (!_consoleMessageArray) //if _consoleMessageArray undefined, do nothing (should never happpen?)
            {
                Debug.log("Console updateConsoleHistory: undefined message array");
                return;
            }

            var newChatFound = false;
            var str = "";
            var tmp = {};  //tmp holder of values we care to observer
            for (var f in _FIELDS_TO_OBSERVE)
                tmp[_FIELDS_TO_OBSERVE[f]] = {};

            var firstMsg, secondMsg, secondMsgIndex;

            var observedSz = {};
            for (var f in _FIELDS_TO_OBSERVE) //accumulate field values and their counts
                observedSz[_FIELDS_TO_OBSERVE[f]] = Object.keys(_observed[_FIELDS_TO_OBSERVE[f]]).length;

            //assume all fields' arrays are same length (checked by req handler)
            for (var i = 0; i < _consoleMessageArray.length; ++i) {
                tmp.Label = _consoleMessageArray[i][_consoleMessageFields[_MESSAGE_FIELD_LABEL]];
                tmp.Level = _consoleMessageArray[i][_consoleMessageFields[_MESSAGE_FIELD_LEVEL]];
                tmp.Source = _consoleMessageArray[i][_consoleMessageFields[_MESSAGE_FIELD_SOURCE]];
                if(tmp.Source == "xdaq.exe") tmp.Source = "OTSDAQ";
                tmp.Custom = _consoleMessageArray[i][_consoleMessageFields[_MESSAGE_FIELD_CUSTOM]];
                tmp.Hostname = _consoleMessageArray[i][_consoleMessageFields[_MESSAGE_FIELD_HOSTNAME]];
                tmp.Count = _consoleMessageArray[i][_consoleMessageFields[_MESSAGE_FIELD_COUNT]];

                firstMsg = _consoleMessageArray[i][_consoleMessageFields[_MESSAGE_FIELD_FILE]] +
                    ":" + _consoleMessageArray[i][_consoleMessageFields[_MESSAGE_FIELD_LINE]];// + "\t";

                secondMsg = _consoleMessageArray[i][_consoleMessageFields[_MESSAGE_FIELD_MSG]];

                firstMsg = convertForClient(firstMsg);
                secondMsg = convertForClient(secondMsg);

                //Note: A valid class name should start with an underscore (_), a hyphen (-) or a letter (a-z)/(A-Z) which is followed by any numbers, hyphens, underscores, letters.
                //so for custom filter span, must clean and place leading underscore for leading numbers
                // It escapes all characters except: A–Z a–z 0–9 - _ . ! ~ * ' ( )
                tmp.Custom = encodeURIComponent(tmp.Custom). //so add addtional escaping
                    replace(/[.!~*'()]/g,
                        (c) => `%${c.charCodeAt(0).toString(16).toUpperCase()}`,
                    );
                //replace all % with _
                tmp.Custom = "_" + tmp.Custom.replaceAll("%", "_-_");
                //Note: decodeURIComponent() decodes all escape sequences, including those that are not created by encodeURIComponent, like -.!~*'().

                //important to only have one /div> per entry for truncate
                str += "<div class='consoleEntry consoleEntryId-" +
                    tmp.Count + "' onmouseup='toggleMessageAnchor(this);' " + //" style='color:" +
                    //getColorForLevel(tmp.Level) +  //CHANGED to css based
                    "'>" +
                    "<span class='" + tmp.Hostname + "_HostnameEntry'>" +
                    "<span class='" + tmp.Source + "_SourceEntry'>" +
                    "<span class='" + tmp.Label + "_LabelEntry'>" +
                    "<span class='" + tmp.Level + "_LevelEntry'>" +
                    "<span class='hostDisplayEntry'>" + getShortenedHostname(tmp.Hostname) + " | </span>" +
                    "<span class='" + tmp.Custom + "_CustomEntry'>" + //open hostname source label level custom span (for filtering)
                    "<span class='elaboratedEntry'><b>" +
                    tmp.Level + " " +
                    "(" + formatTime(_consoleMessageArray[i][_consoleMessageFields[_MESSAGE_FIELD_TIME]]) + ") ";
                str += tmp.Label + ":</b> " +
                    "</span><span class='lineNumberEntry'>" +
                    DesktopContent.htmlOpen("a", //start macro module table
                        {
                            "title": "Open file in a new browser tab: \n" + firstMsg,
                            "style": "color:inherit;",
                            "onclick": "DesktopContent.openNewBrowserTab(" +
                                "\"Code Editor\",undefined /*subname undefined for LID lookup*/," +
                                "\"?" +
                                "startFilePrimary=" +
                                firstMsg + "\",undefined /*unique undefined for LID lookup*/);", //end onclick
                        },
                        firstMsg,
                        true /*doCloseTag*/) + "\t" +
                    // firstMsg +
                    "</span>" + secondMsg +
                    "</span></span></span></span></span>" + //close custom level label source hostname span (for filtering)
                    "</div>"; //important to only have one /div> per entry for truncate

                //aggragate stats for each observed field
                for (var f in _FIELDS_TO_OBSERVE) //accumulate field values and their counts
                    _observed[_FIELDS_TO_OBSERVE[f]][tmp[_FIELDS_TO_OBSERVE[f]]] =
                        (_observed[_FIELDS_TO_OBSERVE[f]][tmp[_FIELDS_TO_OBSERVE[f]]] | 0) + 1; //this works when undefined also

            } //end main message loop

            //check to see if filter boxes need to be updated due to new fields
            for (var f in _FIELDS_TO_OBSERVE) //accumulate field values and their counts
                if (observedSz[_FIELDS_TO_OBSERVE[f]] != Object.keys(_observed[_FIELDS_TO_OBSERVE[f]]).length) {
                    Debug.log("Filter update needed for " + _FIELDS_TO_OBSERVE[f]);
                    updateFilterBoxes();
                    break;
                }

            //for debugging:
            //				for(var i in _observedLabels)
            //					Debug.log(i + ": " + _observedLabels[i]);

            var startPosition = 0;
            var startIndex = -1;
            if (_consoleEl.children.length) {
                startPosition = _consoleEl.children[_consoleEl.children.length - 1].
                    offsetTop;
                startIndex = _consoleEl.children[_consoleEl.children.length - 1].
                    className.split('-')[1] | 0;
                // Debug.logv({startPosition});
                // Debug.logv({startIndex});
            }

            if (param == "prepend")
                str = _CONSOLE_START_MESSAGE + str + _consoleEl.innerHTML.substr(_CONSOLE_START_MESSAGE.length);
            else //normal append
                str = _consoleEl.innerHTML + str;

            var lendiff = str.length - _CONSOLE_HISTORY_MAX_LENGTH;
            if (lendiff > 0) //truncate chat history at entry div start
            {
                // Debug.log("Truncating...");
                //keep err, warn, info entries if possible
                var searchIndex = 0;
                let startIndex = -1;
                do {
                    let otherIndex = str.indexOf("_LevelEntry", searchIndex);
                    //find in browser single or double quote mode
                    while (otherIndex != -1 && str[otherIndex + "_LevelEntry".length] != "'" && str[otherIndex + "_LevelEntry".length] != '"')
                        otherIndex = str.indexOf("_LevelEntry", otherIndex + 1); //look again

                    if (otherIndex == -1)
                        break; //no more not important entries found

                    var errIndex = str.indexOf("Error_LevelEntry", searchIndex);
                    while (errIndex != -1 && str[errIndex + "Error_LevelEntry".length] != "'" && str[errIndex + "Error_LevelEntry".length] != '"')
                        errIndex = str.indexOf("Error_LevelEntry", errIndex + 1); //look again
                    var warnIndex = str.indexOf("Warning_LevelEntry", searchIndex);
                    while (warnIndex != -1 && str[warnIndex + "Warning_LevelEntry".length] != "'" && str[warnIndex + "Warning_LevelEntry".length] != '"')
                        warnIndex = str.indexOf("Warning_LevelEntry", warnIndex + 1); //look again
                    var infoIndex = str.indexOf("Info_LevelEntry", searchIndex);
                    while (infoIndex != -1 && str[infoIndex + "Info_LevelEntry".length] != "'" && str[infoIndex + "Info_LevelEntry".length] != '"')
                        infoIndex = str.indexOf("Info_LevelEntry", infoIndex + 1); //look again

                    //move all pointers to end of found entry
                    if (errIndex != -1)
                        errIndex += "Error_LevelEntry".length;
                    if (warnIndex != -1)
                        warnIndex += "Warning_LevelEntry".length;
                    if (infoIndex != -1)
                        infoIndex += "Info_LevelEntry".length;
                    otherIndex += "_LevelEntry".length;

                    let nextImportantIndex = -1;
                    if (errIndex != -1)
                        nextImportantIndex = errIndex;
                    if (warnIndex != -1)
                        nextImportantIndex = nextImportantIndex == -1 ? warnIndex : Math.min(warnIndex, nextImportantIndex);
                    if (infoIndex != -1)
                        nextImportantIndex = nextImportantIndex == -1 ? infoIndex : Math.min(infoIndex, nextImportantIndex);

                    if (nextImportantIndex == -1)
                        break; //no more important entries found, so do normal truncation

                    startIndex = str.indexOf("<div ", searchIndex);

                    let endIndex = str.indexOf("/div>", startIndex + lendiff);
                    if (endIndex == -1) break; //should not happen, so just break and do normal truncation
                    else endIndex += 5; //move to after /div>

                    if (nextImportantIndex > endIndex) {
                        //no more important entries found in sensitive area, so truncate the rest and be done
                        str = str.substr(0, startIndex) + str.substr(endIndex);
                        lendiff = str.length - _CONSOLE_HISTORY_MAX_LENGTH;
                        break;
                    }

                    if (otherIndex == nextImportantIndex) {
                        //don't truncate at important entries
                        searchIndex = otherIndex + 1;
                        continue;
                    }

                    //if here, then otherIndex is not err/warn/info, so can truncate this message

                    endIndex = str.lastIndexOf("/div>", nextImportantIndex);
                    if (endIndex == -1) break; //should not happen, so just break and do normal truncation
                    else endIndex += 5; //move to after /div>

                    str = str.substr(0, startIndex) + str.substr(endIndex);
                    searchIndex = startIndex + (nextImportantIndex - endIndex) + 1; //continue searching from here
                    lendiff = str.length - _CONSOLE_HISTORY_MAX_LENGTH;
                    if (lendiff <= 0)
                        break; //done truncating
                    //else continue searching

                } while (1);

                //if still too long, then truncate normally
                if (lendiff > 0) {
                    startIndex = str.indexOf("<div ", searchIndex);
                    let endIndex = str.indexOf("/div>", startIndex + lendiff);
                    if (endIndex == -1) {
                        Debug.log("Truncation failed! Perhaps need larger MAX value?");
                        endIndex = startIndex + lendiff; //should not happen, so just break and do normal truncation
                    }
                    else endIndex += 5; //move to after /div>
                    _consoleEl.innerHTML = str.substr(0, startIndex) + str.substr(endIndex);
                }
                else //truncation loop was successful
                    _consoleEl.innerHTML = str;
            }
            else //no truncation needed
                _consoleEl.innerHTML = str;

            if (_scrollWithNewChats)
                _historyEl.scrollTop = _historyEl.scrollHeight;
            else if (startIndex > 0) {
                var els = _consoleEl.getElementsByClassName("consoleEntryId-" + startIndex);
                var endPosition = els[els.length - 1].offsetTop;
                if (_historyEl.scrollTop + endPosition - startPosition < 0) {
                    // Debug.log("Keeping scroll position at top");
                    _historyEl.scrollTop = _historyEl.scrollTop; //keep scroll position if too negative
                }
                else {
                    // Debug.log("endPosition ",endPosition,endPosition-startPosition);
                    _historyEl.scrollTop += endPosition - startPosition;
                }
            }

        } //end updateConsoleHistory()

        //=====================================================================================
        //formatTime ~
        var monthArr_ = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        function formatTime(t) {
            var date = new Date(t * 1000);
            var mm = date.getMinutes() < 10 ? "0" + date.getMinutes() : date.getMinutes();
            var ss = date.getSeconds() < 10 ? "0" + date.getSeconds() : date.getSeconds();
            var m = monthArr_[date.getMonth()]; //+ 1).format("02d");;
            var d = ('0' + date.getDate()).slice(-2); //zero pad day of month
            var y = date.getFullYear() - 2000;
            return d + m + y + "." + date.getHours() + ":" + mm + ":" + ss;
        } //end formatTime()

                case 1: //white and black

        //=====================================================================================
        //handleUserScroll ~
        //	identify when user wants to keep up with live chats
        var _userMouseInputTimeout = 0;
        function handleUserScroll(e) {
            //=========================
            function localGetScrollPct() {
                const maxScroll = _historyEl.scrollHeight - _historyEl.clientHeight; //_historyEl.scrollHeight - _historyEl.offsetHeight

                if (maxScroll <= 0) return 1; //content fits without scroll
                else {
                    let scrollPct = _historyEl.scrollTop / maxScroll;
                    return scrollPct;
                }
            } //end localGetScrollPct()

        //=====================================================================================
        function handleAdvancedGetTraceLevels(req) {
            Debug.log("handleAdvancedGetTraceLevels req", req);

            //Error 0
            //Warning 1
            //Info   2
            //Debug 3
            //Trace 4
            //5.. 63 whatever you want

            /*
             * Notes:
             * time delta is useful (maybe colorizing by difference)
             *  time delta should ignore messages taht were filtered
             *
             *  tshow dump should have delta option
             *  and color option of pid and severity
             */


            //Trigger
            /*
             * https://cdcvs.fnal.gov/redmine/projects/trace/wiki/TRACE_Users_Guide#Using-Trigger-Mode
             *
             * has 3 fields trigIdxCnt, triggered, trigActivePost
             *
             * 	trigIdxCnt shows which message cause the trigger..
             * 	triggered is 1 if has been triggered
             * 	trigActivePost is the number of messages to keep after trigger
             *
             * Can not turn off slow level 0
             *
             * Triggering stops the memory after arming and count of post messages.
             *
             * Memory mode is tshow
             *   tshow | grep ' ' | tdelta
             *
             * COUT uses slow
             * add script to otsdaq on configure start to reset trace memory and at end keep tshow &> file.tosave
             *
             * TRACE is the label that is a "global" mast for triggering
             *
             * _TRACE_ is overflow label
             */

            var traceList = DesktopContent.getXMLValue(req, "traceList");
            var modTraceList = DesktopContent.getXMLValue(req, "modTraceList");

            if (traceList) {
                _traceLevels = {}; //clear
                _traceLabelPresence = {}; //clear
                var hostTraceArr = traceList.split(';');
            }
            else //use modTraceList
                var hostTraceArr = modTraceList.split(';');

            for (var i = 0; i < hostTraceArr.length; ++i) {
                var fieldTraceArr = hostTraceArr[i].split(',');
                if (fieldTraceArr.length < 3 ||
                    (fieldTraceArr.length + 1) % 2 != 0) {
                    Debug.log("Skipping incomplete host trace masks:", hostTraceArr[i]);
                    continue;
                }

                Debug.log("Getting TRACE labels for host =", fieldTraceArr[0]);

                //start object if not present
                if (!_traceLevels[fieldTraceArr[0]])
                    _traceLevels[fieldTraceArr[0]] = {};

                for (var j = 1; j < fieldTraceArr.length; j += 2) {
                    var maskVals = fieldTraceArr[j + 1].split(':');
                    if (maskVals[0] != 'M' ||
                        maskVals[3] != 'S' ||
                        maskVals[6] != 'T') {
                        Debug.err("Corrupt TRACE levels received during get operation! Notify admins.");
                        return;
                    }

                    if (fieldTraceArr[j + 0].indexOf("Core") == 0) {
                        Debug.log("Found?", fieldTraceArr[j + 0]);
                    }

                    _traceLevels[fieldTraceArr[0]][fieldTraceArr[j + 0]] = {
                        "M": [maskVals[1], maskVals[2]],
                        "S": [maskVals[4], maskVals[5]],
                        "T": [maskVals[7], maskVals[8]],
                    };

                    //start object if not present
                    if (!_traceLabelPresence[fieldTraceArr[j + 0]])
                        _traceLabelPresence[fieldTraceArr[j + 0]] = {};

                    _traceLabelPresence[fieldTraceArr[j + 0]][fieldTraceArr[0]] = 1; //include this host
                }
            }
            Debug.log("Trace host map object", _traceLevels);
            Debug.log("Trace label map object", _traceLabelPresence);

            drawAdvancedControls();

        } //end handleAdvancedGetTraceLevels()

            //==========================
            function localFilterRule(str, rule) {
                var escapeRegex = (str) => str.replace(/([.*+?^=!:${}()|\[\]\/\\])/g, "\\$1");
                return new RegExp("^" + rule.split("*").map(escapeRegex).join(".*") + "$").test(str);

        //=====================================================================================
        //applyAdvancedControlsFilter ~
        function applyAdvancedControlsFilter() {
            Debug.log("applyAdvancedControlsFilter()");

            var COL_NAMES = ["Select", "Label", "SeverityMask", "HostPresence"];
            var COL_DISPLAY_NAMES = [
                DesktopContent.htmlOpen("input",
                    {
                        "type": "checkbox",
                        "class": "ac_checkboxSelect",
                        "onclick": "advancedToggleAllCheckboxes(this.checked);",
                        "title": "Toggle selecting/deselecting all displayed labels for the Set mask operation.",
                    }, "", true),
                "Label", "Severity Mask", "Hosts"];

            var str = "";
            str += "<table>";
            var isFirst = true;

            var labeli = 0;
            var hosts = Object.keys(_traceLevels);
            var filterStr = document.getElementById("ac_searchBox").value;
            if (filterStr == _advancedFilterINIT_VAL)
                filterStr = "";
            else
                filterStr = filterStr.toUpperCase();

            //apply sorting
            var sortedLabels = [];
            //TODO apply other sort modes once accessible through GUI
            //if(_traceHostSelect.sortBy == _traceHostSelect_SORT_BYCOUNT)
            //{
            //for array
            //sortedLabels.sort(); //default is alpha increasing
            //to reverse do  sortedLabels.reverse();
            //}
            //else //alpha order
            for (var label in _traceLabelPresence) {
                sortedLabels.push(label);
            }
            //case-insensive sort
            sortedLabels.sort(function (a, b) {
                var aA = a.toUpperCase(); // ignore upper and lowercase
                var bB = b.toUpperCase(); // ignore upper and lowercase
                if (aA < bB)
                    return -1;

                if (aA > bB)
                    return 1;

                // names must be equal
                return 0;
            }); //end case-insensive sort function
            //==========================
            function localFilterRule(str, rule) {
                var escapeRegex = (str) => str.replace(/([.*+?^=!:${}()|\[\]\/\\])/g, "\\$1");
                return new RegExp("^" + rule.split("*").map(escapeRegex).join(".*") + "$").test(str);
            } //end localFilterRule()



            //apply host select filter and text matching
            for (var a = 0; a < sortedLabels.length; ++a) //for(var label in _traceLabelPresence)
            {
                var label = sortedLabels[a];
                var hostPresence = Object.keys(_traceLabelPresence[label]);

                //if requiring label to be on all hosts and not true, skip
                if (_traceHostSelect.mode == _traceHostSelect_MODE_LABELONALL &&
                    hostPresence.length != hosts.length)
                    continue;

                //skip if filter string eliminates
                if (filterStr != "" && !localFilterRule(label.toUpperCase(), filterStr)) //label.toUpperCase().indexOf(filterStr) < 0)
                    continue;

                for (var ll = 0;
                    //if by host, then create row for each host
                    (ll == 0) ||
                    (_traceHostSelect.mode == _traceHostSelect_MODE_LABELBYHOST &&
                        ll < hostPresence.length); ++ll) {

                    //check for host filter (if any hosts specified)
                    if (_traceHostSelect.hosts.length) {
                        if (_traceHostSelect.mode == _traceHostSelect_MODE_LABELBYHOST &&
                            undefined === _traceHostSelect.hosts.find(h => h == hostPresence[ll]))
                            continue; //if row-per-label/host then skip if not in host filter
                        else if (_traceHostSelect.mode != _traceHostSelect_MODE_LABELBYHOST) {
                            //skip if no hosts found
                            for (var j = 0; j < hostPresence.length; ++j) {
                                for (var hh = 0; hh < _traceHostSelect.hosts.length; ++hh)
                                    if (hostPresence[j] == _traceHostSelect.hosts[hh])
                                        break;
                                if (hh < _traceHostSelect.hosts.length) //then found a host in filter list
                                    break;
                            }
                            if (j >= hostPresence.length) //then no hosts were found
                                continue;
                        }
                    }

                    str += "<tr class='ac_row'>";

                    for (var i = 0; i < COL_NAMES.length; ++i) {
                        str += "<td" + (isFirst ? (" id='ac_first" +
                            COL_NAMES[i] + "'") : "") + ">";

                        if (i == 1)
                            str += label;
                        else if (i == 0)
                            str += "<input type='checkbox' class='ac_checkboxSelect' onclick='advancedUpdateSelectedCheckboxesText();' />";
                        else if (i == 2) {
                            if (_advancedTraceMode == TRACE_SLOW)
                                var val64 = _traceLevels[hostPresence[0]][label].S;
                            else if (_advancedTraceMode == TRACE_FAST)
                                var val64 = _traceLevels[hostPresence[0]][label].M;
                            else if (_advancedTraceMode == TRACE_TRIGGER)
                                var val64 = _traceLevels[hostPresence[0]][label].T;
                            else {
                                Debug.err("Unknown advanced page mode " +
                                    _advancedPage + "! Notify admins.");
                                return;
                            }

                            str += createEditableBitMask(
                                val64,
                                label, undefined /*inExistingEl*/, labeli);
                        }
                        else if (i == 3) {

                            if (hostPresence.length == 1 ||
                                _traceHostSelect.mode == _traceHostSelect_MODE_LABELBYHOST)
                                str += cleanHostForDisplay(hostPresence[ll]);
                            else if (hostPresence.length > 1) {
                                if (hostPresence.length == hosts.length)
                                    str += "All";
                                else {
                                    for (var j = 0; j < hostPresence.length; ++j)
                                        str += (j ? ', ' : '') + cleanHostForDisplay(hostPresence[j]);
                                }
                            }
                            else {
                                Debug.err("Impossible TRACE label:host error! Notify admins.");
                                return;
                            }

                        }
                        else {
                            Debug.err("Impossible TRACE Column error! Notify admins.");
                            return;
                        }
                        str += "</td>";
                    }
                    str += "</tr>";
                    isFirst = false;
                    ++labeli;
                } //end label by host loop
            } //end label loop

            if (isFirst)
                str += "<tr class='ac_row'><td width='100%'>No Labels matched your selections.</td></tr>";

            str += "</table>";

            var el = document.getElementById("advancedControlsTableRows");
            el.innerHTML = str;
            var hel = document.getElementById("advancedControlsTableHeader");
            if (isFirst)
                hel.style.width = "fit-content";
            else
                hel.style.width = el.offsetWidth + "px";

            str = "";
            //now get width of columns and apply to header table
            for (var i = 0; i < COL_NAMES.length; ++i) {
                var el = document.getElementById("ac_first" + COL_NAMES[i]);
                var w = el ? ((el.offsetWidth - 10 /*4 padding + 1 border left/right */) +
                    "px") : "fit-content";

                Debug.log("First row-col width ", COL_NAMES[i], w);
                //match width of column to fake like same table

                str += "<div style='width:" + w + "'>";

                str += COL_DISPLAY_NAMES[i];
                str += "</div>";
            } //end column headers loop

            hel.innerHTML = str;

            advancedUpdateSelectedCheckboxesText();
        } //end applyAdvancedControlsFilter()

        function advancedHelperGetHosts(labeli) {
            //Debug.log("advancedHelperGetHosts()",labeli);

            var rows = document.getElementsByClassName("ac_row");
            labeli |= 0;
            if (labeli < 0 || labeli >= rows.length) {
                Debug.err("Illegal label index " + labeli + " with " +
                    rows.length + " rows! Notify admins.");
                return undefined;
            }

            // Get the label from column 1 and look up which raw _traceLevels hosts have it.
            // (Column 3 shows cleaned/shortened hostnames for display, so we can't use
            // innerText for _traceLevels key lookup.)
            var label = rows[labeli].children[1].innerText;
            var hostArr = [];
            for (var hh in _traceLevels) {
                if (_traceLevels[hh][label])
                    hostArr.push(hh);
            }
            return hostArr;
        } //end advancedHelperGetHosts()

        //=====================================================================================
        function advancedSetBitMask() {
            Debug.log("advancedSetBitMask()", _advancedTraceMode);

            var modeStr = "";
            if (_advancedTraceMode == TRACE_SLOW)
                modeStr = "SLOW";
            else if (_advancedTraceMode == TRACE_FAST)
                modeStr = "FAST";
            else if (_advancedTraceMode == TRACE_TRIGGER)
                modeStr = "TRIGGER";
            else {
                Debug.err("Invalid set mode! Notify admins.");
                return;
            }


            var rows = document.getElementsByClassName("ac_row");

            //check for setting ALL labels
            //	if rows.length matches number of labels in the system, then consider ALL
            //	else some labels have been filtered
            var isAllLabels = false;
            if (rows.length == Object.keys(_traceLabelPresence).length) {
                Debug.log("is ALL labels!");
                isAllLabels = true;
            }

            //Steps:
            //	- organize set labels by host
            //	- map 'All' hosts to all existing in global host map
            var setObj = {}; //map of host: [label,...]


            for (var r = 0; r < rows.length; ++r) {
                var checked = rows[r].children[0].children[0].checked;
                if (!checked) {
                    isAllLabels = false;
                    continue;
                }

                var label = rows[r].children[1].innerText;
                // Look up raw hosts from _traceLevels by label (display column is cleaned/shortened)
                var hosts = [];
                for (var hh in _traceLevels) {
                    if (_traceLevels[hh][label])
                        hosts.push(hh);
                }
                Debug.log("Row", checked, label, hosts);

                for (var h = 0; h < hosts.length; ++h) {
                    if (hosts[h].length < 2) continue;

                    if (hosts[h] == "All") {
                        for (var hh in _traceLevels) {
                            if (!setObj[hh])
                                setObj[hh] = [];
                            setObj[hh].push(label);
                        }
                        continue;
                    }

                    if (!_traceLevels[hosts[h]][label]) {
                        Debug.err("Host+Label combo is not in Trace levels! Notify admins.");
                        return;
                    }

                    if (!setObj[hosts[h]])
                        setObj[hosts[h]] = [];
                    setObj[hosts[h]].push(label);

                } //end host loop
            } //end row loop

            Debug.log("setObj", setObj);

            if (Object.keys(setObj).length == 0) {
                Debug.err("No labels targeted! Please select one or more labels to target by checking their corresponding checkboxes.");
                return;
            }

            var setStr = "";
            //;host,label,..label;host,label,..label
            for (var hh in setObj) {
                setStr += ";" + hh; //add host name
                if (isAllLabels)
                    setStr += ":ALL"; //ALL is special TRACE interface keyword for the global set
                else {
                    for (var i = 0; i < setObj[hh].length; ++i) {
                        setStr += (i ? "," : ":") + setObj[hh][i];
                    } //end label loop
                }
            } //end host loop

            Debug.log("setStr", setStr);

            DesktopContent.XMLHttpRequest(
                "Request?RequestType=SetTraceLevels",
                "hostLabelMap=" + setStr +
                "&setMode=" + modeStr +
                "&setValueMSB=" + _advancedEditBitMask[0] +
                "&setValueLSB=" + _advancedEditBitMask[1],
                handleAdvancedGetTraceLevels);
        } //end advancedSetBitMask()

        // if param == "onlyCounts" then only update counts
        var ac_cc_COL_NAMES = ["Select", "Needle", "Count", "TriggerOnCount", "Loop", "Action", "Priority", "Armed"];
        var ac_cc_COL_NAMES_Select = ac_cc_COL_NAMES.indexOf("Select"),
            ac_cc_COL_NAMES_Priority = ac_cc_COL_NAMES.indexOf("Priority"),
            ac_cc_COL_NAMES_Needle = ac_cc_COL_NAMES.indexOf("Needle"),
            ac_cc_COL_NAMES_Count = ac_cc_COL_NAMES.indexOf("Count"),
            ac_cc_COL_NAMES_TriggerOnCount = ac_cc_COL_NAMES.indexOf("TriggerOnCount"),
            ac_cc_COL_NAMES_Loop = ac_cc_COL_NAMES.indexOf("Loop"),
            ac_cc_COL_NAMES_Action = ac_cc_COL_NAMES.indexOf("Action");
        ac_cc_COL_NAMES_Armed = ac_cc_COL_NAMES.indexOf("Armed");
        var ac_cc_COL_DISPLAY_NAMES = [
            DesktopContent.htmlOpen("input",
                {
                    "type": "checkbox",
                    "class": "ac_checkboxSelect",
                    "onclick": "advancedToggleAllCheckboxes(this.checked);",
                    "title": "Toggle selecting/deselecting all custom needles in the list to delete or change action.",
                }, "", true),
            "Search String",
            "Server-side Count",
            "Trigger On Count",
            "Loop?",
            "Action",
            "Priority",
            "Armed"];
        function handleAdvancedGetCustomCountsAndActions(req, param, errStr) {
            if (_advancedRefreshSetTimer) //only allow one timer for advanced updates at a time
                clearTimeout(_advancedRefreshSetTimer);

            if (!errStr)
                errStr = "";
            var err = DesktopContent.getXMLValue(req, "Error");
            if (err && err != "")
                errStr += "\n" + err;
            if (errStr != "") {
                Debug.err("Error: " + errStr);

                //return advanced update timer on error
                _advancedRefreshSetTimer = window.setTimeout(getAdvamcedUpdates, _REFRESH_INTERVAL * 2); //schedule next update
                return;
            } //end error handling

            var customCountList = req.responseXML.getElementsByTagName("customCount");


            var onlyUpdateCounts = param == "onlyCounts";
            Debug.log("handleAdvancedGetCustomCountsAndActions()", onlyUpdateCounts);

            var checkedRows = {};
            if (!onlyUpdateCounts) //get existing checked rows so they can be kept
            {
                var rows = document.getElementsByClassName("ac_row");

                for (var r = 0; r < rows.length; ++r) {
                    if (!rows[r].children[ac_cc_COL_NAMES_Select].children.length) break; //may not be initialized at first
                    var checked = rows[r].children[ac_cc_COL_NAMES_Select
                    ].children[0].checked;
                    if (checked) {
                        Debug.log("Keeping checked",
                            rows[r].children[ac_cc_COL_NAMES_Count
                            ].children[0].id);
                        checkedRows[rows[r].children[ac_cc_COL_NAMES_Count
                        ].children[0].id] = 1; //mark as checked
                    }
                }
            } //end check of checked rows

            var isFirst = true;
            var str = "";
            str += "<table>";
            for (var a = 0; a < customCountList.length; ++a) {
                var needle = DesktopContent.getXMLValue(customCountList[a], "needle");
                var count = DesktopContent.getXMLValue(customCountList[a], "count");
                var triggerOnCount = DesktopContent.getXMLValue(customCountList[a], "triggerOnCount");
                var doLoop = DesktopContent.getXMLValue(customCountList[a], "doLoop");
                var action = DesktopContent.getXMLValue(customCountList[a], "action");
                var armed = DesktopContent.getXMLValue(customCountList[a], "isArmed");
                //Note: A valid class name should start with an underscore (_), a hyphen (-) or a letter (a-z)/(A-Z) which is followed by any numbers, hyphens, underscores, letters.
                //so for custom filter span, must clean and place leading underscore for leading numbers
                // It escapes all characters except: A–Z a–z 0–9 - _ . ! ~ * ' ( )
                var safeNeedle = encodeURIComponent(needle). //so add addtional escaping
                    replace(/[.!~*'()]/g,
                        (c) => `%${c.charCodeAt(0).toString(16).toUpperCase()}`,
                    );
                //replace all % with _
                safeNeedle = "_" + safeNeedle.replaceAll("%", "_-_");

                Debug.log("custom", a, needle, count, action, safeNeedle);

                if (onlyUpdateCounts) //update count table cell only
                {
                    var el = document.getElementById("count" + safeNeedle);
                    if (el) el.innerHTML = count + " occurrences";
                    isFirst = false;
                    continue;
                }

                //create one row per custom count
                str += "<tr class='ac_row'>";
                for (var i = 0; i < ac_cc_COL_NAMES.length; ++i) {
                    str += "<td" + (isFirst ? (" id='ac_first" +
                        ac_cc_COL_NAMES[i] + "'") : "") + ">";

                    if (i == ac_cc_COL_NAMES_Needle) {
                        str += "<div style='margin-right:50px;'>";
                        str += needle;
                        str += "</div>";
                    }
                    else if (i == ac_cc_COL_NAMES_Priority) {
                        str += "<div style='width:50px; text-align: center;'>";
                        str += a;
                        str += "</div>";
                    }
                    else if (i == ac_cc_COL_NAMES_Select) {
                        str += "<input type='checkbox' class='ac_checkboxSelect' onclick='advancedUpdateSelectedCheckboxesText();' ";
                        if (checkedRows["count" + safeNeedle]) //keep checked rows
                            str += "checked";
                        str += " />";
                    }
                    else if (i == ac_cc_COL_NAMES_Count) //label count
                    {
                        str += "<div style='margin-right:50px;' id='count" + safeNeedle + "'>";
                        str += count + " occurrences";
                        str += "</div>";
                    }
                    else if (i == ac_cc_COL_NAMES_TriggerOnCount) {
                        str += "<div style='margin-right:50px;' id='triggerOnCount" + safeNeedle + "'>";
                        str += triggerOnCount + " occurrences";
                        str += "</div>";
                    }
                    else if (i == ac_cc_COL_NAMES_Loop) {
                        str += "<div style='margin-right:50px;'>";
                        str += "<input type='checkbox' class='ac_checkboxSelect' onclick='setLoopingAction();' disabled=true; ";
                        if (doLoop == "1") //keep checked rows
                            str += "checked";
                        str += " />";
                        str += "</div>";

                    }
                    else if (i == ac_cc_COL_NAMES_Action) //Action
                    {
                        str += "<div style='margin-right:50px;'>";
                        //reverse tranlation for full explanation of action to user
                        if (action == "Pause") action = "Pause FSM + System Message";
                        else if (action == "Stop") action = "Stop FSM + System Message";
                        else if (action == "Halt") action = "Halt FSM + System Message";
                        str += action;
                        str += "</div>";
                    }
                    else if (i == ac_cc_COL_NAMES_Armed) //Armed
                    {
                        str += "<div style='margin-right:50px;";
                        if (armed == "1") str += "color: green'> ARMED";
                        else str += "color: red'> UNARMED";
                        str += "</div>";
                    }
                    else {
                        Debug.err("Impossible custom search string Column error! Notify admins.");
                        return;
                    }
                    str += "</td>";
                }
                str += "</tr>";
                isFirst = false;
            } //end customCountList loop

            var el = document.getElementById("advancedControlsTableRows");
            if (!onlyUpdateCounts) //update count table cell only
            {
                if (isFirst)
                    str += "<tr class='ac_row'><td width='100%'>No custom counts found.</td></tr>";

                str += "</table>";
                el.innerHTML = str;
            }

            //fix header width
            var hel = document.getElementById("advancedControlsTableHeader");
            if (isFirst)
                hel.style.width = "fit-content";
            else
                hel.style.width = el.offsetWidth + "px";

            str = "";
            //now get width of columns and apply to header table
            for (var i = 0; i < ac_cc_COL_NAMES.length; ++i) {
                var el = document.getElementById("ac_first" + ac_cc_COL_NAMES[i]);
                var w = (el) ? ((el.offsetWidth - 10 /*4 padding + 1 border left/right */) +
                    "px") : "fit-content";

                Debug.log("First row-col width ", ac_cc_COL_NAMES[i], w);
                //match width of column to fake like same table

                str += "<div style='width:" + w + "'>";

                str += ac_cc_COL_DISPLAY_NAMES[i];
                str += "</div>";
            } //end column headers loop

            hel.innerHTML = str;

            advancedUpdateSelectedCheckboxesText(); //update checkbox situation

            _advancedRefreshSetTimer = window.setTimeout(getAdvamcedUpdates, _REFRESH_INTERVAL * 2); //schedule next update
        } //end handleAdvancedGetCustomCountsAndActions()
