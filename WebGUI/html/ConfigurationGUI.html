						if (treeEditingNodeType_ != "delete-uid" &&
							treeEditingNodeType_ != "table-newGroupRow" &&
							treeEditingNodeType_ != "table-newUIDRow") {
							Debug.log("No change. Do nothing.");
							editCellCancel();
							return;
						}
						else
							Debug.log("No change. OK for operation.");
					}
					else if (	//some types REQUIRE no change
						treeEditingNodeType_ == "delete-uid") {
						Debug.log("The UID you are trying to delete has not been " +
							"saved yet. You can not delete a locally modified UID.",
							Debug.HIGH_PRIORITY);
						editCellCancel();
						return;
					}

					//save affected table as temporary version (re-use active temporary version at server)
					//		if saved successfully
					//			update value in tree-view and scan for other needed changes

					var tableVersion = -1;
					var tableIndex = -1;
					for (var j = 0; j < treeMemberNames_.length; ++j)
						if (treeEditingTargetTable_ == treeMemberNames_[j] &&
							(treeMemberVersions_[j] | 0) != -1) //make sure not mockup version
						{
							tableVersion = treeMemberVersions_[j];
							tableIndex = j;
							break;
						}
					if (tableIndex == -1) {
						if (treeEditingTargetTable_ == "NO_LINK")
							Debug.err("Invalid tree member table targeted, no table has been specified for this link. Please select a linked Table first, and then repeat this operation.");
						else
							Debug.err("Invalid tree member table targeted, could not find table '" +
								treeEditingTargetTable_ + "' in the list of tree tables. " +
								"Perhaps the tree needs to be refreshed? " +
								"Or the table needs to be added to one of the active groups?" +
								"\n\n" +
								//Important! same as ConfigurationGUISupervisor.cc L:4559
								//Important! similar to ConfigurationGUI.html: tableLinkTooltip(): L:11860
								// CHANGES MUST BE PROPAGATED
								"To add a table to a group, click the group name to go to the " +
								"group view, then click 'Rename Group or Add/Remove/Modify Member Tables.' You " +
								"can then add or remove tables and save the new group." +
								"\n\n" +
								"OR!!! Click the following button to add the table '" + treeEditingTargetTable_ +
								"' to the Configuration Group: " +
								"<input type='button' style='color:black !important;' " +
								"title='Click to add table to the active Configuration Group' " +
								"onclick='addTableToConfigurationGroup(\"" +
								treeEditingTargetTable_ + "\"); Debug.closeErrorPop();event.stopPropagation(); ' value='Add Table'>" +
								"</input>");
						return;
					}

					//send edit to server
					DesktopContent.XMLHttpRequest("Request?RequestType=saveTreeNodeEdit" +
						"&editNodeType=" + treeEditingNodeType_ +
						"&targetTable=" + treeEditingTargetTable_ +
						"&targetTableVersion=" + tableVersion +
						"&targetUID=" + treeEditingTargetUID_ +
						"&targetColumn=" + treeEditingTargetColumn_
						,
						"newValue=" + newValue, //newValue post in case the value is large
						function (req, reqParam, errStr) {
							if (errStr) {
								Debug.err(errStr);
								editCellCancel();
								return;
							}
							var err = DesktopContent.getXMLValue(req, "Error");
							if (err) {
								var warnings = req.responseXML.getElementsByTagName("Warning");
								for (var i = 0; i < warnings.length; ++i)
									Debug.warn(DesktopContent.getXMLValue(warnings[i]));

								//suppress same value error
								if (err.indexOf("is the same as the current value. No need to save node.") > 0) {
									Debug.log(err);
									editCellCancel();
									return;
								}
								Debug.err("If you do not understand the error, try refreshing the tree from the '>>' menu in the top left of the Tree-view page.");
								Debug.err(err);

								editCellCancel();
								return;
							}

							//maintain tree member versions
							// (Note: more than one table may have changed!)
							var resultingTableNames = req.responseXML.getElementsByTagName("savedName");
							var resultingTableVersions = req.responseXML.getElementsByTagName("savedVersion");

							var resultingTableIndex;
							var resultingTableName;
							for (var i = 0; i < resultingTableNames.length; ++i) {
								resultingTableIndex = -1;
								resultingTableName = DesktopContent.getXMLValue(resultingTableNames[i]);

								for (var j = 0; j < treeMemberNames_.length; ++j)
									if (resultingTableName == treeMemberNames_[j]) {
										treeMemberVersions_[j] =
											DesktopContent.getXMLValue(resultingTableVersions[i]);
										resultingTableIndex = j;
										break;
									}
								if (resultingTableIndex == -1) {
									Debug.log("Invalid tree member '" + resultingTableName +
										"' was changed! Should be impossible. If repeatable, alert admins.",
										Debug.HIGH_PRIORITY);
									editCellCancel();
									return;
								}
								Debug.log("New table version for " + resultingTableName + " = " +
									treeMemberVersions_[resultingTableIndex]);
							}

							if (!_editingCellEl) {
								Debug.log("Mid request _editingCellEl became invalid. Assuming there was a cancel?");
								editCellCancel();
								return;
							}

							//add tree save buttons
							treeHasChanged();

							//change target edit tree node
							localEditTreeNodeOKRequestsComplete(tableIndex, newValue);

							//now need to propagate changes throughout tree
							//	note: arguments can vary by edit type
							editTreeNodePropagateChange(newValue);

							//refresh versions based on treeMemberVersions_ fix all the table and table-link versions
							refreshTreeTableVersions();


							//finish special handling of new row
							if (treeEditingNodeType_ == "table-newRow") {
								//if hiding status, switch and refresh
								if (treeViewHideStatus_) {
									//treeViewHideStatus_ = false;
									//refreshTreeView();
									DesktopContent.tooltip("Tree View Hide Nodes w/Status=False",
										"Currently, the tree-view menu option <b>'Hide Nodes w/Status=False'</b> " +
										" is hiding records with Status fields evaluating to " +
										"false. If you do not see your new record, this may be why; click the <b>&gt;&gt;</b> tree-view menu " +
										"in the top-left and select '" +
										"<a href='#' onclick='treeViewHideStatus_=false;refreshTreeView();'>" +
										"Show Nodes w/Status=False" +
										"</a> (or click this link)" +
										".'", true /* alwaysShow */);
								}

								//							Debug.log("Successfully added a new record to temporary version '" +
								//									treeMemberVersions_[resultingTableIndex] + "' of table '" +
								//									treeEditingTargetTable_ + ".'",
								//									Debug.INFO_PRIORITY);
							}
							else if (treeEditingNodeType_ == "table-newGroupRow") {
								//revert edit type back to link-GroupID
								treeEditingNodeType_ = "link-GroupID";
							}
							else if (treeEditingNodeType_ == "table-newUIDRow") {
								//revert edit type back to link-UID
								treeEditingNodeType_ = "link-UID";
							}

							//recover (possibly) modified target table
							treeEditingTargetTable_ = initTargetTable;

							//do not cancel at this point, because still editing cell for multi-step link/record editing, but indicate request is done
							// editCellCancel();
							_handlingTreeNodeOK = false;
						}, 0, 0, true //reqParam, progressHandler, callHandlerOnErr
					); //end of saveTreeNodeEdit call
				}
				else	//unrecognized type!?
				{
					Debug.err("Unrecognized tree edit type '" + treeEditingNodeType_ +
						"!' Should be impossible!");
					editCellCancel();
					return;
				}


				//withhold ending edit until after request completes (and editCellCancel() is called)
				//			_editingCell = false;
				//			_editingCellEl = 0;


				///////////////////////////////////////////////
				//localEditTreeNodeOKRequestsComplete
				//	called after successful edit req return
				function localEditTreeNodeOKRequestsComplete(tableIndex, newValue) {
					Debug.log("localEditTreeNodeOKRequestsComplete " + newValue);

					var titleStr = _editingCellElOldTitle;
					// 	titleStr was originally created like this, now insert newValue:
					// titleStr =  "~ Leaf Value Node ~\n";
					// titleStr += "Path: \t" + path + nodeName + "\n";
					// titleStr += "Value: \t" + newValue + "\n";
					if (titleStr) //could be undefined
					{
						let ti = titleStr.indexOf("Value: ");
						if (ti > 0)
							titleStr = titleStr.substr(0, ti) +
								"Value: \t" + decodeURIComponent(newValue) + "\n";
					}

					//some types should be handled before cell is cleared
					//	e.g. for continuation of editing, like "table-newGroupRow"
					//	and "table-newUIDRow"
					if (treeEditingNodeType_ == "table-newGroupRow") //spawns from group link edit
					{
						//clear children and re-toggle if shown
						//then
						//reselect target edit node

						var elChildrenNode = document.getElementById("treeNode-ChildrenOf-" +
							treeEditingNodeIdString_);
						var wasDisplayed = elChildrenNode.style.display != "none" &&
							elChildrenNode.innerHTML != "";

						toggleTreeChildren(
							treeEditingNodeIdString_.split('-')[0],
							treeEditingNodeIdString_.split('-')[1], false);
						elChildrenNode.innerHTML = "";

						if (wasDisplayed)
							toggleTreeChildren(
								treeEditingNodeIdString_.split('-')[0],
								treeEditingNodeIdString_.split('-')[1], true);

						//reload members in multiselect
						_editingCellEl.getElementsByTagName("select")[0].onchange();
						return;
					}
					else if (treeEditingNodeType_ == "table-newUIDRow") //spawns from uid link edit
					{
						//reload members uid dropdown (onchange ==> localLinkEditSelectOnChangeHandler)
						_editingCellEl.getElementsByTagName("select")[1].onchange(undefined /*event*/,
							newValue);
						return;
					}
					else if (treeEditingNodeType_ == "value-bitmap") {
						//bitmap data (do nothing is ok, value already set)
						//requests are done, so end editing, update mouseover titles
						if (titleStr) {
							_editingCellEl.title = titleStr;
							var el = document.getElementById("treeNode-Field-title-" + treeEditingNodeIdString_);
							if (el) el.title = titleStr;
						}
						_editingCell = false;
						_editingCellEl = 0;
						return;
					}


					// all other types are clearing the cell

					_editingCellEl.innerHTML = "";


					if (treeEditingNodeType_ == "table") {
						treeMemberComments_[tableIndex] = newValue;
						_editingCellEl.appendChild(document.createTextNode("//" + decodeURIComponent(newValue)));
						_editingCellEl.style.color = treeDiff_COLOR_;
					}
					else if (treeEditingNodeType_ == "link-comment" || treeEditingNodeType_ == "node-comment") {
						if (treeEditingNodeType_ == "link-comment")
							treeMemberComments_[tableIndex] = newValue;

						var el = document.getElementById("treeNode-TableComment-" + treeEditingNodeIdString_);
						el.innerHTML = "";
						el.appendChild(document.createTextNode("//" + decodeURIComponent(newValue)));
						el.style.color = treeDiff_COLOR_;
					}
					else if (treeEditingNodeType_ == "table-newRow") {
						//replace the value that was erased with table name
						_editingCellEl.appendChild(document.createTextNode(treeEditingTargetTable_));
						_editingCellEl.style.color = treeDiff_COLOR_;

						//reset children
						toggleTreeChildren(treeEditingNodeIdString_.split('-')[0],
							treeEditingNodeIdString_.split('-')[1], false);
						document.getElementById("treeNode-ChildrenOf-" +
							treeEditingNodeIdString_).innerHTML = "";
						toggleTreeChildren(treeEditingNodeIdString_.split('-')[0],
							treeEditingNodeIdString_.split('-')[1], true);
					}
					else if (treeEditingNodeType_ == "uid") {
						//modify display and nodename with new value
						_editingCellEl.appendChild(document.createTextNode(decodeURIComponent(newValue)));
						_editingCellEl.style.color = treeDiff_COLOR_;

						var el = document.getElementById("treeNode-nodeName-" +
							treeEditingNodeIdString_);
						el.innerHTML = "";
						el.appendChild(document.createTextNode(decodeURIComponent(newValue)));

						//clear children,
						//and if children were displayed
						//		then toggle/show new children
						var elChildrenNode = document.getElementById("treeNode-ChildrenOf-" +
							treeEditingNodeIdString_);
						var wasDisplayed = elChildrenNode.style.display != "none" &&
							elChildrenNode.innerHTML != "";

						toggleTreeChildren(
							treeEditingNodeDepth_,
							treeEditingNodeIdString_.split('-')[1], false);
						elChildrenNode.innerHTML = "";

						if (wasDisplayed)
							toggleTreeChildren(
								treeEditingNodeDepth_,
								treeEditingNodeIdString_.split('-')[1], true);
					}
					else if (treeEditingNodeType_ == "delete-uid") {
						//reset parent children is enough
						//	correct response should come from server

						//var el = document.getElementById("treeNode-" + treeEditingNodeIdString_);
						var pel = document.getElementById("treeNode-ChildrenOf-" +
							treeEditingNodeParentIdString_);
						//pel.removeChild(el);

						if (0) //old way, but loses expansion settings
						{
							//reset parent children
							toggleTreeChildren(treeEditingNodeParentIdString_.split('-')[0],
								treeEditingNodeParentIdString_.split('-')[1], false);
							pel.innerHTML = "";

							//check if parent is now empty in the handler treeViewHandler()
							toggleTreeChildren(treeEditingNodeParentIdString_.split('-')[0],
								treeEditingNodeParentIdString_.split('-')[1], true);

							Debug.log("treeEditingNodeParentIdString_ " + treeEditingNodeParentIdString_);
						}
						else //new way, keep expansion settings
						{
							doCaptureTreeViewExpand();

							//reset parent children
							toggleTreeChildren(treeEditingNodeParentIdString_.split('-')[0],
								treeEditingNodeParentIdString_.split('-')[1], false);
							pel.innerHTML = "";

							doRestoreNextTreeViewExpand(treeEditingNodeParentIdString_ /* scrollTarget */);
							//the doRestoreNextTreeViewExpand will destroy the parent ID string (makes a new one for depth 2+)
							//but will be fixed by scroll target on new node
						}

					}
					else if (treeEditingNodeType_.indexOf("link-") == 0) {
						//change link table/id and clear children
						//and edit peripheral link info

						var csvArr = newValue.split(',');

						if (!refreshLinkTreeNode(
							_editingCellEl,//targetEl,
							treeEditingNodeIdString_,//idString
							treeEditingTargetColumn_,//LinkColumnNameLabel
							treeEditingNodeType_.split('-')[1],//linkType
							csvArr[0],//linkTable
							csvArr[1]))//linkId
						//,tableComment,tableTitle,menuItems,menuItemHandlers);
						{
							//if disconnected from edit, show tooltip
							tableLinkTooltip("We noticed you have a disconnected link.");
						}
					}
					else if (treeEditingNodeType_ == "value") {
						//if(treeEditingNodeType_ == "MultilineData")
						//MultilineData and normal
						//normal data
						_editingCellEl.appendChild(document.createTextNode(decodeURIComponent(newValue)));
						_editingCellEl.style.color = treeDiff_COLOR_;
					}
					else if (treeEditingNodeType_ == "value-bool") {
						var str = "";

						//colorize true false
						str += "<div style='float:left'>";
						str += newValue;
						str += "</div>";

						var color = (newValue == "On" || newValue == "Yes" || newValue == "True") ?
							"rgb(16, 204, 16)" : "rgb(255, 0, 0);";
						str += "<div style='width:10px;height:10px;" +
							"background-color:" + color + ";" +
							"float: left;" +
							"border-radius: 7px;" +
							"border: 2px solid white;" +
							"margin: 2px 0 0 6px;" +
							"'></div>";
						_editingCellEl.innerHTML = str;
						_editingCellEl.style.color = treeDiff_COLOR_;

						//update parent UID status dot if Status or Enabled column
						if (treeEditingTargetColumn_ == "Status" ||
							treeEditingTargetColumn_ == "Enabled") {
							var isEnabled = (newValue == "On" || newValue == "Yes" || newValue == "True");
							updateParentStatusDot(treeEditingNodeParentIdString_, isEnabled);
						}
					}
					else if (treeEditingNodeType_ == "value-groupid") {
						//if parent is a link (depth != 2)
						//	then if no longer in group
						//		then delete from group
						//		if no more children, say no children
						//	else just change value
						//else
						//	change value

						if (treeEditingNodeDepth_ != 2) {
							//check if in group still:
							//	get LINKID of groupid
							//	get LINKID of parent group link
							//	if not matching link
							//		just change value (still in group) and done
							//	if matching LINKIDs
							//		check if still in group ..
							//		(could be separated by | and still in group)


							//try: if failure to find parentLinkIndex,
							//	then likely editing the groupID locally where groupID value is not relevant to position in tree
							try {
								var parentLinkIndex;
								parentLinkIndex =
									document.getElementById("treeNode-childLinkIndex-" +
										(document.getElementById("treeNode-ParentId-" +
											treeEditingNodeParentIdString_).textContent)).textContent;

								var vel = document.getElementById("treeNode-Value-" + treeEditingNodeIdString_);

								//if value-groupid node, link index is last in element class name
								var colType = vel.className.split(' ')[1];
								var selfLinkIndex = colType.substr(
									("treeNode-ValueType-GroupID").length);

								var groupId = document.getElementById("treeNode-Value-" +
									((document.getElementById("treeNode-ParentId-" +
										treeEditingNodeParentIdString_).textContent))).textContent;
								groupId = groupId.split('=')[1].substr(1); //get after =
								groupId = groupId.substr(0, groupId.length - 1); //remove ending )

								Debug.log("parentLinkIndex = " + parentLinkIndex);
								Debug.log("selfLinkIndex = " + selfLinkIndex);
								Debug.log("groupId = " + groupId);

								if (parentLinkIndex != selfLinkIndex) //no match
								{
									//just change value (still in group) and done
									_editingCellEl.appendChild(document.createTextNode(newValue));
									_editingCellEl.style.color = treeDiff_COLOR_;
								}
								else //matching link ids
								{
									var groupIds = newValue.split('|');
									var stillInGroup = false;
									for (var i = 0; i < groupIds.length; ++i)
										if (groupIds[i].trim() == groupId) {
											Debug.log("found groupIds[" + i + "] = " + groupIds[i]);
											stillInGroup = true;
											break;
										}

									if (stillInGroup) {
										_editingCellEl.appendChild(document.createTextNode(newValue));
										_editingCellEl.style.color = treeDiff_COLOR_;
									}
									else // remove from group
									{
										//need to remove parent 'treeNode' from
										//	parent-of-parent childrenNode:
										var parentTreeNode = document.getElementById("treeNode-" +
											treeEditingNodeParentIdString_);
										var popChildrenNode = parentTreeNode.parentNode;
										popChildrenNode.removeChild(parentTreeNode);

										//if no more children, say so
										var popChildren = popChildrenNode.getElementsByClassName("treeNode");
										if (popChildren.length == 0) {
											var str = "";
											str +=
												"<div class='treeNode'> " +
												"<div class='treeNode-Connection'></div>" +
												"<div class='treeNode-Value'>";

											str += "No Children Nodes Found.";

											str += "</div>" + //end treeNode Value div
												"</div>" + //end treeNode div
												"<div id='clearDiv'></div>";
											popChildrenNode.innerHTML = str;
											popChildrenNode.style.color = treeDiff_COLOR_;
										}
									}
								}
							}
							catch (e) {
								//assume new value is not relevant to position in tree
								//finish edit
								Debug.log("Assuming new value is not relevant to position in tree - here is the error: " + e);
								_editingCellEl.appendChild(document.createTextNode(newValue));
								_editingCellEl.style.color = treeDiff_COLOR_;
							}
						}
						else {
							_editingCellEl.appendChild(document.createTextNode(newValue));
							_editingCellEl.style.color = treeDiff_COLOR_;
						}
					}
					else	//unrecognized type!?
					{
						Debug.err("Unrecognized tree edit type '" + treeEditingNodeType_ +
							"!' Should be impossible!");
						editCellCancel();
						return;
					}

					//requests are done, so end editing, update mouseover titles
					if (titleStr) {
						_editingCellEl.title = titleStr;
						var el = document.getElementById("treeNode-Field-title-" + treeEditingNodeIdString_);
						if (el) el.title = titleStr;
					}
					_editingCell = false;
					_editingCellEl = 0;
				} //end localEditTreeNodeOKRequestsComplete
				///////////////////////////////////////////////


			}
			catch (e) {
				Debug.med("Error occured during editCellOK - attempting to recover. Error: ", e);
				editCellCancel();
			}
		} //end editTreeNodeOK()

		//==============================================================================
		//refreshTreeTableVersions ~~
		//	refresh versions based on treeMemberVersions_ fix all the table and table-link versions
		function refreshTreeTableVersions() {
			Debug.log("Refreshing tree table versions...");

			//for each table and link
			//	get table name, and lookup version
			//	fix table/link based on version

			var table;
			var idString;
			var tableStringsObj;

			////////////////////////////
			function localEditTableVersion(targetEl, tableStringsObj) {
				var treeNavContextMenuItems = tableStringsObj.treeNavContextMenuItems;
				var treeNavContextMenuItemHandlers = tableStringsObj.treeNavContextMenuItemHandlers;
				//var tableComment = tableStringsObj.tableComment;
				var tableTitle = tableStringsObj.tableTitle;
				var idString = targetEl.id.substr(("treeNode-Value-").length);

				///////////////////////////////
				//change element title
				targetEl.title = tableTitle;

				//get context menu element
				var el = document.getElementById("treeNode-LinkContextMenuTD-" +
					idString);

				///////////////////////////////
				//change context menu
				// same as in function refreshLinkTreeNode(targetEl,...)
				if (treeNavContextMenuItemHandlers.length == 0) {
					//no context menu items found
					//assume DISCONNECTED!

					el.style.display = "none"; //hide context menu element

					Debug.log("Empty treeNavContextMenuItemHandlers array! Assuming disconnected link.");
				}
				else {
					//change context menu for table link

					el.style.display = "block"; //show context menu element

					var str = "";
					str +=
						"<div class='treeNode-Link' " + //start treeNode Link div
						"onmousedown='" + // start link onmousedown
						SimpleContextMenu.createMenuCallAsString(
							treeNavContextMenuItems,
							treeNavContextMenuItemHandlers,
							"treeNavContextMenu",
							_CONTEXT_MENU_PRIMARY_COLOR,
							_CONTEXT_MENU_SECONDARY_COLOR) + "' "; // end link onmousedown

					str +=
						">" +
						"<div class='gotoNavDiv'></div>" +
						"</div>"; //end treeNode Link div

					el.innerHTML = str;
				}

			} // end localEditTableVersion

			var els = document.getElementsByClassName("treeNode-Value-nodeEditType-link");
			//for each link
			for (var i = 0; i < els.length; ++i) {
				try {
					idString = els[i].id.substr(("treeNode-Value-").length);
					table = document.getElementById("treeNode-linkTableName-" + idString).textContent;

					localEditTableVersion(els[i], getTreeViewTableStrings(table, true /*isLink*/));
				}
				catch (e) {
					//ignore errors
					Debug.log("Failed link table version refresh: " + e);
					continue;
				}
			}

			els = document.getElementsByClassName("treeNode-Value-nodeEditType-table");
			//for each table
			for (var i = 0; i < els.length; ++i) {
				try {
					table = els[i].textContent;
					localEditTableVersion(els[i], getTreeViewTableStrings(table));
				}
				catch (e) {
					//ignore errors
					Debug.log("Failed table version refresh: " + e);
					continue;
				}
			}
		} //end refreshTreeTableVersions()

		//==============================================================================
		//refreshLinkTreeNode ~~
		//	updates link context menu
		//		last 4 commented inputs are generated by getTreeViewTableStrings(tableLinkName)
		//		linkType is "GroupID" or "UID"
		//
		//	return false for DISCONNECTED else true
		function refreshLinkTreeNode(targetEl, idString, LinkColumnNameLabel, linkType, linkTable, linkId) {
			//clear target element
			targetEl.innerHTML = "";

			var retVal = getTreeViewTableStrings(linkTable);
			var treeNavContextMenuItems = retVal.treeNavContextMenuItems;
			var treeNavContextMenuItemHandlers = retVal.treeNavContextMenuItemHandlers;
			var tableComment = retVal.tableComment;
			var tableTitle = retVal.tableTitle;
			var el;

			///////////////////////////////
			//change element title
			targetEl.title = tableTitle;

			///////////////////////////////
			//add type/ID as text node first in case not html safe
			var newValue = "-(" + linkType + " = " + linkId + ")";
			targetEl.appendChild(document.createTextNode(newValue));
			targetEl.style.color = treeDiff_COLOR_;

			//then add html piece to target node (acquire html version of type/ID
			newValue = targetEl.innerHTML;
			newValue = "<label class='treeNode-LinkColumnNameLabel'>" +
				LinkColumnNameLabel +
				"</label>" +
				newValue;
			targetEl.innerHTML = newValue;


			///////////////////////////////
			//change link table name
			el = document.getElementById("treeNode-linkTableName-" +
				idString);
			if (!el) {
				Debug.log("Cannot refresh table link with missing elements! Perhaps user clicked too fast?");
				return;
			}
			el.innerHTML = "";
			el.appendChild(document.createTextNode(linkTable));

			///////////////////////////////
			//change link table comment
			el = document.getElementById("treeNode-TableComment-" +
				idString);
			el.innerHTML = "";
			if (tableComment != "")
				el.appendChild(document.createTextNode("//" + tableComment));

			//get context menu element
			el = document.getElementById("treeNode-LinkContextMenuTD-" +
				idString);

			///////////////////////////////
			//change context menu
			// same as in refreshTreeTableVersions():localEditTableVersion(targetEl,...)
			if (treeNavContextMenuItemHandlers.length == 0) {
				//no context menu items found
				//assume DISCONNECTED!

				el.style.display = "none"; //hide context menu element

				Debug.log("Empty treeNavContextMenuItemHandlers array! Assuming disconnected link.");

				//append disconnected to value
				newValue += "-" +
					"<label class='treeNode-LinkDisconnectedLabel'>" +
					"DISCONNECTED" +
					"</label>";
				targetEl.innerHTML = newValue;

			}
			else {
				//change context menu for table link

				el.style.display = "block"; //show context menu element

				var str = "";
				str +=
					"<div class='treeNode-Link' " + //start treeNode Link div
					"onmousedown='" + // start link onmousedown
					SimpleContextMenu.createMenuCallAsString(
						treeNavContextMenuItems,
						treeNavContextMenuItemHandlers,
						"treeNavContextMenu",
						_CONTEXT_MENU_PRIMARY_COLOR,
						_CONTEXT_MENU_SECONDARY_COLOR) + "' "; // end link onmousedown

				str +=
					">" +
					"<div class='gotoNavDiv'></div>" +
					"</div>"; //end treeNode Link div

				el.innerHTML = str;
			}


			///////////////////////////////
			//clear children,
			//and if children were displayed
			//		then toggle/show new children
			var elChildrenNode = document.getElementById("treeNode-ChildrenOf-" +
				idString);
			var wasDisplayed = elChildrenNode.style.display != "none" &&
				elChildrenNode.innerHTML != "";

			toggleTreeChildren(
				idString.split('-')[0],
				idString.split('-')[1], false);
			elChildrenNode.innerHTML = "";

			if (wasDisplayed)
				toggleTreeChildren(
					idString.split('-')[0],
					idString.split('-')[1], true);

			///////////////////////////////
			//if disconnected, return false
			if (treeNavContextMenuItemHandlers.length == 0)
				return false;
			return true; //true for link is NOT disconnected
		} //end refreshLinkTreeNode()

		//==============================================================================
		//hardRefreshTreeView ~~
		//	redraw tree completely from server request
		function hardRefreshTreeView() {
			Debug.log("hardRefreshTreeView()");

			treeViewHandlerStr_ = ""; //reset
			treeMemberNames_ = []; //reset
			treeMemberVersions_ = []; //reset
			treeMemberComments_ = []; //reset

			//capture expanded children status
			doCaptureTreeViewExpand();

			setupTableGroupTreeView(treeGroupName_, treeGroupKey_);

		} //end hardRefreshTreeView()

		//==============================================================================
		//refreshTreeView ~~
		//	reduce tree back to only root children so that the value are reloaded
		//	but do not reload tables from server in case there are temporary versions
		//	Also, capture expanded nodes for returned expansion
		function refreshTreeView() {
			//capture expanded children status
			Debug.log("refreshTreeView()");

			doCaptureTreeViewExpand();

			var els = document.getElementsByClassName("treeNode-Value-nodeEditType-table");
			var idString;

			//for each table, toggle children to hidden, and delete childrenOf node

			treeViewHandlerStr_ = document.getElementById("display").innerHTML;

			_editingCell = false;
			_editingCellEl = 0;

			doRestoreNextTreeViewExpand(); //launch restore expands

		} //end refreshTreeView()

		//==============================================================================
		//updateParentStatusDot ~~
		//	updates the status dot on a parent UID record node
		//	when a Status or Enabled field is modified
		function updateParentStatusDot(parentIdString, isEnabled) {
			var parentValEl = document.getElementById("treeNode-Value-" + parentIdString);
			if (!parentValEl) return;
			var dots = parentValEl.getElementsByClassName("treeNode-statusDot");
			var tipHint = " (click to enable, shift+click to disable; hold and drag over LEDs to change many at once)";
			if (dots.length) {
				var dot = dots[0];
				if (isEnabled) {
					dot.style.backgroundColor = "rgb(16, 204, 16)";
					dot.style.borderColor = "white";
					dot.style.width = "10px";
					dot.style.height = "10px";
					dot.style.borderRadius = "7px";
				} else {
					dot.style.backgroundColor = "white";
					dot.style.borderColor = "rgb(255, 0, 0)";
					dot.style.width = "5px";
					dot.style.height = "5px";
					dot.style.borderRadius = "3px";
				}
				var titleStr = "Status: " + (isEnabled ? "Enabled" : "Disabled");
				//update tooltip on the wrapper if present (else on the dot itself)
				var wrap = dot.parentElement;
				if (wrap && wrap.classList && wrap.classList.contains("treeNode-statusDotWrap"))
					wrap.title = titleStr + tipHint;
				else
					dot.title = titleStr;
			} else {
				// no dot exists yet, add wrapper+dot
				var dotColor = isEnabled ? "rgb(16, 204, 16)" : "white";
				var borderColor = isEnabled ? "white" : "rgb(255, 0, 0)";
				var dotSize = isEnabled ? "10px" : "5px";
				var dotBorderRadius = isEnabled ? "7px" : "3px";
				var wrapDiv = document.createElement("div");
				wrapDiv.className = "treeNode-statusDotWrap";
				wrapDiv.style.cssText = "float:left;cursor:pointer;width:20px;height:18px;" +
					"display:flex;align-items:center;justify-content:center;";
				wrapDiv.title = "Status: " + (isEnabled ? "Enabled" : "Disabled") + tipHint;
				var dotDiv = document.createElement("div");
				dotDiv.className = "treeNode-statusDot";
				dotDiv.style.cssText = "width:" + dotSize + ";height:" + dotSize +
					";background-color:" + dotColor + ";border-radius:" + dotBorderRadius +
					";border:2px solid " + borderColor + ";pointer-events:none;";
				wrapDiv.appendChild(dotDiv);
				//note: the handlers are not attached here because we don't know depth/uid;
				// this fallback path is rare (UID record that gains a status column on the fly)
				parentValEl.appendChild(wrapDiv);
			}
		} //end updateParentStatusDot()

		//==============================================================================
		// Status-LED click/drag interactions: clicking the small status circle on a
		// UID tree node turns Status ON; shift+click turns it OFF; holding the mouse
		// down and dragging across other LEDs applies the same action to each one.
		var _statusDotDragMode = null;        // null = inactive; true = enable; false = disable
		var _statusDotSaveQueue_ = [];
		var _statusDotSaving_ = false;
		var _statusDotMouseupRegistered_ = false;

		//handleStatusDotMouseDown ~~
		function handleStatusDotMouseDown(event, depth, uid) {
			event.stopPropagation();
			event.preventDefault(); //prevent text selection at the dot itself
			_statusDotDragMode = !event.shiftKey; //shift => disable; otherwise enable
			//suppress text selection and native drag for the duration of the drag
			document.body.classList.add('no-select');
			if (window.getSelection) {
				try { window.getSelection().removeAllRanges(); } catch (e) {}
			}
			registerStatusDotDragListeners();
			applyStatusDot(depth, uid, _statusDotDragMode);
		} //end handleStatusDotMouseDown()

		//handleStatusDotMouseOver ~~
		function handleStatusDotMouseOver(event, depth, uid) {
			if (_statusDotDragMode === null) return;
			event.stopPropagation();
			applyStatusDot(depth, uid, _statusDotDragMode);
		} //end handleStatusDotMouseOver()

		function _statusDotEndDrag() {
			if (_statusDotDragMode === null) return;
			_statusDotDragMode = null;
			document.body.classList.remove('no-select');
		}

		function registerStatusDotDragListeners() {
			if (_statusDotMouseupRegistered_) return;
			_statusDotMouseupRegistered_ = true;
			//end drag on mouseup anywhere
			window.addEventListener('mouseup', _statusDotEndDrag);
			//also end drag if window loses focus
			window.addEventListener('blur', _statusDotEndDrag);
			//block any text selection or native drag while LED drag is active
			document.addEventListener('selectstart', function (e) {
				if (_statusDotDragMode !== null) e.preventDefault();
			});
			document.addEventListener('dragstart', function (e) {
				if (_statusDotDragMode !== null) e.preventDefault();
			});
		}

		//applyStatusDot ~~ optimistically flips LED, then queues a save
		function applyStatusDot(depth, uid, enable) {
			var idString = depth + "-" + uid;
			var el = document.getElementById("treeNode-Value-" + idString);
			if (!el) return;
			var dots = el.getElementsByClassName("treeNode-statusDot");
			if (!dots.length) return;
			var dot = dots[0];

			//skip if already in target state (LED bg green means enabled)
			var currentlyEnabled = dot.style.backgroundColor.indexOf("rgb(16") === 0;
			if (currentlyEnabled === enable) return;

			//figure out the UID (text content of the value node, ignoring child element text)
			var uidText = "";
			for (var i = 0; i < el.childNodes.length; ++i)
				if (el.childNodes[i].nodeType === 3) uidText += el.childNodes[i].nodeValue;
			uidText = uidText.trim();
			if (!uidText) {
				Debug.err("Could not determine UID for status toggle.");
				return;
			}

			//figure out the table name (same approach as handleTreeNodeClick for type=='uid')
			var tableName;
			var path = document.getElementById("treeNode-path-" + idString).textContent;
			var splitArr = path.split('/');
			var parentIdString = document.getElementById("treeNode-ParentId-" + idString).textContent;
			if (depth == 1) {
				tableName = splitArr[splitArr.length - 2];
			} else {
				var pel = document.getElementById("treeNode-linkTableName-" + parentIdString);
				if (!pel) {
					var grandparentEl = document.getElementById("treeNode-ParentId-" + parentIdString);
					if (grandparentEl)
						pel = document.getElementById("treeNode-linkTableName-" + grandparentEl.textContent);
				}
				if (!pel) {
					Debug.err("Could not locate target table for status toggle.");
					return;
				}
				tableName = pel.textContent;
			}

			//optimistically update LED
			updateParentStatusDot(idString, enable);

			_statusDotSaveQueue_.push({
				tableName: tableName,
				uid: uidText,
				enable: enable,
				idString: idString,
				triedEnabledFallback: false
			});
			processStatusDotSaveQueue();
		} //end applyStatusDot()

		//processStatusDotSaveQueue ~~ serializes saves so concurrent edits to the same
		// table do not race on its temporary version
		function processStatusDotSaveQueue() {
			if (_statusDotSaving_) return;
			if (!_statusDotSaveQueue_.length) return;
			var item = _statusDotSaveQueue_[0];

			var tableVersion = -1;
			var tableIndex = -1;
			for (var j = 0; j < treeMemberNames_.length; ++j)
				if (item.tableName == treeMemberNames_[j] &&
					(treeMemberVersions_[j] | 0) != -1) {
					tableVersion = treeMemberVersions_[j];
					tableIndex = j;
					break;
				}
			if (tableIndex == -1) {
				Debug.err("Could not find tree member table '" + item.tableName +
					"' for status toggle.");
				updateParentStatusDot(item.idString, !item.enable); //revert
				_statusDotSaveQueue_.shift();
				processStatusDotSaveQueue();
				return;
			}

			var targetColumn = item.triedEnabledFallback ? "Enabled" : "Status";
			var newValue = item.enable ? "1" : "0"; // server normalizes for OnOff/YesNo/TrueFalse

			_statusDotSaving_ = true;
			DesktopContent.XMLHttpRequest("Request?RequestType=saveTreeNodeEdit" +
				"&editNodeType=value-bool" +
				"&targetTable=" + item.tableName +
				"&targetTableVersion=" + tableVersion +
				"&targetUID=" + encodeURIComponent(item.uid) +
				"&targetColumn=" + targetColumn,
				"newValue=" + newValue,
				function (req, reqParam, errStr) {
					_statusDotSaving_ = false;
					var failed = false;
					if (errStr) {
						Debug.err(errStr);
						failed = true;
					}
					else {
						var err = DesktopContent.getXMLValue(req, "Error");
						if (err) {
							//if the column does not exist as 'Status', retry with 'Enabled'
							if (!item.triedEnabledFallback &&
								(err.indexOf("Status") >= 0 || err.indexOf("Enabled") >= 0) &&
								err.toLowerCase().indexOf("column") >= 0) {
								item.triedEnabledFallback = true;
								processStatusDotSaveQueue();
								return;
							}
							if (err.indexOf("is the same as the current value") > 0) {
								Debug.log(err);
							} else {
								Debug.err(err);
								failed = true;
							}
						}
					}

					if (failed) {
						updateParentStatusDot(item.idString, !item.enable); //revert LED
					} else {
						//maintain tree member versions (possibly more than one table changed)
						if (req && req.responseXML) {
							var names = req.responseXML.getElementsByTagName("savedName");
							var versions = req.responseXML.getElementsByTagName("savedVersion");
							for (var i = 0; i < names.length; ++i) {
								var rn = DesktopContent.getXMLValue(names[i]);
								for (var j = 0; j < treeMemberNames_.length; ++j)
									if (rn == treeMemberNames_[j]) {
										treeMemberVersions_[j] = DesktopContent.getXMLValue(versions[i]);
										break;
									}
							}
						}
						treeHasChanged();
						refreshTreeTableVersions();
						updateStatusFieldDisplayForRecord(item.tableName, item.uid,
							targetColumn, item.enable);
					}

					_statusDotSaveQueue_.shift();
					processStatusDotSaveQueue();
				}, 0, 0, true
			);
		} //end processStatusDotSaveQueue()

		//updateStatusFieldDisplayForRecord ~~ if the Status/Enabled child value node
		// is currently rendered (record expanded), refresh its text + inline dot so
		// the user sees the change consistently
		function updateStatusFieldDisplayForRecord(tableName, uid, columnName, enable) {
			var els = document.getElementsByClassName(
				"treeNode-Value-leafNode-ColumnName-" + columnName);
			for (var i = 0; i < els.length; ++i) {
				var idString = els[i].id.substr(("treeNode-Value-leafNode-").length);
				var depth = idString.split('-')[0] | 0;
				var parentIdEl = document.getElementById("treeNode-ParentId-" + idString);
				if (!parentIdEl) continue;
				var parentIdString = parentIdEl.textContent;
				var thisTable, thisUid;
				if (depth == 2) {
					var grandparentIdEl = document.getElementById("treeNode-ParentId-" + parentIdString);
					if (!grandparentIdEl) continue;
					var tableEl = document.getElementById("treeNode-Value-" + grandparentIdEl.textContent);
					if (!tableEl) continue;
					thisTable = tableEl.textContent;
					var uidEl = document.getElementById("treeNode-Value-" + parentIdString);
					if (!uidEl) continue;
					//strip the LED's empty text content
					thisUid = "";
					for (var k = 0; k < uidEl.childNodes.length; ++k)
						if (uidEl.childNodes[k].nodeType === 3) thisUid += uidEl.childNodes[k].nodeValue;
					thisUid = thisUid.trim();
				} else {
					var pel = document.getElementById("treeNode-linkTableName-" + parentIdString);
					if (!pel) {
						var gpIdEl = document.getElementById("treeNode-ParentId-" + parentIdString);
						if (gpIdEl)
							pel = document.getElementById("treeNode-linkTableName-" + gpIdEl.textContent);
					}
					if (!pel) continue;
					thisTable = pel.textContent;
					var uidNodeEl = document.getElementById("treeNode-Value-" + parentIdString);
					if (!uidNodeEl) continue;
					var uidNodeText = "";
					for (var k = 0; k < uidNodeEl.childNodes.length; ++k)
						if (uidNodeEl.childNodes[k].nodeType === 3) uidNodeText += uidNodeEl.childNodes[k].nodeValue;
					uidNodeText = uidNodeText.trim();
					var uidSplit = uidNodeText.split('=');
					thisUid = uidSplit.length > 1 ? uidSplit[1].split(')')[0].trim() : uidSplit[0];
				}
				if (thisTable !== tableName || thisUid !== uid) continue;

				//derive displayed value text from the column type baked into the className
				var clsMatch = els[i].className.match(/treeNode-ValueType-(OnOff|YesNo|TrueFalse)/);
				var displayText;
				if (clsMatch) {
					if (clsMatch[1] === "OnOff") displayText = enable ? "On" : "Off";
					else if (clsMatch[1] === "YesNo") displayText = enable ? "Yes" : "No";
					else displayText = enable ? "True" : "False";
				} else {
					displayText = enable ? "On" : "Off"; //best-effort
				}

				var color = enable ? "rgb(16, 204, 16)" : "rgb(255, 0, 0)";
				els[i].innerHTML =
					"<div style='float:left'>" + displayText + "</div>" +
					"<div style='width:10px;height:10px;background-color:" + color +
					";float:left;border-radius:7px;border:2px solid white;margin:2px 0 0 6px;'></div>";
				if (typeof treeDiff_COLOR_ !== "undefined")
					els[i].style.color = treeDiff_COLOR_;
			}
		} //end updateStatusFieldDisplayForRecord()

		//==============================================================================
		//getSiblingContext ~~
		//	Returns context for "Set for all" buttons when editing a leaf value.
		//	tableName: always set (from treeEditingTargetTable_)
		//	groupContainerIdString: set only when the parent UID is under a GroupID link
		function getSiblingContext() {
			var ctx = {
				tableName: treeEditingTargetTable_,
				groupContainerIdString: null
			};
			if (!treeEditingNodeParentIdString_) return ctx;

			var parentDepth = parseInt(treeEditingNodeParentIdString_.split('-')[0]);
			if (parentDepth > 1) {
				var grandparentEl = document.getElementById("treeNode-ParentId-" +
					treeEditingNodeParentIdString_);
				if (grandparentEl) {
					var grandparentIdString = grandparentEl.textContent;
					var linkTypeEl = document.getElementById("treeNode-childLinkIdType-" +
						grandparentIdString);
					if (linkTypeEl && linkTypeEl.textContent == "GroupID")
						ctx.groupContainerIdString = grandparentIdString;
				}
			}
			return ctx;
		} //end getSiblingContext()

		//==============================================================================
		//extractCurrentEditValue ~~
		//	Reads the new value from the currently active tree-view edit input.
		function extractCurrentEditValue() {
			if (!_editingCellEl) return undefined;
			var newValue;

			if (treeEditingNodeType_ == "value-bool") {
				var sel = _editingCellEl.getElementsByTagName("select")[0];
				if (sel.selectedIndex < 0) sel.selectedIndex = 0;
				newValue = sel.options[sel.selectedIndex].value;
			}
			else if (treeEditingNodeType_ == "value-bitmap") {
				newValue = encodeURIComponent(_editingCellEl.textContent);
			}
			else {
				var sel;
				if ((sel = _editingCellEl.getElementsByTagName("textarea")).length)
					newValue = sel[0].value;
				else if ((sel = _editingCellEl.getElementsByTagName("select")).length) {
					if (sel[0].style.display == "none")
						newValue = _editingCellEl.getElementsByTagName("input")[0].value;
					else
						newValue = sel[0].options[sel[0].selectedIndex].value;
				}
				else
					newValue = _editingCellEl.getElementsByTagName("input")[0].value;

				newValue = encodeURIComponent(newValue.trim());
			}
			return newValue;
		} //end extractCurrentEditValue()

		//==============================================================================
		//editCellSetAllSiblings ~~
		//	mode: "table" or "group"
		//	"table" - sets value for ALL UIDs in the table (fetches from server)
		//	"group" - sets value for group-member UIDs visible under the GroupID link
		function editCellSetAllSiblings(mode) {
			if (_siblingSaving_) {
				Debug.log("Already processing a Set-for-all operation. Please wait.");
				return;
			}
			if (!_editingCellEl) return;

			var newValue = extractCurrentEditValue();
			if (newValue === undefined) return;

			var targetTable = treeEditingTargetTable_;
			var targetColumn = treeEditingTargetColumn_;
			var editNodeType = treeEditingNodeType_;

			if (mode == "group") {
				var ctx = getSiblingContext();
				if (!ctx.groupContainerIdString) {
					Debug.log("No group context found.", Debug.WARN_PRIORITY);
					return;
				}
				var childrenContainer = document.getElementById(
					"treeNode-ChildrenOf-" + ctx.groupContainerIdString);
				if (!childrenContainer) {
					Debug.log("Cannot find group sibling container.", Debug.WARN_PRIORITY);
					return;
				}
				var allUidEls = childrenContainer.getElementsByClassName(
					"treeNode-Value-nodeEditType-uid");
				var siblingUidEls = [];
				for (var i = 0; i < allUidEls.length; ++i) {
					var sibIdStr = allUidEls[i].id.substr("treeNode-Value-".length);
					var sibParentEl = document.getElementById("treeNode-ParentId-" + sibIdStr);
					if (sibParentEl && sibParentEl.textContent == ctx.groupContainerIdString)
						siblingUidEls.push(allUidEls[i]);
				}
				if (!siblingUidEls.length) {
					Debug.log("No sibling records found in group.", Debug.WARN_PRIORITY);
					return;
				}

				var decodedVal = decodeURIComponent(newValue);
				if (!confirm("Set '" + targetColumn + "' to '" +
					decodedVal + "' for " + siblingUidEls.length +
					" record" + (siblingUidEls.length != 1 ? "s" : "") +
					" in the group?"))
					return;

				for (var i = 0; i < siblingUidEls.length; ++i) {
					var sibUid = localExtractUidFromNode(siblingUidEls[i]);
					if (sibUid)
						_siblingSaveQueue_.push({
							tableName: targetTable,
							uid: sibUid,
							column: targetColumn,
							newValue: newValue,
							editNodeType: editNodeType
						});
				}

				editCellCancel();
				_siblingSavedUIDs_ = [];
				processSiblingSaveQueue();
			}
			else if (mode == "table") {
				var tableVersion = -1;
				for (var j = 0; j < treeMemberNames_.length; ++j)
					if (targetTable == treeMemberNames_[j] &&
						(treeMemberVersions_[j] | 0) != -1) {
						tableVersion = treeMemberVersions_[j];
						break;
					}
				if (tableVersion == -1) {
					Debug.log("Could not find table '" + targetTable +
						"' in tree members.", Debug.HIGH_PRIORITY);
					return;
				}

				DesktopContent.XMLHttpRequest(
					"Request?RequestType=getSpecificTable" +
					"&dataOffset=0&chunkSize=0" +
					"&tableName=" + targetTable +
					"&version=" + tableVersion,
					"",
					function(req, reqParam, errStr) {
						if (errStr) {
							Debug.err(errStr);
							return;
						}
						var err = DesktopContent.getXMLValue(req, "Error");
						if (err) {
							Debug.err(err);
							return;
						}

						var colCSVEls = req.responseXML.getElementsByTagName(
							"CurrentVersionRows")[0].getElementsByTagName("ColCSV");
						if (!colCSVEls.length) {
							Debug.log("No data rows in table.", Debug.WARN_PRIORITY);
							return;
						}
						var colTypeEls = req.responseXML.getElementsByTagName(
							"CurrentVersionColumnHeaders")[0].getElementsByTagName("ColumnType");
						var uidColIndex = 0;
						for (var ci = 0; ci < colTypeEls.length; ++ci)
							if (colTypeEls[ci].getAttribute("value") == "UID") {
								uidColIndex = ci;
								break;
							}
						var csvVal = colCSVEls[uidColIndex].getAttribute("value");
						var allUIDs = csvVal.length ?
							csvVal.split(",").map(decodeURIComponent) : [];
						if (!allUIDs.length) {
							Debug.log("No UIDs found in table.", Debug.WARN_PRIORITY);
							return;
						}

						var decodedVal = decodeURIComponent(newValue);
						if (!confirm("Set '" + targetColumn + "' to '" +
							decodedVal + "' for " + allUIDs.length +
							" record" + (allUIDs.length != 1 ? "s" : "") +
							" in table '" + targetTable + "'?"))
							return;

						for (var i = 0; i < allUIDs.length; ++i) {
							_siblingSaveQueue_.push({
								tableName: targetTable,
								uid: allUIDs[i],
								column: targetColumn,
								newValue: newValue,
								editNodeType: editNodeType
							});
						}

						editCellCancel();
						_siblingSavedUIDs_ = [];
						processSiblingSaveQueue();
					},
					0, 0, true
				);
			}

			function localExtractUidFromNode(uidEl) {
				var sibIdString = uidEl.id.substr("treeNode-Value-".length);
				var sibDepth = parseInt(sibIdString.split('-')[0]);
				if (sibDepth == 1) {
					var uidText = "";
					for (var k = 0; k < uidEl.childNodes.length; ++k)
						if (uidEl.childNodes[k].nodeType === 3)
							uidText += uidEl.childNodes[k].nodeValue;
					return uidText.trim();
				}
				else {
					var txt = uidEl.textContent;
					var parts = txt.split('=');
					if (parts.length > 1)
						return parts[parts.length - 1].split(')')[0].trim();
					return txt.trim();
				}
			}
		} //end editCellSetAllSiblings()

		//==============================================================================
		//processSiblingSaveQueue ~~
		function processSiblingSaveQueue() {
			if (_siblingSaving_) return;
			if (!_siblingSaveQueue_.length) return;
			var item = _siblingSaveQueue_[0];

			var tableVersion = -1;
			var tableIndex = -1;
			for (var j = 0; j < treeMemberNames_.length; ++j)
				if (item.tableName == treeMemberNames_[j] &&
					(treeMemberVersions_[j] | 0) != -1) {
					tableVersion = treeMemberVersions_[j];
					tableIndex = j;
					break;
				}
			if (tableIndex == -1) {
				Debug.err("Could not find tree member table '" + item.tableName +
					"' for sibling save.");
				_siblingSaveQueue_ = [];
				return;
			}

			_siblingSaving_ = true;
			DesktopContent.XMLHttpRequest(
				"Request?RequestType=saveTreeNodeEdit" +
				"&editNodeType=" + item.editNodeType +
				"&targetTable=" + item.tableName +
				"&targetTableVersion=" + tableVersion +
				"&targetUID=" + encodeURIComponent(item.uid) +
				"&targetColumn=" + item.column,
				"newValue=" + item.newValue,
				function(req, reqParam, errStr) {
					_siblingSaving_ = false;
					var failed = false;

					if (errStr) {
						Debug.err(errStr);
						failed = true;
					}
					else {
						var err = DesktopContent.getXMLValue(req, "Error");
						if (err) {
							if (err.indexOf("is the same as the current value") > 0)
								Debug.log(err);
							else {
								Debug.err(err);
								failed = true;
							}
						}
					}

					if (!failed && req && req.responseXML) {
						var names = req.responseXML.getElementsByTagName("savedName");
						var versions = req.responseXML.getElementsByTagName("savedVersion");
						for (var i = 0; i < names.length; ++i) {
							var rn = DesktopContent.getXMLValue(names[i]);
							for (var j = 0; j < treeMemberNames_.length; ++j)
								if (rn == treeMemberNames_[j]) {
									treeMemberVersions_[j] =
										DesktopContent.getXMLValue(versions[i]);
									break;
								}
						}
						_siblingSavedUIDs_.push(item.uid);
					}

					var lastItem = _siblingSaveQueue_[0];
					_siblingSaveQueue_.shift();

					if (failed) {
						Debug.log("Aborting Set-for-all after error on UID '" +
							item.uid + "'. " + _siblingSaveQueue_.length +
							" remaining saves skipped.", Debug.HIGH_PRIORITY);
						_siblingSaveQueue_ = [];
						refreshTreeTableVersions();
						return;
					}

					if (!_siblingSaveQueue_.length) {
						treeHasChanged();
						refreshTreeTableVersions();
						updateSiblingFieldDisplays(
							lastItem.tableName, lastItem.column,
							lastItem.newValue, lastItem.editNodeType,
							_siblingSavedUIDs_);
						Debug.log("Set-for-all complete for column '" +
							lastItem.column + "' in table '" +
							lastItem.tableName + "'.");
					}

					processSiblingSaveQueue();
				},
				0, 0, true
			);
		} //end processSiblingSaveQueue()

		//updateSiblingFieldDisplays ~~
		function updateSiblingFieldDisplays(tableName, columnName, newValue, editNodeType, savedUIDs) {
			var els = document.getElementsByClassName(
				"treeNode-Value-leafNode-ColumnName-" + columnName);
			var decodedValue = decodeURIComponent(newValue);

			for (var i = 0; i < els.length; ++i) {
				var idString = els[i].id.substr("treeNode-Value-leafNode-".length);
				var parentIdEl = document.getElementById("treeNode-ParentId-" + idString);
				if (!parentIdEl) continue;
				var parentIdString = parentIdEl.textContent;
				var depth = parseInt(idString.split('-')[0]);

				var table;
				if (depth == 2) {
					var gpIdEl = document.getElementById("treeNode-ParentId-" + parentIdString);
					if (!gpIdEl) continue;
					var tableEl = document.getElementById("treeNode-Value-" + gpIdEl.textContent);
					if (!tableEl) continue;
					table = tableEl.textContent;
				}
				else {
					var pel = document.getElementById("treeNode-linkTableName-" + parentIdString);
					if (!pel) {
						var gpIdEl = document.getElementById("treeNode-ParentId-" + parentIdString);
						if (gpIdEl)
							pel = document.getElementById("treeNode-linkTableName-" + gpIdEl.textContent);
					}
					if (!pel) continue;
					table = pel.textContent;
				}

				if (table != tableName) continue;

				if (savedUIDs && savedUIDs.length) {
					var uidEl = document.getElementById("treeNode-Value-" + parentIdString);
					if (!uidEl) continue;
					var uidText = "";
					for (var k = 0; k < uidEl.childNodes.length; ++k)
						if (uidEl.childNodes[k].nodeType === 3)
							uidText += uidEl.childNodes[k].nodeValue;
					uidText = uidText.trim();
					if (depth != 2) {
						var parts = uidText.split('=');
						if (parts.length > 1)
							uidText = parts[parts.length - 1].split(')')[0].trim();
					}
					if (savedUIDs.indexOf(uidText) < 0) continue;
				}

				if (editNodeType == "value-bool") {
					var color = (decodedValue == "On" || decodedValue == "Yes" ||
						decodedValue == "True") ?
						"rgb(16, 204, 16)" : "rgb(255, 0, 0)";
					els[i].innerHTML =
						"<div style='float:left'>" + decodedValue + "</div>" +
						"<div style='width:10px;height:10px;background-color:" + color +
						";float:left;border-radius:7px;border:2px solid white;" +
						"margin:2px 0 0 6px;'></div>";

					if (columnName == "Status" || columnName == "Enabled")
						updateParentStatusDot(parentIdString,
							(decodedValue == "On" || decodedValue == "Yes" ||
								decodedValue == "True"));
				}
				else {
					els[i].innerHTML = "";
					els[i].appendChild(document.createTextNode(decodedValue));
				}

				var titleEl = document.getElementById("treeNode-Field-title-" + idString);
				if (titleEl) {
					var titleStr = titleEl.title;
					if (titleStr) {
						var ti = titleStr.indexOf("Value: ");
						if (ti > 0)
							titleStr = titleStr.substr(0, ti) +
								"Value: \t" + decodedValue + "\n";
						titleEl.title = titleStr;
						els[i].title = titleStr;
					}
				}
			}
		} //end updateSiblingFieldDisplays()

							//	if parent is groupid link.. then two levels back

				if (treeEditingNodeDepth_ != 2) //only if self was not depth 2

						table = document.getElementById("treeNode-Value-" +

				{

						uid = els[i].textContent;

							//check if change keeps the uid in the group or not

							groupId = groupId.substr(0, groupId.length - 1); //remove ending )

				//find all group links with target table and
				//	if groupId is match
				//		and if uid is not present
				//		then clear children
				{
					var els = document.getElementsByClassName("treeNode-Value-nodeEditType-link");
					var idString;
					var table, groupId, groupIdIndex, foundInGroup;

						groupId = groupId.split('=')[1].substr(1); //get after =

						for (groupIdIndex = 0; groupIdIndex < groupIds.length; ++groupIdIndex)

								Debug.log("found groupIds[" + groupIdIndex + "] = " +

							//if uid is not one of the children then delete them all

			//	last step is to update treeViewHandlerStr_ for page nav
			treeViewHandlerStr_ = document.getElementById("display").innerHTML;

		//==============================================================================
		//editCellOK
		function editCellOK() {
			//detect proper views
			var el = document.getElementById("treeView-ConfigGroupLink");
			if (el) //tree view
				return editTreeNodeOK();

			//avoid doing anything while popup is open
			el = document.getElementById("popUpDialog");
			if (el && el.style.display != "none") //config gui popup
				return;
			el = document.getElementById(ConfigurationAPI._POP_UP_DIALOG_ID);
			if (el && el.style.display != "none") //config API popup
				return;

			//else table view
			//...

			if (!_editingCellEl) return;

			var r = _editingCellPos[0];
			var c = _editingCellPos[1];

			//if child link cell or boolean cell
			try {
				var sel;
				if ((sel = _editingCellEl.getElementsByTagName("select")).length) {
					sel = sel[0]; //assume the first select in the cell is the select

					Debug.log("CfgGUI editCellOK editing r,c:" + r + "," + c);

					//check if displayed
					if (sel.style.display == "none") {
						//if not displayed assume first input field is ours!
						//take "normal cell" approach from below
						var str = "";
						try {
							str = _editingCellEl.getElementsByTagName("input")[0].value;
							Debug.log("CfgGUI editCellOK editing r,c:" + r + "," + c + " = " +
								str);
						}
						catch (err) {
							Debug.log("Error try-catch: " + err);
						}

						_editingCellEl.innerHTML = "";

						if (_editingCellType.indexOf("ChildLink-") == 0 &&
							str != ConfigurationAPI._DATATYPE_LINK_DEFAULT) {
							var astr = "";
							astr += "<a href='#'>"; //for show
							astr += str;
							astr += "</a>";
							_editingCellEl.innerHTML = astr;
						}
						else
							_editingCellEl.appendChild(document.createTextNode(str));
					}
					else {
						if (sel.selectedIndex < 0) sel.selectedIndex = 0; //default to default
						var selVal = sel.options[sel.selectedIndex].value;

						Debug.log("CfgGUI editCellOK = " +
							selVal);

						str = "";
						str += selVal;

						_editingCellEl.innerHTML = "";

						if (_editingCellType.indexOf("ChildLink-") == 0 &&
							str != ConfigurationAPI._DATATYPE_LINK_DEFAULT) {
							var astr = "";
							astr += "<a href='#'>"; //for show
							astr += str;
							astr += "</a>";
							_editingCellEl.innerHTML = astr;
						}
						else
							_editingCellEl.appendChild(document.createTextNode(str)); //_editingCellEl.innerHTML = str;

						//assume no child link will be named a boolean word
						var boolTypeTrues = ["On", "True", "Yes"];
						var statusTypeFalses = ["Off", "False", "No"];

						//determine if true value
						var isTrue = false;
						var isFalse = false;
						for (var i = 0; i < boolTypeTrues.length; ++i)
							if (boolTypeTrues[i] == selVal) {
								isTrue = true; break;
							}
						for (var i = 0; !isTrue && i < statusTypeFalses.length; ++i)
							if (statusTypeFalses[i] == selVal) {
								isFalse = true; break;
							}

						if (isTrue)
							_editingCellEl.style.backgroundColor = _TABLE_BOOL_TYPE_TRUE_COLOR;
						else if (isFalse)

				else //normal cell
				{
					var str = "";
					try {

						Debug.log("CfgGUI editCellOK editing r,c:" + r + "," + c + " = " +
							str);

			if (_tableViewIsTransposed)
				numDataRows = rows[_CONFIG_DATA_COL_OFFSET + c].getElementsByTagName("td").length + 1 - _CONFIG_DATA_ROW_OFFSET;
			else
				numDataRows = rows.length - _CONFIG_DATA_ROW_OFFSET;

			if (!confirm("Set this column to '" + newValue +
				"' for " + numDataRows + " record" +
				(numDataRows != 1 ? "s" : "") + " in the table?"))
				return;

			var boolTypeTrues = ["On","True","Yes"];
			var statusTypeFalses = ["Off","False","No"];

			for (var i = 0; !isTrue && i < statusTypeFalses.length; ++i)
				if (statusTypeFalses[i] == newValue) { isFalse = true; break; }

			for (var ri = 0; ri < numDataRows; ++ri) {

				if (_tableViewIsTransposed)
					cell = rows[_CONFIG_DATA_COL_OFFSET + c].getElementsByTagName("td")[_CONFIG_DATA_ROW_OFFSET - 1 + ri];
				else
					cell = rows[_CONFIG_DATA_ROW_OFFSET + ri].getElementsByTagName("td")[_CONFIG_DATA_COL_OFFSET + c];

				if (cell == _editingCellEl) continue;

				cell.innerHTML = "";

					cell.style.backgroundColor = _TABLE_BOOL_TYPE_TRUE_COLOR;

					cell.style.backgroundColor = _TABLE_BOOL_TYPE_FALSE_COLOR;

		//editCellSetAllInGroup ~~
		function editCellSetAllInGroup() {
			if (!_editingCellEl) return;

			var r = _editingCellPos[0];
			var c = _editingCellPos[1];

			var newValue;
			try {
				var sel;
				if ((sel = _editingCellEl.getElementsByTagName("select")).length) {
					sel = sel[0];
					if (sel.style.display == "none")
						newValue = _editingCellEl.getElementsByTagName("input")[0].value;
					else {
						if (sel.selectedIndex < 0) sel.selectedIndex = 0;
						newValue = sel.options[sel.selectedIndex].value;
					}
				}
				else if ((sel = _editingCellEl.getElementsByTagName("textarea")).length)
					newValue = sel[0].value;
				else
					newValue = _editingCellEl.getElementsByTagName("input")[0].value;
			}
			catch(err) {
				Debug.log("Error extracting value: " + err);
				return;
			}

			var tableEl = document.getElementById("SubSystemTable");
			var rows = tableEl.getElementsByTagName("tr");

			var numCols = _tableViewIsTransposed ?
				(rows.length - _CONFIG_DATA_COL_OFFSET) :
				(rows[0].getElementsByTagName("td").length - _CONFIG_DATA_COL_OFFSET);
			var numDataRows = _tableViewIsTransposed ?
				(rows[_CONFIG_DATA_COL_OFFSET].getElementsByTagName("td").length + 1 - _CONFIG_DATA_ROW_OFFSET) :
				(rows.length - _CONFIG_DATA_ROW_OFFSET);

			var myGroupIds = [];
			for (var ci = 0; ci < numCols; ++ci) {
				var ct;
				if (_tableViewIsTransposed)
					ct = rows[_CONFIG_DATA_COL_OFFSET + ci].getElementsByTagName("td")[0].childNodes[0].childNodes[0].innerText;
				else
					ct = rows[0].getElementsByTagName("td")[_CONFIG_DATA_COL_OFFSET + ci].childNodes[0].childNodes[0].innerText;
				if (ct.indexOf("GroupID") != 0) continue;
				var cellVal;
				if (_tableViewIsTransposed)
					cellVal = rows[_CONFIG_DATA_COL_OFFSET + ci].getElementsByTagName("td")[_CONFIG_DATA_ROW_OFFSET - 1 + r].textContent.trim();
				else
					cellVal = rows[_CONFIG_DATA_ROW_OFFSET + r].getElementsByTagName("td")[_CONFIG_DATA_COL_OFFSET + ci].textContent.trim();
				if (cellVal && cellVal != "" && cellVal != "DEFAULT") {
					var parts = cellVal.split('|');
					for (var pi = 0; pi < parts.length; ++pi) {
						var gid = parts[pi].trim();
						//scope by GroupID column index so same value in a different
						//	GroupID column does not match
						if (gid && myGroupIds.indexOf(ci + ":" + gid) < 0)
							myGroupIds.push(ci + ":" + gid);
					}
				}
			}

			if (!myGroupIds.length) {
				Debug.log("No GroupID found for this record.", Debug.WARN_PRIORITY);
				return;
			}

			var matchingRows = [];
			for (var ri = 0; ri < numDataRows; ++ri) {
				if (ri == r) { matchingRows.push(ri); continue; }
				var isMatch = false;
				for (var ci = 0; ci < numCols && !isMatch; ++ci) {
					var ct;
					if (_tableViewIsTransposed)
						ct = rows[_CONFIG_DATA_COL_OFFSET + ci].getElementsByTagName("td")[0].childNodes[0].childNodes[0].innerText;
					else
						ct = rows[0].getElementsByTagName("td")[_CONFIG_DATA_COL_OFFSET + ci].childNodes[0].childNodes[0].innerText;
					if (ct.indexOf("GroupID") != 0) continue;
					var cellVal;
					if (_tableViewIsTransposed)
						cellVal = rows[_CONFIG_DATA_COL_OFFSET + ci].getElementsByTagName("td")[_CONFIG_DATA_ROW_OFFSET - 1 + ri].textContent.trim();
					else
						cellVal = rows[_CONFIG_DATA_ROW_OFFSET + ri].getElementsByTagName("td")[_CONFIG_DATA_COL_OFFSET + ci].textContent.trim();
					if (!cellVal || cellVal == "" || cellVal == "DEFAULT") continue;
					var parts = cellVal.split('|');
					for (var pi = 0; pi < parts.length; ++pi) {
						if (myGroupIds.indexOf(ci + ":" + parts[pi].trim()) >= 0) {
							isMatch = true;
							break;
						}
					}
				}
				if (isMatch) matchingRows.push(ri);
			}

			if (!confirm("Set this column to '" + newValue +
				"' for " + matchingRows.length + " record" +
				(matchingRows.length != 1 ? "s" : "") +
				" in the group (GroupID: " + myGroupIds.map(function(s) { return s.substring(s.indexOf(":") + 1); }).join(", ") + ")?"))
				return;

			var boolTypeTrues = ["On","True","Yes"];
			var statusTypeFalses = ["Off","False","No"];
			var isTrue = false;
			var isFalse = false;
			for (var i = 0; i < boolTypeTrues.length; ++i)
				if (boolTypeTrues[i] == newValue) { isTrue = true; break; }
			for (var i = 0; !isTrue && i < statusTypeFalses.length; ++i)
				if (statusTypeFalses[i] == newValue) { isFalse = true; break; }

			for (var mi = 0; mi < matchingRows.length; ++mi) {
				var ri = matchingRows[mi];
				var cell;
				if (_tableViewIsTransposed)
					cell = rows[_CONFIG_DATA_COL_OFFSET + c].getElementsByTagName("td")[_CONFIG_DATA_ROW_OFFSET - 1 + ri];
				else
					cell = rows[_CONFIG_DATA_ROW_OFFSET + ri].getElementsByTagName("td")[_CONFIG_DATA_COL_OFFSET + c];

				if (!cell) continue;
				if (cell == _editingCellEl) continue;

				cell.innerHTML = "";
				cell.appendChild(document.createTextNode(newValue));

				if (isTrue)
					cell.style.backgroundColor = _TABLE_BOOL_TYPE_TRUE_COLOR;
				else if (isFalse)
					cell.style.backgroundColor = _TABLE_BOOL_TYPE_FALSE_COLOR;
			}

			editCellOK();
		} //end editCellSetAllInGroup()

		//addRow ~~
		// adds row to position r (relative to view on page)
		// absolute row is _dataOffset + r
		function addRow(rowToAdd) {
			Debug.log("CfgGUI addRow " + rowToAdd);

			editCellOK(); //editCellCancel();

			var el = document.getElementById("SubSystemTable");
			var rows = el.getElementsByTagName("tr");
			var str = "";
			var cols = [];

			var colTypes = getTableViewColTypes(rows);


			if (!_tableViewIsTransposed) //reading from normal view
			{
				//get all cols
				for (var r = 0, newr = 0; r < rows.length + 1; ++r) {
					if (r - _CONFIG_DATA_ROW_OFFSET == rowToAdd) {
						//create row of default column cells
						var newRowArr = [];
						for (var c = 0; c < rows[0].childNodes.length; ++c) {
							newRowArr.push(document.createElement("td"));
							if (c >= _CONFIG_DATA_COL_OFFSET) //skip row # column
							{
								if (c - _CONFIG_DATA_COL_OFFSET ==
									_tableDefaultRowValues.length) //add date
									newRowArr[c].innerHTML = ConfigurationAPI.getDateString(new Date());
								else
									newRowArr[c].innerHTML =
										_tableDefaultRowValues[c - _CONFIG_DATA_COL_OFFSET];
							}
						}
						cols[newr] = newRowArr; //add new row
						++newr;
					}

					if (r >= rows.length) continue; //gone through all data already

					if (r == _CONFIG_DATA_ROW_OFFSET - 1) //col names are headers
						cols[newr] = rows[r].getElementsByTagName("th");
					else
						cols[newr] = rows[r].getElementsByTagName("td");
					++newr;
				}

			}
			else						//reading from transposed view
			{
				//get all cols (transposed)
				var tmpCols;
				var numOfNewRows = -1;
				for (var c = 0; c < rows.length; ++c) {
					cols.push([]); //push empty column, for each

					//assume there is 1 th cell
					tmpCols = rows[c].getElementsByTagName("td");
					for (var r = 0, newr = 0, tmpColsIndex = 0; r < tmpCols.length + 2; ++r) //+1 for th, and +1 for new row
					{
						if (r - _CONFIG_DATA_ROW_OFFSET == rowToAdd) {
							//create default col cell to new row
							cols[c][newr] = document.createElement("td");
							if (c >= _CONFIG_DATA_COL_OFFSET) //skip row # column
							{
								if (c - _CONFIG_DATA_COL_OFFSET ==
									_tableDefaultRowValues.length) //add date
									cols[c][newr].innerHTML = ConfigurationAPI.getDateString(new Date());
								else
									cols[c][newr].innerHTML =
										_tableDefaultRowValues[c - _CONFIG_DATA_COL_OFFSET];
							}

							++newr;
						}

						if (r >= tmpCols.length + 1) continue; //gone through all data already

						if (r == _CONFIG_DATA_ROW_OFFSET - 1) //col names are headers
							cols[c][newr] = rows[c].getElementsByTagName("th")[0];
						else //take from the td cels
							cols[c][newr] = tmpCols[tmpColsIndex++];
						++newr;
					}
				}
			}

			//create output string based on cols
			str += createTableViewOutputStr(cols, colTypes);

			el.innerHTML = str;

			versionHasChanged();

			//update last add row link
			if (_tableViewIsTransposed) {
				document.getElementById("lastAddRowLink0").onclick =
					function () {
						addRow(cols[0].length - _CONFIG_DATA_ROW_OFFSET);
						return false;
					};
				document.getElementById("lastAddRowLink1").onclick =
					function () {
						addRow(cols[0].length - _CONFIG_DATA_ROW_OFFSET);
						return false;
					};
			}
			else {
				document.getElementById("lastAddRowLink0").onclick =
					function () {
						addRow(cols.length - _CONFIG_DATA_ROW_OFFSET);
						return false;
					};
				document.getElementById("lastAddRowLink1").onclick =
					function () {
						addRow(cols.length - _CONFIG_DATA_ROW_OFFSET);
						return false;
					};
			}

			registerOnClickActions();

		} //end addRow()

										"&version=" + targetTable[1],
										"", function (req) {

										//Note: copied download code from downloadTableAsCSV()

										var rowDel = '\n';
										var colDel = document.getElementById("fieldSelect").value;

										var dataStr = "data:text/csv;charset=utf-8,";

											var colCSVEls = req.responseXML.getElementsByTagName(

											var dlColArrays = [];

											var link = document.createElement("a");

									}); //end download request and handling

					}; //end button onmouseup handler

				if (isUpload) //add option a Multiple Files handler
				{
					Debug.log("Adding Upload special behavior");



					//add all the file upload event listeners
					//	every file upload should modify
					//	uploadedFiles object:
					//		{tableName : tableUploadString}
					//	Note: multiple files use file name to associate to tableName
					//	Note: individual files use position to associate to tableName

						////////////////////
						//localGetUploadFiles ~~
						//	recursively localGetUploadFiles
						function localGetUploadFiles() {
							if (fileArr.length == 0) return;

							var fileIndex = fileArr.pop();
