		//==============================================================================
		//bodyKeyHandler ~~
		function bodyKeyHandler(e) {
			if (document.activeElement.id == "tree-view-searchbar") {
				Debug.log("Ignoring key press and giving searchbar priority...");
				return;
			}
			//ignore typing inside the verification popup's input field
			// (otherwise tree-view hotkeys hijack characters as the user types
			//  the new UID / value in the popup prompt)
			if (document.activeElement.id == "DesktopContent_popUpUserInput")
				return;

			Debug.log("key " + e.keyCode);

			//detect proper views
			var el = document.getElementById("treeView-ConfigGroupLink");
			var popUpEl = document.getElementById("popUpDialog");
			if (!popUpEl)
				popUpEl = document.getElementById(ConfigurationAPI._POP_UP_DIALOG_ID);

			if (popUpEl && popUpEl.style.display != "none") return; //allow popup to get keys

			//tree view key handler and no popup and no editing cell
			if (el && !_editingCellEl) {
				//NOTE: Firefox and Chrome have different keycodes for +/-
				var expandKeys = ['a', 'e', '>', '.', '}', ']', '+', '='];
				var hideKeys = ['z', 'm', '<', ',', '{', '[', '-', '_'];

				//Debug.log("treeView bodyKey " + e.key);

				for (var i = 0; i < expandKeys.length; ++i)
					if (expandKeys[i] == e.key.toLowerCase()) {
						//handle expand
						Debug.log("treeView bodyKey expand " + e.key);
						expandTreeChildrenDepth();

						event.stopImmediatePropagation(); // Prevents further listeners on the same element
						if (e.preventDefault)
							e.preventDefault();
						break;
					}

				for (var i = 0; i < hideKeys.length; ++i)
					if (hideKeys[i] == e.key.toLowerCase()) {
						//handle hide
						Debug.log("treeView bodyKey hide " + e.key);
						hideTreeChildrenDepth();

						event.stopImmediatePropagation(); // Prevents further listeners on the same element
						if (e.preventDefault)
							e.preventDefault();
						break;
					}



				if (e.key == "ArrowUp" || e.key == "ArrowDown")  //re-select self
				{
					if(treeEditingNodeType_ == "")
					{
						Debug.log("No tree node previously selected, so ignoring arrow key...");
						return;
					}
					Debug.log("Returning to id '" + treeEditingNodeIdString_ + "'", treeEditingNodeType_);
					handleTreeNodeClick(
						treeEditingNodeIdString_.split('-')[0],
						treeEditingNodeIdString_.split('-')[1],
						1 /* editClick */,
						treeEditingNodeType_.indexOf("value") == 0 ? //convert all value types to 'value'
							"value" : treeEditingNodeType_,
						true /* waitForOpsToComplete */
					);

					event.stopImmediatePropagation(); // Prevents further listeners on the same element
					if (e.preventDefault)
						e.preventDefault();
				}
				else if (e.keyCode == 8) //BACKSPACE in tree-view: navigate back
				{
					var t = e.target;
					if (t && (t.tagName == "INPUT" || t.tagName == "TEXTAREA" || t.isContentEditable))
						return;
					if (navigateBack())
					{
						event.stopImmediatePropagation();
						if (e.preventDefault)
							e.preventDefault();
						return false;
					}
				}
			}
			else if ((e.key == "ArrowLeft" || e.key == "ArrowRight") &&
				!_editingCellEl &&
				window._specificTableVersionNav) {
				// LEFT/RIGHT arrow: navigate to previous/next version in Specific Table View
				var displayEl = document.getElementById("display");
				if (displayEl && displayEl.children[0] &&
					displayEl.children[0].textContent == "Specific Table View") {
					var nav = window._specificTableVersionNav;
					var curIdx = nav.allVersions.indexOf(nav.currentVersion);
					var targetVersion;
					if (e.key == "ArrowLeft" && curIdx > 0)
						targetVersion = nav.allVersions[curIdx - 1];
					else if (e.key == "ArrowRight" && curIdx >= 0 &&
						curIdx < nav.allVersions.length - 1)
						targetVersion = nav.allVersions[curIdx + 1];
					if (targetVersion !== undefined) {
						e.stopImmediatePropagation();
						if (e.preventDefault)
							e.preventDefault();
						setupSpecificTable(nav.tableName,
							"" + targetVersion, nav.backLinkStr);
					}
				}
			}
			else if (e.key == "Escape" && _editingCellEl) {
				Debug.log(e.key);
				event.stopImmediatePropagation(); // Prevents further listeners on the same element
				if (e.preventDefault)
					e.preventDefault();
				editCellCancel();
				return false;
			}
			else if (e.key == "Escape") {
				//check if paint mode is active and cancel it
				if (document.body.style.cursor == _CURSOR_PAINTER_SOURCE ||
					document.body.style.cursor == _CURSOR_SELECTOR_SOURCE) {
					Debug.log("Cancelling paint mode");
					togglePaintCellValue();
					e.stopImmediatePropagation();
					if (e.preventDefault)
						e.preventDefault();
					return false;
				}
			}
			else if (e.ctrlKey && e.key.toLowerCase() == "v")
			{
				const selectedRows = document.querySelectorAll("#SubSystemTable tr.selected");
				Debug.log("Number of selected rows " + selectedRows.length);
				if(selectedRows.length)
				{
					Debug.log("Copying and pasting table rows");
					copyAndPasteBlockRows();
					registerOnClickActions();
					e.stopImmediatePropagation();
					if (e.preventDefault)
						e.preventDefault();
					return false;
				}
			}
			else if ((e.ctrlKey && e.key.toLowerCase() == "d") ||
				e.keyCode == 8 || //BACKSPACE
				e.keyCode == 46) //DELETE
			{
				const selectedRows = document.querySelectorAll("#SubSystemTable tr.selected");
				Debug.log("Number of selected rows " + selectedRows.length);
				if(selectedRows.length)
				{
					Debug.log("Deleting block of table rows");
					deleteBlockRows();
					registerOnClickActions();
					e.stopImmediatePropagation();
					if (e.preventDefault)
						e.preventDefault();
					return false;
				}
				else if (e.keyCode == 8 && !_editingCellEl)
				{
					var t = e.target;
					if (t && (t.tagName == "INPUT" || t.tagName == "TEXTAREA" || t.isContentEditable))
						return;
					if (navigateBack())
					{
						e.stopImmediatePropagation();
						if (e.preventDefault)
							e.preventDefault();
						return false;
					}
				}
			}
			//else no handler, so allow infrastructure DesktopContent/Debug action

		} //end bodyKeyHandler()

		//==============================================================================
		//copyAndPasteBlockRows
		function copyAndPasteBlockRows() {
			const selectedRows = document.querySelectorAll("#SubSystemTable tr.selected");
			Debug.log("Number of selected rows " + selectedRows.length);

			for (var i = 0; i < selectedRows.length; ++i)
			{
				let rowIndex = Number(selectedRows[i].cells[0].textContent.trim().match(/\d+/)[0]);
				tableCopyOrMoveRow(0, rowIndex, true);
				registerOnClickActions(); //re-register onclick actions after copy since table is redrawn
			}
		} //end copyAndPasteBlockRows()

		//==============================================================================
		//blockDeleteRows
		function deleteBlockRows() {
			const selectedRows = document.querySelectorAll("#SubSystemTable tr.selected");
			Debug.log("Number of selected rows " + selectedRows.length);

			for (var i = selectedRows.length - 1; i >= 0; i--) {
				let rowIndex = Number(selectedRows[i].cells[0].textContent.trim().match(/\d+/)[0]);
				try {
					const deleteBtn = selectedRows[i].cells[0].querySelectorAll(".tableDeleteRowButton")[0];
					if (!deleteBtn) return null;
					deleteBtn.onclick();
					Debug.log("Successfully deleted row" + rowIndex);
					registerOnClickActions(); //re-register onclick actions after deletion since table is redrawn
				}
				catch
				{
					Debug.log("Failed to delete table row " + rowIndex);
				}
			}
		} //end deleteBlockRows()

			Debug.log("key " + e.keyCode);
			//keyCode is deprecated, switching to key

			var shiftIsDown;
			// var key;
			if (window.event) {
				// key = window.event.keyCode;
				shiftIsDown = !!window.event.shiftKey; // typecast to boolean
			}
			else {
				// key = e.which;
				shiftIsDown = !!e.shiftKey;	// typecast to boolean
			}
			//Debug.log("shift=" + shiftIsDown);


			// Hotkey: press 'e' or 'p' to activate pencil (toggle free-form editing)
			// when a fixed-choice dropdown is active
			if ((e.key == 'e' || e.key == 'p') && !shiftIsDown)
			{
				var _fceIcon = document.getElementById("fixedChoice-editIcon");
				if(_fceIcon && _fceIcon.style.display == "block")
				{
					// Only activate if the select box is currently shown (not already in free-form mode)
					var _fceSel = document.getElementById("fixedChoice-editSelectBox");
					if(_fceSel && _fceSel.style.display != "none")
					{
						handleFixedChoiceEditToggle();
						if(e.preventDefault) e.preventDefault();
						if(e.stopPropagation) e.stopPropagation();
						return false;
					}
				}
			}

			//handle text area specially
			if (!shiftIsDown) {
				var tel;
				if (_editingCellEl &&
					(tel = _editingCellEl.getElementsByTagName("textarea")).length) {
					tel = tel[0];
					//handle special keys for text area
					if (e.key == "Tab") {
						Debug.log("tab.");
						if (e.preventDefault)
							e.preventDefault();

						var i = tel.selectionStart;
						var j = tel.selectionEnd;
						tel.value = tel.value.substr(0, i) +
							'\t' + tel.value.substr(j);
						tel.selectionStart = tel.selectionEnd = j + 1;
					}
					return false; //done if text area was identified
				}
			}

			//tab key jumps to next cell with a CANCEL
			//	(enter key does same except saves/OKs value)
			//	shift is reverse jump
			if (e.key == "Tab" || e.key == "Enter" ||
				e.key == "ArrowUp" || e.key == "ArrowDown") {
				if (e.preventDefault)
					e.preventDefault();
				if (e.stopPropagation)
					e.stopPropagation();

				editCellOK();
				if (e.key == "Enter") //dont move to new cell
					return false;

				//detect tree-view and handle jump forward (tab/enter) or backward (tab/enter+shift)
				var el = document.getElementById("treeView-ConfigGroupLink");
				if (el) {
					Debug.logv({ treeEditingNodeType_ });
					Debug.logv({ treeEditingNodeIdString_ });
					Debug.logv({ treeEditingTargetTable_ });
					Debug.logv({ treeEditingNodeDepth_ });
					Debug.logv({ treeEditingTargetUID_ });
					Debug.logv({ treeEditingTargetColumn_ });
					Debug.logv({ shiftIsDown });
					Debug.log("e.key", e.key);

					//if UP/DOWN, go to next matching field type (for value, strictly follow treeEditingTargetColumn_)
					//if TAB, go to next matching field of any type

					if (treeEditingNodeType_ == "table" || treeEditingNodeType_ == "link-comment" ||
						treeEditingNodeType_ == "node-comment" ||
						treeEditingNodeType_ == "uid" ||
						treeEditingNodeType_.indexOf("value") == 0) {
						//find all Links with a valid target table and open-for-edit next comment

						var els = document.getElementsByClassName("treeNode");
						var idString;
						var el;
						var lastFoundSubElIdString = undefined, lastFoundSubElType;
						var found = false, nextFound = false;
						var findAny = false;
						var tmpFound = false;
						var enforceColMatch = treeEditingNodeType_.indexOf("value") == 0 && //enforce match of treeEditingTargetColumn_
							(e.key == "ArrowDown" || e.key == "ArrowUp");
						for (var i = 0; i < els.length; ++i) {
							tmpFound = false;
							var subEls = [];
							var nodeType = "";
							idString = els[i].id.substr(("treeNode-").length);
							if (idString == treeEditingNodeIdString_) {
								tmpFound = true;
								Debug.log("Found", i);
							}

							if (els[i].style.display == "none") //skip hidden
							{
								if (tmpFound)
									Debug.log("Found", i);
								if (findAny && shiftIsDown) i -= 2; //go backwards to findAny
								continue;
							}

							if (subEls.length == 0 &&  //table node type
								(findAny || treeEditingNodeType_ == "table" || treeEditingNodeType_ == "link-comment")) {
								subEls = els[i].getElementsByClassName("treeNode-Value-nodeEditType-table");
								//only accept if matching idString (otherwise subEl is from child)
								if (subEls.length && idString != subEls[0].id.substr(("treeNode-Value-").length))
									subEls = []; //clear
								else
									nodeType = "table";
							}
							if (subEls.length == 0 && //link node type
								(findAny || treeEditingNodeType_ == "table" || treeEditingNodeType_ == "link-comment")) {
								subEls = els[i].getElementsByClassName("treeNode-Value-nodeEditType-link");
								//only accept if matching idString (otherwise subEl is from child)
								if (subEls.length && idString != subEls[0].id.substr(("treeNode-Value-").length))
									subEls = []; //clear
								else
									nodeType = "link-comment";
							}
							if (subEls.length == 0 && //uid node type
								(findAny || treeEditingNodeType_ == "node-comment" || treeEditingNodeType_ == "uid")) {
								subEls = els[i].getElementsByClassName("treeNode-Value-nodeEditType-uid");
								//only accept if matching idString (otherwise subEl is from child)
								if (subEls.length && idString != subEls[0].id.substr(("treeNode-Value-").length))
									subEls = []; //clear
								else
									nodeType = treeEditingNodeType_.indexOf("comment") >= 0 ||
										treeEditingNodeType_ == "table" ? //if coming from a comment, stay a comment
										"node-comment" : "uid";
							}
							if (subEls.length == 0 && //value node type
								(findAny || treeEditingNodeType_.indexOf("value") == 0)) {
								subEls = els[i].getElementsByClassName("treeNode-Value-leafNode-fieldValue");
								//only accept if matching idString (otherwise subEl is from child)
								if (subEls.length && idString != subEls[0].id.substr(("treeNode-Value-leafNode-").length))
									subEls = []; //clear
								else
									nodeType = "value";
							}

							//look for only the table links to first find the target element
							if (subEls.length == 0) {
								if (tmpFound)
									Debug.log("Found", i);
								if (findAny && shiftIsDown) i -= 2; //go backwards to findAny
								continue;
							}

							if (nodeType == "table" || nodeType == "link-comment") //skip invalid tables
							{
								var table = "";
								if (subEls[0].className == "treeNode-Value-nodeEditType-link")
									table = document.getElementById("treeNode-linkTableName-" + idString).textContent;
								else
									table = subEls[0].textContent;

								if (table == "" || table == "NO_LINK") //skip invalid tables
								{
									if (tmpFound) Debug.log("Found", i);
									if (findAny && shiftIsDown) i -= 2; //go backwards to findAny
									continue;
								}
							}

							if (enforceColMatch) //skip mismatched treeEditingTargetColumn_
							{
								if (nodeType.indexOf("value") != 0) {
									Debug.err("Should be impossible! Notify admins as to how you got here.");
									return;
								}
								var elColName = document.getElementById("treeNode-Value-" + idString).childNodes[0].textContent;
								Debug.log(elColName, "vs", treeEditingTargetColumn_);
								if (elColName != treeEditingTargetColumn_)	//skip mismatched columns
								{
									if (tmpFound) Debug.log("Found", i);
									if (findAny && shiftIsDown) i -= 2; //go backwards to findAny
									continue;
								}
							}

							if (findAny) //take this one
							{
								Debug.log("Moving to editing the next/prev treeNode '" + idString + "'", nodeType);
								handleTreeNodeClick(
									idString.split('-')[0],
									idString.split('-')[1],
									1 /* editClick */,
									nodeType
								);
								Debug.logv({ treeEditingNodeType_ });
								break;
							}


							if (found && e.key == "ArrowDown") {
								nextFound = true;
								Debug.log("Found next matching field DOWN at id '" + idString + "'", nodeType);
								handleTreeNodeClick(
									idString.split('-')[0],
									idString.split('-')[1],
									1 /* editClick */,
									nodeType
								);
								break;
							}
							else if (!found && idString == treeEditingNodeIdString_) //found current, so select prev/next
							{
								found = true;

								//found, take action
								if (e.key == "ArrowUp") {
									//go to next matching field type above (at lastFoundSubEl)
									if (lastFoundSubElIdString) {
										nextFound = true;

										Debug.log("Found prev matching field UP at id '" +
											lastFoundSubElIdString + "'", lastFoundSubElType);
										handleTreeNodeClick(
											lastFoundSubElIdString.split('-')[0],
											lastFoundSubElIdString.split('-')[1],
											1 /* editClick */,
											lastFoundSubElType
										);
									}

									break;
								} //end UP arrow
								else if (e.key == "Tab") //use prev any
								{
									if (shiftIsDown)
										--i;
									else
										++i;

									if (i < 0 || i >= els.length) break;
									//else have target treeNode at els[i], now decide which kind of editing type

									Debug.log("Going for els[" + i + "]");
									findAny = true; --i; continue; //take next
								} //end next/prev treeNode
							}
							else {
								lastFoundSubElIdString = idString;
								lastFoundSubElType = nodeType;
							}
						} //end loop through elements

						if (!found)
							Debug.log("Did not find starting target element id '" + treeEditingNodeIdString_ + "'");

						if (!nextFound && (e.key == "ArrowDown" || e.key == "ArrowUp"))
							Debug.warn("There were no more tree value nodes found with field name '" + treeEditingTargetColumn_ + ".'" +
								"<br><br><b>Note:</b> When editing a tree value node, the <b>UP/DOWN</b> arrows navigate to the next tree value node with the same field name (i.e. '" +
								treeEditingTargetColumn_ + "'). When editing non-value node types, the <b>UP/DOWN</b> arrows navigate to the next tree node of that type. " +
								"When not editing a tree node, the UP/DOWN arrow recalls the last node that was edited and selects it for editing." +
								"<br><br>" +
								"And when editing any tree node type, the <b>TAB</b> key navigates to editing the next neighbor tree node, ignoring the neighbor's type; <b>SHIFT+TAB</b> navigates in reverse to the previous neighbor.");
					} //end treeEditingNodeType_ == "table" || treeEditingNodeType_ == "link-comment"
					else
						Debug.log("Unrecognized tree-view jump type '" + treeEditingNodeType_ + "'");

					return;
				} //end tree-view jump forward (tab/enter) or backward (tab/enter+shift)

				//jump forward (tab/enter) or backward (tab/enter+shift)
				//	or up or down.
				//get number of rows and cols
				//	to determine next row and col to jump to


				var newRow = _editingCellPos[0];
				var newCol = _editingCellPos[1];
				var el = document.getElementById("SubSystemTable");
				var rows = el.getElementsByTagName("tr");

				var numOfRows;
				var numOfCols;

				if (_tableViewIsTransposed) {
					numOfCols = rows.length - _CONFIG_DATA_COL_OFFSET;
					numOfRows = rows[0].getElementsByTagName("td").length + 1 -
						_CONFIG_DATA_ROW_OFFSET; //assume one TH cell
				}
				else {
					numOfRows = rows.length - _CONFIG_DATA_ROW_OFFSET;
					numOfCols = rows[_CONFIG_DATA_ROW_OFFSET - 1].getElementsByTagName("th").length -
						_CONFIG_DATA_COL_OFFSET;
				}

				do {
					if (!_tableViewIsTransposed) {
						if (e.key == "Tab")
							newCol += (shiftIsDown ? -1 : 1);
						else if (e.key == "ArrowUp")
							--newRow;
						else if (e.key == "ArrowDown")
							++newRow;
					}
					else {
						if (e.key == "Tab")
							newRow += (shiftIsDown ? -1 : 1);
						else if (e.key == "ArrowUp")
							--newCol;
						else if (e.key == "ArrowDown")
							++newCol;
					}

					//new position is chosen! now make it happen (in a clean way)

					if (newCol == numOfCols) { ++newRow; newCol = 0; }
					if (newRow == numOfRows) newRow = 0;
					if (newCol < 0) { --newRow; newCol = numOfCols - 1; }
					if (newRow < 0) newRow = numOfRows - 1;

					if (_tableViewIsTransposed)
						el = rows[_CONFIG_DATA_COL_OFFSET + newCol].getElementsByTagName("td")[_CONFIG_DATA_ROW_OFFSET - 1 + newRow];
					else
						el = rows[_CONFIG_DATA_ROW_OFFSET + newRow].getElementsByTagName("td")[_CONFIG_DATA_COL_OFFSET + newCol];

				} while (!selectThisCell(newRow, newCol, el));

				Debug.log("newRow=" + newRow + " newCol=" + newCol);

				return false;
			}
			else if (e.key == "Escape") {
				Debug.log(e.key);
				if (e.preventDefault)
					e.preventDefault();
				editCellCancel();
				return false;
			}
			else if (e.key == "0" || // numbers 0-9
				((e.key | 0) >= 1 && (e.key | 0) <= 9)) {
				//if child link cell or boolean cell
				var sel;
				if ((sel = _editingCellEl.getElementsByTagName("select")).length) {
					if (keyEl) //if input element, use it
						sel = keyEl;
					else
						sel = sel[sel.length - 1]; //assume the last select in the cell is the select

					//select based on number
					var selNum = (e.key | 0);

					sel.selectedIndex = selNum % (sel.options.length);
					sel.focus();

					Debug.log("number select =" + sel.selectedIndex);
					if (sel.onchange) //if onchange implemented call it
						sel.onchange();
				}
			}
		} //end keyHandler()

		//popUpGroupViewAliasForm ~~
		function popUpGroupViewAliasForm(groupName, groupKey) {
			Debug.log("CfgGUI popUpGroupViewAliasForm");

			var str = "";

			var el = document.getElementById("popUpDialog");
			if (!el) {
				el = document.createElement("div");
				el.setAttribute("id", "popUpDialog");
			}
			el.style.display = "none";

			//set position and size
			var w = 380;
			var h = 215;
			ConfigurationAPI.setPopUpPosition(el, w /*w*/, h /*h*/);


			//show choices of group aliases or alternatively textbox
			//	default to the system alias that is closest to groupName/groupKey


			//get existing group aliases
			///////////////////////////////////////////////////////////
			DesktopContent.XMLHttpRequest("Request?RequestType=getGroupAliases" +
				"",
				"",
				function (req) {
					var err = DesktopContent.getXMLValue(req, "Error");
					if (err) {
						Debug.err(err);
						el.innerHTML = str;
						return;
					}

					var aliases = req.responseXML.getElementsByTagName("GroupAlias");
					var aliasGroupNames = req.responseXML.getElementsByTagName("GroupName");
					var aliasGroupKeys = req.responseXML.getElementsByTagName("GroupKey");

					//Show dropdown for alias
					//	and a pencil to change dropdown to text box to free-form alias.
					//Also, identify if already aliased and choose that as default option
					//	in dropwdown.
					var alias, aliasGroupName, aliasGroupKey;
					var i = 0; //re-using code that had multiple groups, this requires just one group
					var groupOptionIndex = []; //keep ABSOLUTE distance and index of option for each group, or -1 if none

					groupOptionIndex.push([-1, 0]); //index and distance

					//find alias
					var modTblStr = "";
					for (var j = 0; j < aliasGroupNames.length; ++j) {
						alias = DesktopContent.getXMLValue(aliases[j]);
						aliasGroupName = DesktopContent.getXMLValue(aliasGroupNames[j]);
						aliasGroupKey = DesktopContent.getXMLValue(aliasGroupKeys[j]);

						//Debug.log("compare " + aliasGroupName + ":" +
						//		aliasGroupKey);

						//also build drop down
						modTblStr += "<option value='" + alias + "' ";

						//consider any alias with same groupName
						if (aliasGroupName == groupName) {
							if (groupOptionIndex[i][0] == -1 ||	//take best match
								Math.abs(groupKey - aliasGroupKey) < groupOptionIndex[i][1]) {
								Debug.log("found alias");
								groupOptionIndex[i][0] = j; //index
								groupOptionIndex[i][1] = Math.abs(groupKey - aliasGroupKey); //ABSOLUTE distance
							}
						}
						modTblStr += ">";
						modTblStr += alias;	//can display however
						modTblStr += "</option>";
					}

					var str = "<a id='" +
						"popUpDialog" +
						"-header' onclick='var el = document.getElementById(" +
						"\"popUpDialog\"); if(el) el.parentNode.removeChild(el); return false;'>Cancel</a><br><br>";

					str += "<div id='popUpDialog-div'>";

					str += "Please choose a System Alias below and then click 'Create System Alias' " +
						"to setup a System Alias referring to the current group  '" +
						groupName + " (" + groupKey + ").'<br><br>";

					str += "<center>";
					str += "Set '<b style='font-size:16px'>" + groupName + " (" +
						groupKey + ")</b>' to System Alias:";
					str += "</a><br>";
					str += "<table cellpadding='0' cellspacing='0' border='0'><tr><td>";
					str += "<select " +
						"id='popUpDialog-editAliasSelect-" + (i) + "' " +
						"style='margin:2px; height:" + (25) + "px'>";
					str += modTblStr;
					str += "</select>";

					str += "<input type='text' " +
						"id='popUpDialog-editAliasTextBox-" + (i) + "' " +
						"style='display:none; margin:2px; width:150px; height:" +
						(19) + "px'>";
					str += "";
					str += "</input>";
					str += "</td><td>";

					str += "<div style='display:block' " +
						"class='treeNode-Value-editIcon' id='popUpDialog-editIcon-" +
						(i) + "' " +
						"onclick='handleEditTreeAliasEditToggle(" +
						i +
						");' " +
						"title='Toggle free-form system alias editing' " +
						"></div>";

					str += "</td></tr></table>";


					// done with system alias handling
					// continue with pop-up prompt

					str += "</center></div><br>"; //close main popup div

					var onmouseupJS = "";
					onmouseupJS += "document.getElementById(\"popUpDialog-submitButton\").disabled = true;";
					onmouseupJS += "popUpGroupViewAliasFormSubmit(\"" + groupName +
						"\",\"" + groupKey + "\");";

					str += "<input id='popUpDialog-submitButton' type='button' onmouseup='" +
						onmouseupJS + "' " +
						"value='Alias' title='" +
						"Set the System Alias to the current Group name and key" +
						"'/>";
					el.innerHTML = str;

					//handle default dropdown selections for group alias
					if (groupOptionIndex[i][0] != -1) //have a default
						document.getElementById("popUpDialog-editAliasSelect-" +
							i).selectedIndex = groupOptionIndex[i][0];

				}, 0, 0, true //reqParam, progressHandler, callHandlerOnErr
			); //end of getGroupAliases handler

			document.getElementById("display").appendChild(el); //add element to display div
			el.style.display = "block";
		} //end popUpGroupViewAliasForm

		//==============================================================================
		//popUpGroupViewAliasFormSubmit ~~
		function popUpGroupViewAliasFormSubmit(groupName, groupKey) {
			//get group alias
			var groupAlias;
			{
				var setAliasCheckboxIndex = 0;
				var el = document.getElementById("popUpDialog-editAliasSelect-" +
					setAliasCheckboxIndex);
				if (el.style.display == "none") {
					//get value from text box
					el = document.getElementById("popUpDialog-editAliasTextBox-" +
						setAliasCheckboxIndex);
				}
				groupAlias = el.value;
			}
			Debug.log("Group view alias setting to " + groupAlias);
			ConfigurationAPI.setGroupAliasInActiveBackbone(groupAlias, groupName, groupKey, 0,
				function (retParams) //done handler
				{
					if (retParams) {
						if (retParams.newBackbone)
							Debug.log("Successfully modified the active Backbone group " +
								" to set the System Alias '" + groupAlias + "' to " +
								" refer to the current group '" + groupName +
								" (" + groupKey + ").'" +
								"\n\n" +
								"Backbone group '" + retParams.groupName + " (" +
								retParams.groupKey + ")' was created and activated.",
								Debug.INFO_PRIORITY);
						else
							Debug.log("Success, but no need to create a new Backbone group. " +
								"An existing Backbone group " +
								" already has the System Alias '" + groupAlias + "' " +
								" referring to the current group '" + groupName +
								" (" + groupKey + ").'" +
								"\n\n" +
								"Backbone group '" + retParams.groupName + " (" +
								retParams.groupKey + ")' was activated.",
								Debug.INFO_PRIORITY);

						//kill popup dialog
						var el = document.getElementById("popUpDialog");
						if (el) el.parentNode.removeChild(el);
					}
					else {
						//else error, leave popup there and re-enable button
						document.getElementById("popUpDialog-submitButton").disabled = false;
					}


				}, true); //request return parameters
		} //end popUpGroupViewAliasFormSubmit()

		//==============================================================================
		//popUpSaveTreeForm ~~
		function popUpSaveTreeForm() {
			Debug.log("CfgGUI popUpSaveTreeForm");

			var str = "";

			var el = document.getElementById("popUpDialog");
			if (!el) {
				el = document.createElement("div");
				el.setAttribute("id", "popUpDialog");
			}
			el.style.display = "none";

			//set position and size
			var gh = 50;
			var w = 480;
			var h = 330;
			ConfigurationAPI.setPopUpPosition(el, w /*w*/, h - gh * 2 /*h*/,
				undefined /*padding*/, undefined /*border*/, undefined /*margin*/, undefined /*doNotResize*/,
				gh * 2 /*offsetUp*/);

			//always
			//	- save modified tables (show list of modified tables)
			//		(and which active group they are in)
			//
			//optionally
			//	- checkbox to bump version of modified active groups
			//	- checkbox to assign system alias to bumped active group

			//if there are new tables added they should be in as "mockup" version -1

			var modTblCount = 0;
			var modTblStr = "";
			var modifiedTables = ""; //csv table, temporary version,...
			for (var j = 0; j < treeMemberNames_.length; ++j)
				if ((treeMemberVersions_[j] | 0) < 0) //allow new tables' mockup version to be added
				{
					if (modTblCount++)
						modTblStr += ",";
					modTblStr += treeMemberNames_[j];

					if (modifiedTables.length)
						modifiedTables += ",";
					modifiedTables += treeMemberNames_[j];
					modifiedTables += ",";
					modifiedTables += treeMemberVersions_[j];

				}

			if (modTblCount == 0) {
				Debug.warn("No modified tables found. Nothing to save.");
				return;
			}

			var str = "<a id='" +
				"popUpDialog" +
				"-header' onclick='var el = document.getElementById(" +
				"\"popUpDialog\"); if(el) el.parentNode.removeChild(el); return false;'>Cancel</a><br><br>";

			str += "<div id='popUpDialog-div'>";
			str += "Saving the tree will create new persistent versions of each modified table." +
				"<br><br>" +
				"Here is the list of modified tables (count=" + modTblCount +
				"):" +
				"<br>";


			//display modified tables
			str += "<div style='white-space:nowrap; width:" + w + "px; height:40px; " +
				"overflow:auto; font-weight: bold;'>";
			str += modTblStr;
			str += "</div>";

		//==============================================================================
		//handlePopUpSetGroupAlias ~~
		function handlePopUpSetGroupAlias(affectedGroupNames, affectedGroupKeys) {
			Debug.log("CfgGUI handlePopUpSetGroupAlias", affectedGroupNames, affectedGroupKeys);

			//check each alias checkbox
			//	for each alias that is checked
			//		set alias for new group
			//if any aliases modified, save and activate backbone

			//get checkboxes
			var setAliasCheckboxes =
				document.getElementsByClassName("popUpDialog-setGroupAlias");

			var groupAlias = "", groupName = "", groupKey = "";
			var setAliasCheckboxIndex = 0;

			//in order to set alias, we need:
			//	groupAlias
			//	groupName
			//	groupKey

			//for each set alias checkbox that is checked
			//	modify the active group alias table one after the other

			//get next affected group index
			while (setAliasCheckboxIndex < setAliasCheckboxes.length) {
				if (!setAliasCheckboxes[setAliasCheckboxIndex].checked) {
					Debug.log("Skipping checkbox " + (++setAliasCheckboxIndex));
					continue;
				}

				//get next alias
				{
					var el = document.getElementById("popUpDialog-editAliasSelect-" +
						setAliasCheckboxIndex);
					if (el.style.display == "none") {
						//get value from text box
						el = document.getElementById("popUpDialog-editAliasTextBox-" +
							setAliasCheckboxIndex);
					}

					if (!el.value || el.value.trim() == "") {
						Debug.err("Process interrupted. Invalid empty alias given!");

						//kill popup dialog
						var el = document.getElementById("popUpDialog");
						if (el) el.parentNode.removeChild(el);
						return;
					}
					groupAlias += (groupAlias.length ? "," : "") + el.value;
					hasAnAliasChange = true;
				} //end get next alias

				groupName += (groupName.length ? "," : "") + affectedGroupNames[setAliasCheckboxIndex];
				groupKey += (groupKey.length ? "," : "") + affectedGroupKeys[setAliasCheckboxIndex];

				Debug.log("groupAlias = " + groupAlias);
				Debug.log("groupName = " + groupName);
				Debug.log("groupKey = " + groupKey);

				++setAliasCheckboxIndex;
			} //end alias CSV retrieval loop

			if (groupAlias.length) {
				ConfigurationAPI.setGroupAliasInActiveBackbone(groupAlias, groupName, groupKey,
					0,
					function (retParams) {
						if (retParams) {
							if (!retParams.foundEquivalentKey)
								Debug.log("Successfully modified the active <b>Backbone</b> group " +
									" to set the System Alias <b>'" + groupAlias + "'</b> to " +
									" refer to the current group <b>'" + groupName +
									" (" + groupKey + ").'</b>" +
									"\n\n" +
									"Backbone group '" + retParams.groupName + " (" +
									retParams.groupKey + ")' was created and activated.",
									Debug.INFO_PRIORITY);
							else
								Debug.log("Success, but no need to create a new Backbone group. " +
									"An existing <b>Backbone</b> group " +
									" already has the System Alias <b>'" + groupAlias + "'</b> " +
									" referring to the current group <b>'" + groupName +
									" (" + groupKey + ").'</b>" +
									"\n\n" +
									"<b>Backbone</b> group <b>'" + retParams.groupName + " (" +
									retParams.groupKey + ")'</b> was activated.",
									Debug.INFO_PRIORITY);
						}
						else {
							Debug.err("Process interrupted. Failed to modify the currently active Backbone!");

							//kill popup dialog
							var el = document.getElementById("popUpDialog");
							if (el) el.parentNode.removeChild(el);
							return;
						}

						Debug.log("Saving and activating Backbone done.");

						//kill popup dialog
						var el = document.getElementById("popUpDialog");
						if (el) el.parentNode.removeChild(el);

						Debug.log("Saving operations complete.", Debug.INFO_PRIORITY);
						treeHasChanged(true); // reset
						return;

					}, //end setGroupAliasInActiveBackbone return handler
					true); //request return parameters
				Debug.log("Aliases set in motion"); //so done with this thread
			}
			else {
				Debug.log("No System Aliases were changed, so Backbone was not modified. Done.");

				//kill popup dialog
				var el = document.getElementById("popUpDialog");
				if (el) el.parentNode.removeChild(el);

				Debug.info("<b>Saving</b> operations complete.");
				treeHasChanged(true); // reset
				return;
			}
		} //end handlePopUpSetGroupAlias()

		//==============================================================================
		//saveModifiedTree ~~
		//	ignoreWarnings = true will ignore warnings when saving groups
		function saveModifiedTree(ignoreWarnings) {
			Debug.log("saveModifiedTree " + (ignoreWarnings ? 1 : 0));

			//for each modified table
			//	save new version
			//	update tree member table version based on result
			//if saving groups
			//	figure out group type and save/activate in this order:
			//		config, context, backbone
			//		for each affected group
			//			save member list but with tree table versions
			//			modify root group name if changed
			//if saving aliases
			//	for each alias
			//		set alias for new group

			//Note: all information comes from popup dialog
			//	any return must also kill the popup

			var numberOfRequests = 0;
			var numberOfReturns = 0;
			var allRequestsSent = false;
			var treeMemberVersionIsNew = []; //maintain tables with a new persistent version (so group save can be faster)

			//go through each tree member
			//	if modified table
			//		save new version
			//		update tree member table version based on result
			for (var j = 0; j < treeMemberNames_.length; ++j)
				if ((treeMemberVersions_[j] | 0) < 0) //for each modified and mockup table
				{
					var reqStr = "Request?RequestType=saveSpecificTable" +
						"&dataOffset=0&chunkSize=0" +
						"&tableName=" + treeMemberNames_[j] +
						"&version=" + treeMemberVersions_[j] +
						"&temporary=0" +
						"&tableComment=" + treeMemberComments_[j] +
						"&sourceTableAsIs=1";
					Debug.log(reqStr);

					++numberOfRequests;

					//	save new version
					///////////////////////////////////////////////////////////
					DesktopContent.XMLHttpRequest(reqStr, "",
						function (req, treeMemberIndex) {
							var err = DesktopContent.getXMLValue(req, "Error");
							if (err) {
								Debug.err(err);

								//kill popup dialog
								var el = document.getElementById("popUpDialog");
								if (el) el.parentNode.removeChild(el);
								return;
							}

							var tableName = DesktopContent.getXMLValue(req, "savedName");
							var savedVersion = DesktopContent.getXMLValue(req, "savedVersion");
							var foundEquivalentVersion = DesktopContent.getXMLValue(req, "foundEquivalentVersion") | 0; //as int

							var scratchNotice = (ConfigurationAPI._SCRATCH_VERSION == (savedVersion | 0)) ? _SCRATCH_VIEW_NAME : savedVersion;

							if (foundEquivalentVersion)
								Debug.log("Found equivalent version '" + scratchNotice +
									"' for table '" +
									tableName + ".' ", Debug.INFO_PRIORITY);
							else
								Debug.log("New persistent version '" + scratchNotice +
									"' for table '" +
									tableName + "' was successfully created.", Debug.INFO_PRIORITY);

							//update tree member table version based on result
							treeMemberVersions_[treeMemberIndex] = savedVersion;
							treeMemberVersionIsNew[treeMemberIndex] = foundEquivalentVersion ? 0 : 1;

							++numberOfReturns;

							//check if done saving tables
							if (allRequestsSent &&
								numberOfReturns == numberOfRequests) {
								localHandleAffectedGroups();
							}
						}, j, 0, true  //reqParam, progressHandler, callHandlerOnErr
					);	//end save new table request
				}	//end modified table for loop

			allRequestsSent = true; //indicate last request was sent

			if (numberOfRequests == 0) //no requests were sent, so go on to affected groups
				localHandleAffectedGroups();

			//=========================================
			//localHandleAffectedGroups ~~ /////////////////////////////
			function localHandleAffectedGroups() {
				Debug.log("Done with table saving.");

				//check if saving groups
				var savingGroups =
					document.getElementById("popUpDialog-bumpGroupVersions").checked;
				var activatingSavedGroups =
					document.getElementById("popUpDialog-activateBumpedGroupVersions").checked;

				if (!savingGroups) //then no need to proceed. exit!
				{
					//kill popup dialog
					var el = document.getElementById("popUpDialog");
					if (el) el.parentNode.removeChild(el);
					return;
				}

				//identify root group name/key
				var rootGroupEl = document.getElementById("treeView-ConfigGroupLink");
				var rootGroupName = rootGroupEl.childNodes[0].textContent;
				var rootGroupKey = rootGroupEl.childNodes[1].textContent;

				Debug.log("rootGroup = " + rootGroupName + "(" + rootGroupKey + ")");
				Debug.log("On to saving groups");

				numberOfRequests = 0;		//re-use
				numberOfReturns = 0;		//re-use
				allRequestsSent = false; 	//re-use

				var affectedGroupNames = []; //to be populated for use by alias setting
				var affectedGroupKeys = []; //to be populated for use by alias setting
				var affectedGroupIsNew = []; //to be populated for use by alias setting (for faster saving!)
				var affectedGroupEls =
					document.getElementsByClassName("popUpDialog-affectedGroups");
				var affectedGroupCommentEls =
					document.getElementsByClassName("popUpDialog-groupComment-cache");

				var affectedGroupMemberMaps = []; //to be populated by initial group type loop, and used by save/activate loop

				//organize by group type
				var affectedConfigGroups = [];
				var affectedContextGroups = [];
				var affectedBackboneGroups = [];
				var affectedIterateGroups = [];

				// first organize and order by group type: config, context, backbone
				for (var i = 0; i < affectedGroupEls.length; ++i) {
					//save member list but with tree table versions
					Debug.log(affectedGroupEls[i].textContent);
					Debug.log("group comment: " + affectedGroupCommentEls[i].textContent);

					var affectedArr = affectedGroupEls[i].textContent.split(',');
					var groupIsNew = false;
					//build member config map
					var tableMap = "tableList=";
					//member map starts after group name/key (i.e. [2])
					for (var a = 2; a < affectedArr.length; a += 2)
						if ((affectedArr[a + 1] | 0) < -1) //there should be a new modified version
						{
							Debug.log("affectedArr " + affectedArr[a] + "-v" + affectedArr[a + 1]);
							//find version
							for (var k = 0; k < treeMemberNames_.length; ++k)
								if (affectedArr[a] == treeMemberNames_[k]) {
									Debug.log("found " + treeMemberNames_[k] + "-v" + treeMemberVersions_[k]);
									tableMap += affectedArr[a] + "," +
										treeMemberVersions_[k] + ",";

									if (treeMemberVersionIsNew[k]) {
										Debug.log("Found a new persistent table version in group, so group must be new!");
										groupIsNew = true;
									}
									break;
								}
						}
						else //use existing version
							tableMap += affectedArr[a] + "," + affectedArr[a + 1] + ",";

					affectedGroupNames.push(affectedArr[0]);
					affectedGroupMemberMaps.push(tableMap);
					affectedGroupIsNew.push(groupIsNew ? 1 : 0);

					reqStr = ""; //reuse
					reqStr = "Request?RequestType=getTableGroupType";

					Debug.log(reqStr);
					Debug.log(tableMap);

					++numberOfRequests;
					///////////////////////////////////////////////////////////
					DesktopContent.XMLHttpRequest(reqStr, tableMap,
						function (req, groupIndex) {
							var err = DesktopContent.getXMLValue(req, "Error");
							if (err) {
								Debug.err(err);

								//kill popup dialog
								var el = document.getElementById("popUpDialog");
								if (el) el.parentNode.removeChild(el);
								return;
							}

							++numberOfReturns;

							var groupType = DesktopContent.getXMLValue(req, "TableGroupType");
							Debug.log("groupType = " + groupType);

							if (groupType == "Configuration")
								affectedConfigGroups.push(groupIndex);
							else if (groupType == "Context")
								affectedContextGroups.push(groupIndex);
							else if (groupType == "Backbone")
								affectedBackboneGroups.push(groupIndex);
							else if (groupType == "Iterate")
								affectedIterateGroups.push(groupIndex);
							else {
								Debug.log("Invalid Group Type determined '" + groupType +
									".' This should not be possible - notify developers.",
									Debug.HIGH_PRIORITY);

								//kill popup dialog
								var el = document.getElementById("popUpDialog");
								if (el) el.parentNode.removeChild(el);
								return;
							}

							//check if done organizing groups
							if (allRequestsSent &&
								numberOfRequests == numberOfReturns) {
								localSaveAndActivateGroups();
							}

						}, //end req handler
						i, 0, true); //reqIndex, progressHandler, callHandlerOnErr
				}

				allRequestsSent = true; //indicate last request was sent

				//=========================================
				//localSaveAndActivateGroups ~~ /////////////////////////////
				function localSaveAndActivateGroups() {
					Debug.log("Done organizing groups by type.");

					//at this point we have all of the member maps
					//	and groups organized by type
					//
					// 	input arrays:
					//		var affectedGroupMemberMaps
					//		//organize by group type
					//		var affectedConfigGroups = [];
					//		var affectedContextGroups = [];
					//		var affectedBackboneGroups = [];
					//		var affectedIterateGroups = [];

					numberOfRequests = 0;		//re-use
					numberOfReturns = 0;		//re-use
					allRequestsSent = false; 	//re-use

					// in order of config, context, backbone
					//	for each affected group
					//		save and activate group..
					//		do not allow next save/activate until previous is done

					localSaveAndActivateGroup(0); //launch first save and activate

					//=========================================
					//localSaveAndActivateGroups ~~ /////////////////////////////
					//	orderedGroupListIndex is sequential index spanning
					//		these arrays:
					//		var affectedConfigGroups = [];
					//		var affectedContextGroups = [];
					//		var affectedBackboneGroups = [];
					//		var affectedIterateGroups = [];
					function localSaveAndActivateGroup(orderedGroupListIndex) {
						//complete save and activate for group specified by
						//	orderedGroupListIndex
						//	then launch next

						//find group index into affected group elements
						var offsetIndex = 0;
						var i = -1;

						if (orderedGroupListIndex - offsetIndex <
							affectedConfigGroups.length)
							i = affectedConfigGroups[orderedGroupListIndex - offsetIndex];

						if (i == -1) {
							offsetIndex += affectedConfigGroups.length;

							if (orderedGroupListIndex - offsetIndex <
								affectedContextGroups.length)
								i = affectedContextGroups[orderedGroupListIndex - offsetIndex]
						}

						if (i == -1) {
							offsetIndex += affectedContextGroups.length;

							if (orderedGroupListIndex - offsetIndex <
								affectedBackboneGroups.length)
								i = affectedBackboneGroups[orderedGroupListIndex - offsetIndex]

		// Remove all reorder drop indicator classes
		function _clearReorderDropIndicators() {
			getRows().forEach(r => {
				r.classList.remove('row-drop-above');
				r.classList.remove('row-drop-below');
			});
		}

		// document mousemove handler active only while a reorder drag is in progress.
		// Continuously scans the data rows to find which row the cursor is over and
		// places the drop indicator on the closest row boundary.
		function _reorderDragMouseMove(e, ignoreButtonState) {
			if (!isReorderDragging_) return;
			if (!ignoreButtonState && e.buttons !== 1) {
				// Mouse button was released outside the window – cancel drag and clean up
				_clearReorderDropIndicators();
				isReorderDragging_ = false;
				reorderDropIndex_ = -1;
				document.body.classList.remove('row-reorder-drag');
				document.body.classList.remove('no-select');
				document.removeEventListener('mousemove', _reorderDragMouseMove);
				return;
			}

			const rows = getRows();
			_clearReorderDropIndicators();

			// Walk every data row and find the one the cursor is in (or closest boundary)
			let bestRow = null;
			let bestIdx = -1;
			let insertAfter = false; // true → insert AFTER bestRow, false → insert BEFORE

			for (let i = _CONFIG_DATA_ROW_OFFSET; i < rows.length; i++) {
				const rect = rows[i].getBoundingClientRect();
				if (e.clientY < rect.bottom) {
					bestRow = rows[i];
					bestIdx = i;
					// If cursor is in the lower half of this row, drop after it
					insertAfter = (e.clientY > rect.top + rect.height / 2);
					break;
				}
				// cursor is below this row – keep going; if we exhaust all rows, append
				bestRow = rows[i];
				bestIdx = i;
				insertAfter = true;
			}

			if (bestRow === null) return; // no data rows at all

			if (insertAfter) {
				const nextIdx = bestIdx + 1;
				if (nextIdx < rows.length) {
					reorderDropIndex_ = nextIdx;
					rows[nextIdx].classList.add('row-drop-above');
				} else {
					reorderDropIndex_ = rows.length; // sentinel: append to end
					bestRow.classList.add('row-drop-below');
				}
			} else {
				reorderDropIndex_ = bestIdx;
				bestRow.classList.add('row-drop-above');
			}
		} //end _reorderDragMouseMove()

		// Move all currently selected rows to just before allRows[targetIndex].
		// If targetIndex >= allRows.length the rows are appended to the end.
		function moveSelectedRowsToIndex(targetIndex) {
			const tbody = document.getElementById("SubSystemTable");
			if (!tbody) return;

			const allRows = Array.from(tbody.querySelectorAll('tr'));
			const selectedRows = allRows.filter(r => r.classList.contains('selected'));
			if (!selectedRows.length) return;
			const defaultParent = selectedRows[0].parentNode;

			// Track selected indices and capture the reference row BEFORE removing anything (it may not be selected)
			const selectedIndices = new Set(selectedRows.map(r => allRows.indexOf(r)));
			const refRow = (targetIndex < allRows.length) ? allRows[targetIndex] : null;
			// If the drop target is inside the selection, abort
			if (refRow && selectedIndices.has(allRows.indexOf(refRow))) {
				Debug.log("moveSelectedRowsToIndex: drop target is within selection, ignoring");
				return;
			}

			Debug.log("moveSelectedRowsToIndex: moving", selectedRows.length, "rows to index", targetIndex);

			// Detach selected rows from the table
			selectedRows.forEach(r => {
				if (r && r.parentNode)
					r.parentNode.removeChild(r);
			});

			// Re-find the reference row (its index shifted if rows above it were removed)
			if (refRow && refRow.parentNode) {
				selectedRows.forEach(r => refRow.parentNode.insertBefore(r, refRow));
			} else if (defaultParent) {
				// append to the original row container
				selectedRows.forEach(r => defaultParent.appendChild(r));
			} else {
				selectedRows.forEach(r => tbody.appendChild(r));
			}

			// Mark the table as modified
			versionHasChanged();
			_renumberVisibleTableRows();
			// Re-register click/drag listeners for any newly positioned rows
			registerOnClickActions();
			Debug.log("moveSelectedRowsToIndex: done");
		} //end moveSelectedRowsToIndex()

		// Rebuild the first-column row number and +/- controls after manual DOM reordering.
		function _renumberVisibleTableRows() {
			const rows = getRows();
			for (let r = _CONFIG_DATA_ROW_OFFSET; r < rows.length; ++r) {
				const row = rows[r];
				if (!row || !row.cells || !row.cells.length) continue;

				const firstCell = row.cells[0];
				if (!firstCell) continue;

				const ro = r - _CONFIG_DATA_ROW_OFFSET;
				firstCell.innerHTML = "";
				const center = document.createElement("center");
				center.title = "Use Ctrl + click/drag to select a block of rows; then Ctrl + V to paste rows, and Ctrl + D/delete/backspace to delete rows.";

				center.appendChild(document.createTextNode((_dataOffset + ro) + ""));
				center.appendChild(document.createElement("br"));

				const addBtn = document.createElement("a");
				addBtn.className = "tableAddRowButton";
				addBtn.title = "Add a row before this row. Use Ctrl + click/drag to select a block of rows; then Ctrl + V to paste rows.";
				addBtn.href = "#";
				addBtn.onclick = function () { addRow(ro); return false; };
				addBtn.textContent = "+";
				center.appendChild(addBtn);

				center.appendChild(document.createTextNode("/"));

				const delBtn = document.createElement("a");
				delBtn.className = "tableDeleteRowButton";
				delBtn.title = "Delete this row. Use Ctrl + click/drag to select a block of rows; then Ctrl + D/delete/backspace to delete rows.";
				delBtn.href = "#";
				delBtn.onclick = function () { deleteRow(ro); registerOnClickActions(); return false; };
				delBtn.textContent = "-";
				center.appendChild(delBtn);

				firstCell.appendChild(center);
			}
		} //end _renumberVisibleTableRows()

		function setSelectedByIndex(i, state) {
			const rows = getRows();
			if (i >= 0 && i < rows.length) {
				rows[i].classList.toggle('selected', state);
			}
		}
		function selectRange(a, b, state = true) {
			const start = Math.min(a, b);
			const end = Math.max(a, b);
			for (let i = start; i <= end; i++) setSelectedByIndex(i, state);
		}
