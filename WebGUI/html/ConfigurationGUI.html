		function setupGroupHistory(ael, groupAction, groupType) {
			Debug.log("setupGroupHistory()", ael ? ael.innerText : "undefined");

			if (ael) //take from element selection
			{
				groupAction = "Activated";
				groupType = "unknown";

				if (ael.innerText.indexOf("Group History View") >= 0 ||
					ael.id == "groupHistoryActionSelect" ||
					ael.id == "groupHistoryTypeSelect") {
					//get current selections from dropdowns
					var actionSelectEl = document.getElementById("groupHistoryActionSelect");
					if (actionSelectEl)
						groupAction = actionSelectEl.value;
					var typeSelectEl = document.getElementById("groupHistoryTypeSelect");
					if (typeSelectEl)
						groupType = typeSelectEl.value;
				}
				else if (ael.innerText.indexOf("Configure Group") >= 0)
					groupType = "Configuration";
				else if (ael.innerText.indexOf("Context") >= 0)
					groupType = "Context";
				else if (ael.innerText.indexOf("Backbone") >= 0)
					groupType = "Backbone";
				else if (ael.innerText.indexOf("Iterat") >= 0)
					groupType = "Iterate";
				else if (ael.innerText.indexOf("Last Attempted") >= 0) { groupAction = "Attempted Configure"; groupType = "Configuration"; }
				else if (ael.innerText.indexOf("Last Configured") >= 0) { groupAction = "Configured"; groupType = "Configuration"; }
				else if (ael.innerText.indexOf("Last Run Started") >= 0) { groupAction = "Started"; groupType = "Configuration"; }

			} //else keep from input params

			if (!groupType || groupType == "unknown") {
				if (ael)
					Debug.err("Could not determine group type from link text: " + ael.innerText);
				else
					Debug.err("No group type specified!");
				return;
			}
			if(groupAction == "Activated" &&
				groupType == "Config Alias")
			{
				Debug.err("No history kept for Activated Config Aliases, please choose <b>Configured</b> or <b>Started</b> as the group action.");
				return;
			}

			var el = document.getElementById("display");

			navHistoryPush();

			el.innerHTML = "Loading...";
			//get history for this group type
			DesktopContent.XMLHttpRequest("Request?RequestType=getGroupHistory&groupAction=" +
				groupAction + "&groupType=" +
				groupType, "",
				function (req, param, err) {

					if(err)
						Debug.err(err);
					err = DesktopContent.getXMLValue(req, "Error");
					if(err)
						Debug.err(err);

					Debug.log("got group history response for action =", groupAction,
						"... type =", groupType);
					var groupHistory = [];
					try
					{
						var groupHistoryEls = req.responseXML.getElementsByTagName("GroupHistoryEntry");
						for (var i = 0; i < groupHistoryEls.length; ++i) {
							var entry = {
								groupName: DesktopContent.getXMLValue(groupHistoryEls[i], "groupName"),
								groupKey: DesktopContent.getXMLValue(groupHistoryEls[i], "groupKey"),
								time: DesktopContent.getXMLValue(groupHistoryEls[i], "time"),
								user: DesktopContent.getXMLValue(groupHistoryEls[i], "user")
							};
							groupHistory.push(entry);
						}
					}
					catch(e)
					{
						Debug.log("Powering through error:",e);
					}

					Debug.logv({ groupHistory });

					var str = "";

					//header for likning to each group history entry
					str += "<div style='margin-bottom:10px;'>Click on a group history entry below to view the associated group of tables.</div>";

					var groupActions = ["Activated", "Attempted Configure", "Configured", "Started", "Configured or Started"];
					var groupTypes = ["Configuration", "Context", "Backbone", "Iterate", "Config Alias"];
					//dropdown for each group action
					str += "<div style='margin-bottom:20px;'><label for='groupHistoryActionSelect'>Select a group action: </label>" +
						"<select id='groupHistoryActionSelect' onchange='setupGroupHistory(this)'>";
					for (var i = 0; i < groupActions.length; ++i)
						str += "<option value='" + groupActions[i] + "' " +
							(groupAction == groupActions[i] ? "selected" : "") + ">" +
							groupActions[i] + "</option>";
					str += "</select></div>";

					//dropdown for each group type
					str += "<div style='margin-bottom:20px;'><label for='groupHistoryTypeSelect'>Select a group type: </label>" +
						"<select id='groupHistoryTypeSelect' onchange='setupGroupHistory(this)'>";
					for (var i = 0; i < groupTypes.length; ++i)
						str += "<option value='" + groupTypes[i] + "' " +
							(groupType == groupTypes[i] ? "selected" : "") + ">" +
							groupTypes[i] + "</option>";
					str += "</select></div>";

					//button to launch group history view
					str += "<button onclick='setupGroupHistory(this)'>Reload Group History View</button>";
					str += "<br><br>";

					if (groupHistory.length == 0)
						str += "No history found for " + groupAction + " &apos;" + groupType + "&apos; groups.";
					else {

						var returnToHereLink = "setupGroupHistory(0, \\\"" + groupAction + "\\\",\\\"" +
							groupType + "\\\");";

						str += "<table id='groupHistoryTable' style='border-collapse:collapse; margin-left:20px;'>";
						str += "<tr><th colspan='2' style='text-align:center; border-bottom:1px solid black; border-left: 0;'>" +  //hide first column border-left
							groupAction;
						if(groupType == "Config Alias")
							str += " Alias";
						else
							str += " Group";
						str += "</th>" +
							"<th style='text-align:center; border-bottom:1px solid black;'>Time</th>" +
							"<th style='text-align:center; border-bottom:1px solid black;'>User</th></tr>";
						for (var i = groupHistory.length - 1; i >= 0; --i) {

							if(groupType == "Config Alias")
								str += "<tr><td style='border-left: 0;'>" + //hide first column border-left
									"&quot;" + groupHistory[i].groupName + "&quot;" + //groupName is alias, no groupKey
									"</td><td style='border-left: 0;'></td>"; //empty links (for now)
							else
							{
								str += "<tr><td style='border-left: 0;'>" + //hide first column border-left
									"<a href='#' onclick='setupSpecificTableGroup(\"" +
									groupHistory[i].groupName + "\",\"" +
									groupHistory[i].groupKey + "\", " +
									"\"" + returnToHereLink + "\"" +
									"); return false;'>" +
									groupHistory[i].groupName +
									"</a>(" + groupHistory[i].groupKey + ")" +
									"</td>";

								str += "<td style='border-left: 0; white-space:nowrap;'>" +

									//add tree-view link
									"<a href='#' onclick='setupTableGroupTreeView(\"" +
									groupHistory[i].groupName + "\",\"" +
									groupHistory[i].groupKey + "\", " +
									"\"" + returnToHereLink + "\"); return false;' " +
									" title='Open the tree-view for the group  &apos;" +
									groupHistory[i].groupName + "(" +
									groupHistory[i].groupKey + ").&apos;'" +
									">Tree-view</a>&nbsp;&nbsp;" +

									//add Activate link
									" <a href='#' onclick='activateSystemConfig(\"" +
									groupHistory[i].groupName + "\",\"" +
									groupHistory[i].groupKey + "\"); return false;' title='" +
									"Activate the group &apos;" +
									groupHistory[i].groupName +	" (" +
									groupHistory[i].groupKey + ").&apos;'" +
									">Activate</a>&nbsp;&nbsp;" +

									//add Alias link
									" <a href='#' onclick='popUpGroupViewAliasForm(\"" +
									groupHistory[i].groupName + "\",\"" +
									groupHistory[i].groupKey + "\"); return false;' title='" +
									"Create a System Alias that refers to the group &apos;" +
									groupHistory[i].groupName + " (" +
									groupHistory[i].groupKey + ").&apos;'" +
									">Alias</a>" +

									"</td>";
							} //end group column

							str +=
								//time and user:
								"<td style='white-space:nowrap;'>" + groupHistory[i].time + "</td>" +
								"<td style='white-space:nowrap;'>" + groupHistory[i].user + "</td></tr>";
						}
						str += "</table>";
					}

					el.innerHTML = str;
				}, //end getGroupHistory request handler
				0,0,true); //param, progressHandler, callHandlerOnErr
		} //end setupGroupHistory()

		function unixTimeToDateInputValue(unixTimeSeconds) {
			if (!unixTimeSeconds)

			var y = date.getFullYear();
			var m = String(date.getMonth() + 1).padStart(2, "0");
			var d = String(date.getDate()).padStart(2, "0");
			return y + "-" + m + "-" + d;

		//==============================================================================
		function tableViewFilterRequest(anchorTarget, refreshVersions) {
			editCellCancel();

			var selectedOption = document.getElementById("tableViewDateFilterPreset").value;
			_tableViewSelectedOption = selectedOption;
			var modeEl = document.getElementById("tableViewDateFilterMode");
			if (modeEl)
				_tableViewSelectedFilterMode = modeEl.value;
			_tableViewSelectedStartTime = 0;
			_tableViewSelectedEndTime = 0;
			var selectedStartTime = 0;
			var selectedEndTime = 0;

			function localDateFromInput(dateString, endOfDay = false) {
				const [year, month, day] = dateString.split("-").map(Number);

				if (endOfDay) {
					return new Date(year, month - 1, day, 23, 59, 59, 999);
				}

				return new Date(year, month - 1, day, 0, 0, 0, 0);
			}

			//look up the selected preset in the current mode's preset list
			var presets = _TABLE_VIEW_FILTER_PRESETS[_tableViewSelectedFilterMode] ||
				_TABLE_VIEW_FILTER_PRESETS["created"];
			var selectedPreset = null;
			for (var p = 0; p < presets.length; ++p)
				if (presets[p].value === selectedOption) {
					selectedPreset = presets[p];
					break;
				}

			if (selectedPreset) {
				selectedEndTime = Math.floor(Date.now() / 1000);
				selectedStartTime = selectedEndTime - selectedPreset.seconds;
			}
			else if (selectedOption === "custom") {
				// get the dates from tableViewDateFrom and tableViewDateTo
				const dateFromInput = document.getElementById("tableViewDateFrom").value;
				const dateToInput = document.getElementById("tableViewDateTo").value;
				if (!dateFromInput || !dateToInput) {
					Debug.log("Custom date filter selected but missing date inputs.");
					return; // missing custom date inputs, so return without making a request
				}
				const dateFrom = localDateFromInput(dateFromInput);
				const dateTo = localDateFromInput(dateToInput, true /*endOfDay*/);
				selectedStartTime = Math.floor(dateFrom.getTime() / 1000);
				selectedEndTime = Math.floor(dateTo.getTime() / 1000);
				if ( selectedStartTime >= selectedEndTime) {
					Debug.warn("Invalid Custom Date Range: the 'From' date (" +
						encodeHTML(dateFromInput) + ") must be before the 'To' date (" +
						encodeHTML(dateToInput) + "). Please adjust your custom date filter inputs.");
					return;
				}
			}
			else if (selectedOption === "") {
				Debug.log("No date filter applied, loading all tables.");
				var keepFilterMode = _tableViewSelectedFilterMode;
				resetTableViewParams();
				_tableViewSelectedFilterMode = keepFilterMode; //preserve user's Created/Loaded choice
				setupTableViewMode(anchorTarget, refreshVersions);
				return;
			}
			else {
				Debug.log("Unknown date filter preset: " + selectedOption);
				return;
			}

			_tableViewSelectedStartTime = selectedStartTime;
			_tableViewSelectedEndTime = selectedEndTime;

			var el = document.getElementById("display");
			el.innerHTML = "Loading... " +
				"<label style='font-size:12px; color:gray;'>If this is the first " +
				"time filtering, it may take a while to populate the time cache " +
				"(e.g. &gt;1 minute).</label>";
			DesktopContent.XMLHttpRequest("Request?RequestType=getTables" +
								(refreshVersions ? "&refresh=1" : "") +
								"&startTime=" + selectedStartTime +
								"&endTime=" + selectedEndTime +
								"&filterMode=" + _tableViewSelectedFilterMode,
								"",
								tableViewRequestHandler,
								anchorTarget);
		} //end tableViewFilterRequest()

		//==============================================================================
		//handleFlattenSystemAliasesResponse ~
		function handleOtsRelaunchResponse(req, isWiz, errStr, isOther) {
			if (req) //if supervisor is killed, then req will be 0, which is a good sign of progress
			{ 	//else check error response
				var err = DesktopContent.getXMLValue(req, "Error");
				if (err) {
					Debug.err(err);
					DesktopContent.systemBlackout(false); //end blackout
					return;
				}
			}
			else if (errStr && //if error not due to server going down, then remove blackout
				errStr.indexOf("Request was interrupted") < 0) {
				Debug.err("Relaunch failed: " + errStr);
				DesktopContent.systemBlackout(false); //end blackout
				return;
			}

			var countDown = 10;
			if (isWiz)
				Debug.log("Attempting to restart your system in Wiz Mode... " +
					"\n\n Please wait " + countDown +
					" seconds and then reload the System View to verify changes.",
					Debug.INFO_PRIORITY);
			else {
				countDown = 20;
				if (!isOther)
					Debug.log("Attempting to restart your system in Normal Mode... " +
						"\n\n Please wait " + countDown +
						" seconds and then reload the System View to verify changes.",
						Debug.INFO_PRIORITY);
				else
					Debug.log("\n\n Please wait " + countDown +
						" seconds and then reload the System View to verify changes.",
						Debug.INFO_PRIORITY);
			}

			localCountDown();
			//=================
			function localCountDown() {
				Debug.log("Waiting " + countDown + " seconds for startup operation...",
					Debug.INFO_PRIORITY);

				window.setTimeout(function () {
					Debug.log("localCountDown handler ");
					--countDown;
					if (countDown == 0) {
						//end blackout
						DesktopContent.systemBlackout(false);
						//DesktopContent._blockSystemCheckMailbox.innerHTML = "";
						Debug.log("And we are back!<br>If you are switching ots operating modes, you may need to manually change the URL in your browser.", Debug.INFO_PRIORITY);
						setupSystemViewMode();
						DesktopContent.XMLHttpRequest("Request?" +
							"RequestType=clearTableCachedVersions" +
							"&tableName=*" +
							"&refresh=1"
						);
						return;
					}
					localCountDown();
				}, //end blackout-end handler
					1000/*ms*/);
			}// end localCountDown
		} //end handleOtsRelaunchResponse()

							//	allow server to define latest based on user activity
							//	and is defined by the first key in the response
							// Old way:
							// 	//only represent single latest group/key
							// 	if ((key | 0) > (msKeys[j] | 0))
							// 	{
							// 		msKeys[j] = key; //found new latest key
							// 		indexToLatest[j] = i; //update latest index
							// 	}

							//add to all keys
							msAllKeys[j] += "-" + key;

							skipRepeat = true;
							break;
						}
					if (skipRepeat) continue; //do not add repeats to multi-select array

					msValues.push(groupName);
					msKeys.push(key);
					msTypes.push(backLinkStr);
					msAllKeys.push(key);
					indexToLatest.push(i);
				}


				//prepare key string (last key in key string is latest)
				// and display exhastive list
				str = "";
				for (var i = 0; i < msValues.length; ++i) {
					msAllKeys[i] += "-" + msKeys[i] + "-" + msValues[i];

						msAllKeys[i].split('-'),
						msKeys[i],
						membersHdr[indexToLatest[i]],
						true  //back link to the exhaustive list
					);

				var el = document.getElementById('exhaustiveGroupList');

				el = document.getElementById('filteredGroupCount');
				el.innerHTML = filteredGroupCount;

					//if anything is selected from before.. handle as selected

			//if there is a target to jump to, do it

		//==============================================================================
		//searchTextInGroup
		function searchTextInGroup() {
			Debug.log("CfgGUI searchTextInGroup");

			var el = document.getElementById("searchTextInGroups");
			var searchText = el ? el.value : "";
			Debug.log("searchTextInGroups: " + searchText);

			var el = document.getElementById("searchMinThreshold");
			var searchMinThreshold = el ? el.value : 1;
			Debug.log("searchMinThreshold: " + searchMinThreshold);

			var el = document.getElementById("searchVersionToCheck");
			var searchVersionToCheck = el ? el.value : "";
			Debug.log("searchVersionToCheck: " + searchVersionToCheck);

			var activeOnlyEl = document.getElementById("activeOnlyFilter");
			var isActiveOnlyChecked = activeOnlyEl ? activeOnlyEl.checked : false;
			Debug.log("activeGroupFilter checked: " + isActiveOnlyChecked);

			var typeName = ["All", "Context", "Backbone", "Configuration", "Iterate"];
			var groupType = typeName[_groupViewFilterIndex + 1];
			Debug.log("groupType: " + groupType);

			var optionElements = document.querySelectorAll('.myOption.optionhighlighted');
			var optionGroups = Array.from(optionElements).map(el => el.textContent).join(',');
			Debug.log("optionGroups: " + optionGroups);

			DesktopContent.XMLHttpRequest("Request?RequestType=SearchFieldInGroup" +
				"&searchText=" + encodeURIComponent(searchText) +
				"&filterValue=" + encodeURIComponent(isActiveOnlyChecked) +
				"&groupType=" + encodeURIComponent(groupType) +
				"&optionGroups=" + encodeURIComponent(optionGroups) +
				"&versionsToCheck=" + encodeURIComponent(searchVersionToCheck),
				"",
				function(req){
					var req = arguments[0];
					var errStr = arguments[2];
					if (errStr) {
						console.error(errStr);
						return;
					}

					const groupTableMap = new Map();
					var groupTableMatches = DesktopContent.getXMLChildren(req, "GroupTableMatch");

					Debug.log("GroupTableMatch elements found:", groupTableMatches.length);

					for (var i = 0; i < groupTableMatches.length; i++) {
						var groupTable = groupTableMatches[i];
						var groupTableInfo = groupTable.getAttribute("value").split("/");
						var groupName = groupTableInfo[0];
						var tableName = groupTableInfo[1];
						var matchRow = DesktopContent.getXMLValue(groupTable, "MatchRow");
						var matchColumn = DesktopContent.getXMLValue(groupTable, "MatchColumn");
						var matchTableVersion = DesktopContent.getXMLValue(groupTable, "MatchTableVersion");
						var matchGroupVersion = DesktopContent.getXMLValue(groupTable, "MatchGroupVersion");
						// Process each match...

						Debug.log("Match found:", { groupName: groupName, groupVersion: matchGroupVersion, tableName: tableName, tableVersion: matchTableVersion, row: matchRow, column: matchColumn });
						var mapKey = groupName+"-"+tableName+"-"+matchColumn+"-"+matchTableVersion+"-"+matchGroupVersion;
						if (!groupTableMap.has(mapKey))
							groupTableMap.set(mapKey, 1);
						else
							groupTableMap.set(mapKey, groupTableMap.get(mapKey) + 1);
					} // end groupTableMatches loop

					// loop through and add to new table if threshold met
					for (let [key, count] of groupTableMap.entries()) {
						if(count < searchMinThreshold)
							groupTableMap.delete(key);
					}

					// Display results
					var escapedSearchText = encodeHTML(searchText);
					var resultStr = "Search Results For: <b>" + escapedSearchText + "</b>\n";
					if (groupTableMap.size === 0) {
						resultStr += "<br>No matches found.";
					} else {
						var previousGroupName = "";
						var previousGroupKey = "";
						var previousTableName = "";
						for(var i=0; i<groupTableMap.size; i++)
						{
							var parts = Array.from(groupTableMap.keys())[i].split("-");
							if(parts[0] != previousGroupName || parts[4] != previousGroupKey)
							{
								resultStr += "\nGroup: <b>" + parts[0] + "</b> v" + parts[4] + "\n";
								previousGroupName = parts[0];
								previousGroupKey = parts[4];
								previousTableName = "";
							}
							if(parts[1] != previousTableName)
							{
								resultStr += "\t<a href='#' onclick='setupSpecificTable(\"" + parts[1] + "\",\"" + parts[3] + "\", \"setupTableViewMode(\\\"anchorTag-" + parts[1] + "\\\");\"); return false;'>" +
											"Table " + parts[1] + "-v" + parts[3] + "</a><br>";
								previousTableName = parts[1];
							}
							if(parts[1] == "")
								Debug.log('Warning: Empty table name for group ' + parts[0] + ' (' + parts[4] + ')');
							resultStr += "\t\tColumn: <b>" + parts[2] + "</b>" +
								", Count: <b>" + (groupTableMap.get(Array.from(groupTableMap.keys())[i])) + "</b>" +
								"\n";
						} // end groupTableMap loop
					}
					Debug._errTruncLen = -1;
					Debug.info(DesktopContent.tooltipConditionString(resultStr));
					Debug._errTruncLen = undefined;
				},
				"searchTextInGroup"
			);
		} //end searchTextInGroup()

		function setupSpecificTableGroup(groupName, groupKey, backLinkStr, anchorTarget, modifiedTables) {

		function blockContextMenu(event) {

		//==============================================================================
		//registerOnClickActions ~~
		function registerOnClickActions() {
			var tbody = document.getElementById("SubSystemTable");
			if (!tbody) return;

			// Ignore the first two <tr> tags (header rows)
			const _CONFIG_DATA_ROW_OFFSET = 2;
			const dataRows = Array.from(tbody.querySelectorAll('tr')).slice(_CONFIG_DATA_ROW_OFFSET);

			dataRows.forEach((tableRow) => {
				// Avoid duplicate listeners when this function is called repeatedly.
				if (tableRow.dataset.selectionHandlersBound === "1") return;
				tableRow.dataset.selectionHandlersBound = "1";

				tableRow.addEventListener('mousedown', (e) => {
					Debug.log("Table row mouse down");

					const tr = e.target.closest('tr');
					if (!tr || e.button !== 0) return; // only left click

					const idx = indexOfRow(tr);
					if (idx === -1 || idx == 0) return;

					// REORDER DRAG: mousedown on an already-selected row without modifier keys
					if (!e.shiftKey && !e.ctrlKey && !e.metaKey && tr.classList.contains('selected')) {
						Debug.log("Starting row reorder drag from index", idx);
						isReorderDragging_ = true;
						reorderDropIndex_ = idx;
						document.addEventListener('mousemove', _reorderDragMouseMove);
						_reorderDragMouseMove(e); //initialize indicator immediately
						document.body.classList.add('no-select');
						document.body.classList.add('row-reorder-drag');
						e.stopPropagation();
						e.preventDefault();
						return;
					}

					// SHIFT RANGE (works without Ctrl)
					if (e.shiftKey && lastSelectedIndex_ !== null) {
						const currentlySelected = tr.classList.contains('selected');
						Debug.log("Shift+click row selection", "anchor=", lastSelectedIndex_, "target=", idx, "targetWasSelected=", currentlySelected, "applyState=", !currentlySelected);
						selectRange(lastSelectedIndex_, idx, !currentlySelected);
						lastSelectedIndex_ = idx;
						suppressNextMouseup_ = true;
						e.stopPropagation();
						e.preventDefault();
						return;
					}

					// CTRL/Meta required for selection actions
					if (!(e.ctrlKey || e.metaKey)) {
						// no selection if not holding ctrlreturn;
						return;
					}

					// also stop the context menu that would appear afterwards
					document.addEventListener("contextmenu", blockContextMenu, { once: true });

					// CTRL Click or CTRL Drag Starts
					const currentlySelected = tr.classList.contains('selected');
					dragModeSelect_ = !currentlySelected; // true = selecting, false = deselecting
					Debug.log("Ctrl/Meta+click row selection", "row=", idx, "rowWasSelected=", currentlySelected, "dragModeSelect_=", dragModeSelect_);
					isDragging_ = true;
					dragStartIndex_ = idx;
					hasDragMoved_ = false;
					suppressNextMouseup_ = true;
					document.body.classList.add('no-select');
					setSelectedByIndex(idx, dragModeSelect_);
					lastSelectedIndex_ = idx;
					e.stopPropagation();
					e.preventDefault();
				});

				tableRow.addEventListener('mouseover', (e) => {
					if (!isDragging_) return;
					if (!(e.ctrlKey || e.metaKey)) return; // drag requires ctrl
					if (e.buttons !== 1) return; // Left click is not being held down

					const tr = e.target.closest('tr');
					if (!tr) return;
					const idx = indexOfRow(tr);
					if (idx === -1) return;
						if (idx !== dragStartIndex_) hasDragMoved_ = true;
					setSelectedByIndex(idx, dragModeSelect_);
				});

				tableRow.addEventListener('mouseup', (e) => {
					Debug.log("Table row mouse up");
					suppressNextMouseup_ = false;
					if (e.shiftKey || e.ctrlKey || e.metaKey)
						e.stopPropagation();
				});

				tableRow.addEventListener('click', (e) => {
					Debug.log("Table row click");
					e.stopPropagation(); // Stops other handlers
					e.preventDefault();
					if (e.shiftKey || e.ctrlKey || e.metaKey)
						e.stopImmediatePropagation();
					const tr = e.target.closest('tr');
					if (!tr) return;
					if (indexOfRow(tr) === -1) return;

					// SHIFT does nothing here (handled in mousedown)
					if (e.shiftKey) return;

					// If this click ended a drag-selection, do not toggle the anchor row.
					if (hasDragMoved_) {
						hasDragMoved_ = false;
						return;
					}


					// Selection state is handled on mousedown to avoid click-phase double toggles.
					return;
				});
			}); //end foreach loop

			// Attach mouseup listener to window to handle drag end anywhere (only once)
			if (!windowMouseupRegistered_) {
				window.addEventListener('mouseup', (e) => {
					// --- Finalize row reorder drag ---
					if (isReorderDragging_) {
						_reorderDragMouseMove(e, true); //capture final cursor position at mouse release
						Debug.log("Reorder drag ended, drop index:", reorderDropIndex_);
						suppressBodyMouseupOnce_ = true;
						isReorderDragging_ = false;
						document.body.classList.remove('row-reorder-drag');
						document.body.classList.remove('no-select');
						document.removeEventListener('mousemove', _reorderDragMouseMove);
						_clearReorderDropIndicators();
						if (reorderDropIndex_ >= _CONFIG_DATA_ROW_OFFSET) {
							moveSelectedRowsToIndex(reorderDropIndex_);
						}
						reorderDropIndex_ = -1;
						return;
					}

					const endedSelectionDrag = (isDragging_ && hasDragMoved_);
					if (endedSelectionDrag)
						suppressBodyMouseupOnce_ = true;

					// do not interrupt highlighting and text input
					const activeEl = document.activeElement;
					const hasTextSelection = window.getSelection && !window.getSelection().isCollapsed;
					if (_mouseIsSelecting || hasTextSelection ||
						(activeEl && (activeEl.tagName === "INPUT" ||
							activeEl.tagName === "TEXTAREA" ||
							activeEl.isContentEditable))) {
						return;
					}
					Debug.log("Window mouse up");
					isDragging_ = false;
					dragStartIndex_ = -1;
					suppressNextMouseup_ = false;
					document.body.classList.remove('no-select');
					window.getSelection().removeAllRanges();
				});
				windowMouseupRegistered_ = true;
			}
		} //end registerOnClickActions()

		function toggleTreeDiffMode(setVal) {
			var tmpTreeDiffMode;
			if (setVal !== undefined)
				tmpTreeDiffMode = setVal;
			else
				tmpTreeDiffMode = !treeDiffModeApplied_; //invert

			Debug.log("toggleTreeDiffMode " + tmpTreeDiffMode);

			if (!tmpTreeDiffMode) {
				treeDiffModeApplied_ = tmpTreeDiffMode; //disable tree diff mode

				Debug.log("Tree diff mode disabled.");
				hardRefreshTreeView();
			}
			else {
				//pop up diff group selection
				Debug.log("toggleTreeDiffModeDialog");

				var el = document.getElementById("popUpDialog");
				if (!el) {
					el = document.createElement("div");
					el.setAttribute("id", "popUpDialog");
				}
				el.style.display = "none";

				//set position and size
				var w = 500;
				var h = 235;
				ConfigurationAPI.setPopUpPosition(el, w /*w*/, h /*h*/);

				//show choices for context and config groups

				var str = "<a id='" +
					"popUpDialog" +
					"-header' onclick='var el = document.getElementById(" +
					"\"popUpDialog\"); if(el) el.parentNode.removeChild(el); return false;'>Cancel</a><br><br>";

				//get existing groups to merge
				///////////////////////////////////////////////////////////
				DesktopContent.XMLHttpRequest("Request?RequestType=getTableGroups" +
					"",
					"",
					function (req) {
						var err = DesktopContent.getXMLValue(req, "Error");
						if (err) {
							Debug.err(err);
							el.innerHTML = str;
							return;
						}

						var groupNames = req.responseXML.getElementsByTagName("TableGroupName");
						var keys = req.responseXML.getElementsByTagName("TableGroupKey");
						var types = req.responseXML.getElementsByTagName("TableGroupType");

						var groupName;

						//Two group types here:	"Context" "Configuration"

						str += "<div id='popUpDialog-div'>";
						str += "Please select a " + treeGroupType_ + " group with which to compare to &apos;" + treeGroupName_ +
							"(" + treeGroupKey_ + ").&apos; <br>(Differences will appear in <b><label style='color:" + treeDiff_COLOR_ + ";'>ORANGE</label></b> in the Tree View.)" +
							"<br><br>";
						str += "<center>";

						str += "Group Name to compare: " + DesktopContent.htmlOpen("select",
							{
								"id": "diffGroupName",
								"title": "Select the group name to compare to &apos;" +
									treeGroupName_ + "(" + treeGroupKey_ + ").&apos;",
							},
							"" /*innerHTML*/,
							false /*doCloseTag*/);
						var groupNameKeyCount = 0;
						for (var j = 0; j < groupNames.length; ++j) {
							if (types[j].getAttribute("value") == treeGroupType_) {
								var tmpGroupName = groupNames[j].getAttribute("value");
								if (tmpGroupName == groupName) {
									++groupNameKeyCount;
									continue; //only add new group names
								}

								if (groupNameKeyCount == 0)  //skip first change
								{
									groupNameKeyCount = 1;
									continue;
								}

								str += "<option value='" + groupName + "' " +
									(groupName == treeGroupName_ ? "selected" : "") +
									">";
								str += groupName + " (" + groupNameKeyCount + " keys)";	//can display however
								str += "</option>";
								groupName = tmpGroupName;
								groupNameKeyCount = 1;
							}
						}
						str += "</select><br><br>";

						str += "Group Key to compare: " + DesktopContent.htmlOpen("select",
							{
								"id": "diffGroupKey",
								"title": "Select the group key to compare to &apos;" +
									treeGroupName_ + "(" + treeGroupKey_ + ").&apos;",
							},
							"" /*innerHTML*/,
							true /*doCloseTag*/);
						str += "<br><br>";


						str += DesktopContent.htmlOpen("input",
							{
								"type": "button",
								"id": "diffButton",
								"value": "Generate Diff Report and Enable Tree-view Diff Mode",
								"title": "Generate difference report for the selected group and &apos;" +
									treeGroupName_ + "(" + treeGroupKey_ + ")&apos;, and enable tree-view differencing mode.",
							},
							"" /*innerHTML*/,
							true /*doCloseTag*/);

						str += "</div><br><br>";

						el.innerHTML = str;

						document.getElementById("display").appendChild(el); //add element to display div
						el.style.display = "block";

						function localHandleDiffGroupNameChange(event) {
							var groupName;
							if (event)
								groupName = this.value;
							else
								groupName = treeGroupName_;


							Debug.log("localHandleDiffGroupNameChange", groupName);

							var el = document.getElementById("diffGroupKey");
							var str = "";
							var groupKey;
							var groupKeyCount = 0;
							var firstGroupKey = -1;
							var firstKeyAdded = false;
							var foundSelected = false;

							for (var j = 0; j < groupNames.length; ++j) {
								if (groupNames[j].getAttribute("value") == groupName) {
									groupKey = keys[j].getAttribute("value");
									if (firstGroupKey == -1) //save the first key because the last key comes first
									{
										firstGroupKey = groupKey | 0;
										Debug.logv({ firstGroupKey });
										continue;
									}
									else if (firstGroupKey < (groupKey | 0)) //somehow first key is not actually the last key
									{
										Debug.log("Note the first key in the xml response was not the last key!");
										str += "<option value='" + groupKey + "' " +
											((!event && ((groupKey | 0) + 1) == (treeGroupKey_ | 0)) ? "selected" : "") +
											">";
										str += groupKey;	//can display however
										str += "</option>";
										++groupKeyCount;
										firstKeyAdded = true;
									}

									if ((!event && ((groupKey | 0) + 1) == (treeGroupKey_ | 0)))
										foundSelected = true;

									str += "<option value='" + groupKey + "' " +
										((!event && ((groupKey | 0) + 1) == (treeGroupKey_ | 0)) ? "selected" : "") +
										">";
									str += groupKey;	//can display however
									str += "</option>";
									++groupKeyCount;
								}
							}
							if (firstGroupKey != -1 && !firstKeyAdded) //then add the last key
							{
								str += "<option value='" + firstGroupKey + "' " +
									">";
								str += firstGroupKey;	//can display however
								str += "</option>";
								++groupKeyCount;
							}
							el.innerHTML = str;
							if (event || !foundSelected)
								el.selectedIndex = groupKeyCount - 1;

						} //end localHandleDiffGroupNameChange()

						document.getElementById("diffGroupName").onchange = localHandleDiffGroupNameChange;
						localHandleDiffGroupNameChange(); //initialize diff key select

						document.getElementById("diffButton").onmouseup =
							function () {
								var selectedKey = document.getElementById("diffGroupKey").value;
								var selectedGroupName = document.getElementById("diffGroupName").value;
								Debug.log("treeDiffButton onmouseup", selectedGroupName, selectedKey);

								DesktopContent.XMLHttpRequest("Request?RequestType=diffWithGroupKey&groupName=" + treeGroupName_ +
									"&groupKey=" + treeGroupKey_ +
									"&diffKey=" + selectedKey +
									"&diffGroupName=" + selectedGroupName,
									"",
									function (req) {
										var noDifference = DesktopContent.getXMLValue(req, "NoDifference") == "1";
										var diffReport = DesktopContent.getXMLValue(req, "DiffReport");
										var tablesWithDiff = [];
										treeDiffTablesWithDiff_ = {}; //clear map of tables with diff for quick lookup and display in tree diff
										Debug._errTruncLen = -1; //avoid truncation of Debug message
										if (noDifference)
											Debug.info(DesktopContent.tooltipConditionString(diffReport));
										else {
											Debug.warn(DesktopContent.tooltipConditionString(diffReport));

											var tablesWithDiff = req.responseXML.getElementsByTagName("TableWithDiff");
											var tableWithDiffName;
											var recordsWithDiffName;
											for (var i = 0; i < tablesWithDiff.length; ++i) {
												tableWithDiffName = tablesWithDiff[i].getAttribute("value");
												treeDiffTablesWithDiff_[tableWithDiffName] = {};
												var recordsWithDiff = tablesWithDiff[i].getElementsByTagName("RecordWithDiff");
												for (var j = 0; j < recordsWithDiff.length; ++j) //come in UID/colName pairs
												{
													recordsWithDiffName = recordsWithDiff[j].getAttribute("value");
													treeDiffTablesWithDiff_[tableWithDiffName][recordsWithDiffName] = [];
													var colNameWithDiff = recordsWithDiff[j].getElementsByTagName("ColNameWithDiff");
													for (var k = 0; k < colNameWithDiff.length; ++k)
														treeDiffTablesWithDiff_[tableWithDiffName][recordsWithDiffName].push(
															colNameWithDiff[k].getAttribute("value"));
												}
											}
											Debug.log("treeDiffTablesWithDiff_", treeDiffTablesWithDiff_);
										}
										Debug._errTruncLen = undefined; //return truncation

										//kill popup dialog
										var el = document.getElementById("popUpDialog");
										if (el) el.parentNode.removeChild(el);

										treeDiffModeGroupName_ = selectedGroupName;
										treeDiffModeGroupKey_ = selectedKey;
										treeDiffModeApplied_ = true;

										Debug.log("Tree diff mode enabled.");
										hardRefreshTreeView();
									}); //end diffWithActiveGroup
							}; // end diffButton onmouseup

					}, 0, 0, true //reqParam, progressHandler, callHandlerOnErr
				); //end of getTableGroups handler


				document.getElementById("display").appendChild(el); //add element to display div
				el.style.display = "block";
			}

		} //end toggleTreeDiffMode()

		//==============================================================================
		//treeViewHandler ~
		function treeViewHandler(req, parentId, err) {
			if (err) //show login access errors
			{
				Debug.err(err);
				return;
			}

			err = DesktopContent.getXMLValue(req, "Error");
			if (err) {
				Debug.err("If you do not understand the error, try refreshing the tree from the '>>' menu in the top left of the page");
				Debug.err(err);
				Debug.err("If you do not understand the error, try refreshing the tree from the '>>' menu in the top left of the page");

				if (parentId)
					return;
				// else try to power through
			}

			var warn = DesktopContent.getXMLValue(req, "Warning");
			if (warn) {
				if (warn != lastTreeWarnStr_) {
					Debug.warn("If you made changes to this tree, they may have been lost.");
					Debug.warn(warn);
					Debug.warn("If you made changes to this tree, they may have been lost.");
				}
				else
					Debug.log(warn);
			}
			lastTreeWarnStr_ = warn;
			warn = DesktopContent.getXMLValue(req, "NoTreeLinkWarning");
			Debug.log("NoTreeLinkWarning:", warn);



			//draw tree

				treeViewHandlerStr_ += "<a onclick='hideTreeChildrenDepth(); return false;'" +

				treeViewHandlerStr_ += "<img onclick='showTreeViewTooltip(true);' src='/WebPath/images/dashboardImages/icon-Help.png' " +

				//				treeViewHandlerStr_ += "&nbsp;&nbsp;&nbsp;&nbsp;";
				//				treeViewHandlerStr_ += "<a href='#' onclick='" +
				//						"treeViewHideStatus_ = !treeViewHideStatus_;" +
				//						refreshLinkStr +
				//						"; return false;' title='' " +

				//create group details
				{

					groupCreationTime = ConfigurationAPI.getDateString(new Date((groupCreationTime | 0) * 1000));

					treeViewHandlerStr_ += "<tr><th>Created:</th><td class='underlineRow'>" + groupCreationTime + "</td></tr>";
					treeViewHandlerStr_ += "<tr><th>Comment:</th><td>" +
						groupComment.replace(/\n/g, "<br>") + "</td></tr>";
					treeViewHandlerStr_ += "</table>";
					treeViewHandlerStr_ += "</div>";

					treeViewHandlerStr_ += "<div id='clearDiv' style='height:15px'></div>";
				}


				if (treeErr || err || warn) {
					treeViewHandlerStr_ += "<div style='color:red; cursor:pointer' title='" +
						//treeErr.replace(/'/g , "&apos;") + "' ";
						"Click to view errors' ";
					treeViewHandlerStr_ += "onmouseup='" +
						"var el = document.getElementById(\"treeViewErrors\"); el.style.display = " +
						"el.style.display == \"none\"?\"block\":\"none\"" +
						"'>";
					if (treeErr || err)
						treeViewHandlerStr_ += "<u>Warning: Errors were detected in this tree!</u>";
					else
						treeViewHandlerStr_ += "<u>Note: Warnings were detected in this tree!</u>";
					treeViewHandlerStr_ += "</div>";
					treeViewHandlerStr_ += "<div id='treeViewErrors' style='display:none'>" +
						(err ? err.replace(/\n/g, "<br>") : "") +
						(warn ? warn.replace(/\n/g, "<br>") : "") +
						(treeErr ? treeErr.replace(/\n/g, "<br>") : "") + "</div>";
					treeViewHandlerStr_ += "<div id='clearDiv' style='margin-bottom:10px'></div>";
				}

				var backLinkStr = "setupTableGroupTreeView(\\\"" +
					treeGroupName_ + "\\\",\\\"" +
					treeGroupKey_ + "\\\");";

				//add save-tree button placeholder (visibility toggled by treeHasChanged)
				treeViewHandlerStr_ += "<div class='treeSaveButton' style='visibility:hidden'>" +
					"<input type='button' onmouseup='popUpSaveTreeForm()' " +
					"value='Save All Tree Changes' title='" +
					"Save new versions of every modified table\n" +
					"(Optionally, save new active groups and assign system aliases)" +
					"'/><br><br></div>";

				//add config group header
				treeViewHandlerStr_ += "<a id='treeView-ConfigGroupLink' " +
					"href='#' onclick='setupSpecificTableGroup(\"" + tableGroupName +
					"\",\"" + tableGroupKey + "\",\"" + backLinkStr + "\"); return false;'>";
				treeViewHandlerStr_ += "<div style='display:none'>" + tableGroupName + "</div>";
				treeViewHandlerStr_ += "<div style='display:none'>" + tableGroupKey + "</div>";
				treeViewHandlerStr_ += tableGroupName + " (" + tableGroupKey + ")";
				treeViewHandlerStr_ += "</a>";

				treeViewHandlerStr_ += "&nbsp;&nbsp;&nbsp;";

				//add Activate link
				treeViewHandlerStr_ += " <a id='treeView-ConfigGroupActivateLink' " +
					"onclick='activateSystemConfig(\"" + tableGroupName +
					"\",\"" + tableGroupKey + "\"); return false;'>";
				treeViewHandlerStr_ += "Activate</a>";

				treeViewHandlerStr_ += "<div id='clearDiv' style='margin-bottom:10px'></div>";

				//preload hide image
				treeViewHandlerStr_ += "<img style='display:none' src='" +
					"/WebPath/images/windowContentImages/ConfigurationGUI-hideTree.png" + "'>";
			}

			//add tree
			var tree = DesktopContent.getXMLNode(req, "tree");
			var childrenLength = (tree && tree.children) ? tree.children.length : 0;

			if (childrenLength)
				recursiveDrawTree(tree, depth, tree.getAttribute("value"), parentId);
			else								//no children found
			{
				//treat no children as an empty value node!

				//////////=======================
				treeViewHandlerStr_ +=
					"<div class='treeNode'> " +
					"<div class='treeNode-Connection'></div>" +
					"<div class='treeNode-Value'>";

				treeViewHandlerStr_ += "<label style='color:rgb(212, 0, 0)'>";
				treeViewHandlerStr_ += "No Children Nodes Found.";
				treeViewHandlerStr_ += "</label>";

				treeViewHandlerStr_ += "</div>" + //end treeNode Value div
					"</div>" + //end treeNode div
					"<div id='clearDiv'></div>";
				//////////=======================
			}

			//add bottom save-tree button placeholder (only for top-level, not sub-tree expansions)
			if (!parentId)
				treeViewHandlerStr_ += "<div class='treeSaveButton' style='visibility:hidden'>" +
					"<br><input type='button' onmouseup='popUpSaveTreeForm()' " +
					"value='Save All Tree Changes' title='" +
					"Save new versions of every modified table\n" +
					"(Optionally, save new active groups and assign system aliases)" +
					"'/><br><br></div>";

			el.innerHTML = treeViewHandlerStr_;

			//addTableToConfigurationGroup("ARTDAQParamT"); //for Debuggin!!!
			if (treeViewExpandedCapture_ && treeViewExpandedCapture_.length) {
				Debug.log("Nodes to expand from treeViewExpandedCapture_", treeViewExpandedCapture_);

				doRestoreNextTreeViewExpand();
				return;
			}

			//save the full string for posterity (and for back links)
			treeViewHandlerStr_ = document.getElementById("display").innerHTML;

			applyTreeFilter("", 1); //reapplyFilter
			toggleGroupDetails(_showGroupDetails);

			activateTableGroupHandler(req); //display active config groups



			//consider offering to delete the parent of last deleted child
			if (parentId == treeEditingNodeParentIdString_ &&
				treeEditingNodeType_ == "delete-uid") {
				treeEditingNodeType_ = ""; //clear so parent not get considered again

				Debug.log("parentId " + parentId + " treeEditingNodeParentIdString_ " +
					treeEditingNodeParentIdString_ + " treeEditingNodeType_ " +
					treeEditingNodeType_);

				var parentIsEmpty = childrenLength == 0;

				if (!parentIsEmpty) //check for disconnected due to deleting the uid-link
				{
					try {
						var fieldName = treeEditingNodeInitValue_.split('-')[0];
						//look through children for fieldName
						for (var i = 0; i < tree.children.length; ++i)
							if (tree.children[i].getAttribute("value") == fieldName) {
								//found field, check for disconnected
								if (tree.children[i].children[0].getAttribute("value") ==
									"Disconnected")
									parentIsEmpty = true;
								break;
							}
					}
					catch (e) {
						Debug.log("Ignoring error trying verify deleted uid-link: " + e);
					}
				}

				//if no children at parent, then find closest parent that is a UID record
				//	and prompt for deletion
				if (parentIsEmpty)
					localHandleEmptyParent();
			}

			applySearchNode();
			return;

			//===========
			//localHandleEmptyParent ~~
			function localHandleEmptyParent() {
				//Steps:
				//	- navigate up tree until UID or LinkUID node found
				//		start at parent element.. is it a UID? etc.
				//	- offer to delete that UID node
				//	- delete using tree deletion mechanism, and is recursive for free
				//		i.e. when tree is drawn after deleting, it will check for empty parent again

				var parentType;
				var parentIdString = treeEditingNodeParentIdString_;
				var traversalCount = 0;

				try {
					Debug.log("Trying " + parentIdString);
					parentType = document.getElementById("treeNode-Value-" +
						parentIdString).className.split(' ')[2].split('-')[3];
					if (parentType == "link")  //get link type
						parentType += document.getElementById("treeNode-childLinkIdType-" +
							parentIdString).innerText;
					Debug.log("parentType " + parentType);


					while (parentType != "uid" && parentType != "linkUID") {
						//current parent is not a UID node
						//	so keep ascending tree

						if (++traversalCount > 10) {
							Debug.log("Is tree path somehow circular?! Giving up. " + traversalCount);
							return;
						}

						//check depth
						if (((parentIdString.split('-')[0]) | 0) <= 1) {
							Debug.log("Reached top of tree?! Still no UID node found?");
							return;
						}


						//get parent's parentIdString
						parentIdString =
							document.getElementById("treeNode-ParentId-" + parentIdString).textContent;

						Debug.log("Trying " + parentIdString);
						parentType = document.getElementById("treeNode-Value-" +
							parentIdString).className.split(' ')[2].split('-')[3];
						if (parentType == "link") //get link type
							parentType += document.getElementById("treeNode-childLinkIdType-" +
								parentIdString).innerText;
						Debug.log("parentType " + parentType);
					}
				}
				catch (e) {
					Debug.log("Error finding UID parent... " + e);
					return;
				}

				Debug.log("Found " + parentIdString);
				Debug.log("parentType " + parentType);


				var depth = (parentIdString.split('-')[0]) | 0;
				var idString = parentIdString;
				var path = document.getElementById("treeNode-path-" + idString).innerText;
				var uid;

				if (parentType == "linkUID")
					uid = document.getElementById("treeNode-Value-" +
						parentIdString).innerText.split('(')[1].split(' ')[2].split(')')[0];
				else //uid
					uid = document.getElementById("treeNode-nodeName-" + parentIdString).innerText;

				Debug.log("path " + path);
				Debug.log("uid " + uid);

				DesktopContent.popUpVerification(
					"The removed record &apos;" + treeEditingNodeInitValue_ +
					"&apos; left the parent record at path &apos;" +
					path +
					"REPLACE&apos; childless.<br><br>" +
					"Would you like to also delete the parent record &apos;REPLACE?&apos;",
					function () //delete the parent handler
					{

						Debug.log("Deleting the parent also. " + idString);

						//copied code from handleTreeNodeClick() and selectThisTreeNode()

						var el = document.getElementById("treeNode-Value-" + idString);

						treeEditingNodeDepth_ = depth;
						treeEditingNodeIdString_ = parentIdString;

						var splitArr = path.split('/');
						treeEditingNodeParentIdString_ =
							document.getElementById("treeNode-ParentId-" + idString).textContent;


						//get target table - similar to handleTreeNodeClick()
						if (parentType == "linkUID") {
							treeEditingTargetTable_ = document.getElementById("treeNode-linkTableName-" +
								idString).textContent;
						}
						else //uid
						{
							if (depth == 1)
								treeEditingTargetTable_ = splitArr[splitArr.length - 2]; //table should be before last slash in path
							else //accessing through link so need to get from parent
							{
								//needs to get from parent OR parent-of-parent
								//	if parent is uid link.. then one level back
								//	if parent is groupid link.. then two levels back

								var pel = document.getElementById("treeNode-linkTableName-" +
									treeEditingNodeParentIdString_);
								if (!pel)
									pel = document.getElementById("treeNode-linkTableName-" +
										(document.getElementById("treeNode-ParentId-" +
											treeEditingNodeParentIdString_).textContent));

								treeEditingTargetTable_ = pel.textContent;
							}
						}

						treeEditingTargetUID_ = uid;
						treeEditingTargetColumn_ = "UID";
						Debug.log("edit uid mode target=" + treeEditingTargetTable_ +
							"/" + treeEditingTargetUID_ + "/" +
							treeEditingTargetColumn_);

						treeEditingNodeType_ = "delete-uid";
						_editingCellElOldValue = el.textContent;
						treeEditingNodeInitValue_ = _editingCellElOldValue;

						_editingCell = true;
						_editingCellEl = el;

						_editingCellElOldTitle = el.title;
						el.title = "";


						Debug.log("treeEditingTargetTable_ " + treeEditingTargetTable_);
						Debug.log("treeEditingTargetColumn_ " + treeEditingTargetColumn_);
						Debug.log("treeEditingTargetUID_ " + treeEditingTargetUID_);
						Debug.log("treeEditingNodeType_ " + treeEditingNodeType_);
						editTreeNodeOK();


					}, //end delete the parent handler
					uid /* REPLACE val*/,
					"#efeaea" /*bgColor*/, 0 /*textColor*/,
					"#770000" /*borderColor*/, 0 /*getUserInput*/, 400 /*dialogWidth*/
				); //end of DesktopContent.popUpVerification


			} //end localHandleEmptyParent

		} //end treeViewHandler()

		//==============================================================================
		//doCaptureTreeViewExpand ~
		function doCaptureTreeViewExpand() {
			//capture expanded children status
			Debug.log("doCaptureTreeViewExpand()");
			var allNodes = document.getElementsByClassName("treeNode-Expander");
			treeViewExpandedCapture_ = [];
			for (var i = 0; i < allNodes.length; ++i) {
				//skip hidden nodes in search
				if (allNodes[i].offsetParent === null) continue;

				var params = allNodes[i].onmouseup.toString().split("(")[2].split(")")[0].split(",");

				var idString = params[0] + "-" + params[1];
				var el = document.getElementById("treeNode-ChildrenOf-" + idString);
				if (el && el.style.display == "block") {
					treeViewExpandedCapture_.push([
						document.getElementById("treeNode-path-" + idString).innerText,
						//take Value node here, and not NodeName, to accomodate depth 0 and non-0,..
						//	if a GroupID has changed, then the value will mismatch, but not expanding it will be an indicator to the user anyway
						document.getElementById("treeNode-Value-" + idString).innerText
					]);
					Debug.log("Found shown ",
						treeViewExpandedCapture_[treeViewExpandedCapture_.length - 1]);
				}

			}//end node capture expanded loop

		} //end doCaptureTreeViewExpand()

		//==============================================================================
		//doRestoreNext ~
		//	Scroll to scrollTarget after all nodes expanded
		function doRestoreNextTreeViewExpand(scrollTarget) {
			//expand them in order

			if (treeViewExpandedCapture_.length) //trigger chain reaction
			{
				Debug.log("Try ", treeViewExpandedCapture_[0], scrollTarget);

				//convert scrollTarget ID to path, so target can be found after refresh by toggleTreeChildren()
				if (scrollTarget && scrollTarget.length) {
					//convert parent id to parent path/value, because parent ID is lost for depth 2+ when new nodes are refreshed
					let scrollTargetPathEl = document.getElementById("treeNode-path-" + scrollTarget);
					let scrollTargetValueEl = document.getElementById("treeNode-nodeName-" + scrollTarget);
					if (scrollTargetPathEl && scrollTargetValueEl) //redefine scrollTarget
					{
						treeEditingScrollTargetPath_ = scrollTargetPathEl.innerText +
							scrollTargetValueEl.innerText;
					}
					Debug.logv({ treeEditingScrollTargetPath_ });
					scrollTarget = ""; //clear to avoid recursively redoing
				}

				//find matching path

				var allNodes = document.getElementsByClassName("treeNode-Expander");
				for (var i = 0; i < allNodes.length; ++i) {
					//skip hidden nodes in search
					if (allNodes[i].offsetParent === null) continue;

		//==============================================================================
		//recursiveDrawTree ~
		function recursiveDrawTree(parent, depth, path, parentIdString) {

					treeViewHandlerStr_ += "<td  id='treeNode-LinkContextMenuTD-" +
						(depth + "-" + uid) + "'>";

					treeViewHandlerStr_ +=
						"<div class='treeNode-Link' "; //start treeNode Link div


					if (isDisconnected) //hide link if disconnected
						treeViewHandlerStr_ += "style='display:none' ";

					treeViewHandlerStr_ +=
						"onmousedown='" + // start link onmousedown
						SimpleContextMenu.createMenuCallAsString(
							treeNavContextMenuItems,
							treeNavContextMenuItemHandlers,
							"treeNavContextMenu",
							_CONTEXT_MENU_PRIMARY_COLOR,
							_CONTEXT_MENU_SECONDARY_COLOR) + "' ";

					treeViewHandlerStr_ +=
						">" +
						"<div class='gotoNavDiv'></div>" +
						"</div>"; //end treeNode Link div

					treeViewHandlerStr_ += "</td><td>"; //delimit linkmenu/editicon table row

					if (nodeEditType == "link") //add edit icon for links
						treeViewHandlerStr_ +=
							"<div style='margin-top:-4px; float:left;'>" + //to account for not being in value node
							"<div class='treeNode-Value-editIcon' id='treeNode-Value-editIcon-" +
							(depth + "-" + uid) + "' " +
							"onclick='handleTreeNodeClick(" +
							depth + "," + uid + "," +
							"1,\"" +
							nodeEditType +
							"\"); event.stopPropagation();' " +
							"title='Edit this link.' " +
							"></div></div>";

					treeViewHandlerStr_ += "</td></tr></table>"; //close linkmenu/editicon table row
				}

				treeViewHandlerStr_ += "</td></tr></table>"; //close edit/link table row
				treeViewHandlerStr_ += "</td></tr></table>"; //close tree node name/link table row

				treeViewHandlerStr_ += "</div></td>"; //close pre-comment div and td

				//add diff td if difference
				if (diffValueStr != "")
					treeViewHandlerStr_ += "<td>" + diffValueStr + "</td>";

				if (nodeEditType == "table") //since there is no editing of table, use editIcon position for comment icon
					treeViewHandlerStr_ +=
						"<td><div style='margin-top:-4px; float:left;'>" + //to account for not being in value node
						"<div class='treeNode-Value-editCommentIcon' id='treeNode-Value-editIcon-" +
						(depth + "-" + uid) + "' " +
						"onclick='handleTreeNodeClick(" +
						depth + "," + uid + "," +
						"1,\"" +
						nodeEditType +
						"\"); event.stopPropagation();' " +
						"title='Edit the comment for this table.' " +
						"></div>" +
						"</div></td>";

				if (nodeEditType == "link") //since editIcon already exists, use editCommentIcon
				{
					nodeEditType = "link-comment";
					treeViewHandlerStr_ +=
						"<td><div style='margin-top:-1px; margin-left:70px; float:left;'>" + //to account for not being in value node
						"<div class='treeNode-Value-editCommentIcon' id='treeNode-Value-editCommentIcon-" +
						(depth + "-" + uid) + "' " +
						"onclick='handleTreeNodeClick(" +
						depth + "," + uid + "," +
						"1,\"" +
						nodeEditType +
						"\"); event.stopPropagation();' " +
						"title='Edit the comment for this table.' " +
						"></div>" +
						"</div></td>";
				}

				if (comment !== undefined)	//for UID nodes, since editIcon already exists, use editCommentIcon
				{
					nodeEditType = "node-comment";
					treeViewHandlerStr_ +=
						"<td><div style='margin-top:-4px; float:left;'>" + //to account for not being in value node
						"<div class='treeNode-Value-editCommentIcon' id='treeNode-Value-editCommentIcon-" +
						(depth + "-" + uid) + "' " +
						"onclick='handleTreeNodeClick(" +
						depth + "," + uid + "," +
						"1,\"" +
						nodeEditType +
						"\"); event.stopPropagation();' " +
						"title='Edit the comment for this record.' " +
						"></div>" +
						"</div></td>";
				}

				//add comment if applicable
				treeViewHandlerStr_ += "<td style='font-size:14px; white-space: nowrap;' " +
					"class='treeNode-TableComment' " +
					"id='" +
					"treeNode-TableComment-" +
					(depth + "-" + uid) + "' " +
					"onclick='handleTreeNodeClick(" +
					depth + "," + uid + "," +
					"1,\"" +
					nodeEditType +
					"\"); event.stopPropagation();' " +
					">";

				if (tableComment != "" && !/no comment.{0,2}$/i.test(tableComment)) { //e.g. "No comment", "No comment.", "no comment!?" are all hidden
					var ci = tableComment.indexOf(": ");
					if (ci > 2) { //skip past repeated author
						Debug.log("tableComment",tableComment,Debug.MIN_PRIORITY);
						var commentAuthorSubstr = tableComment.substr(0, ci + 2); //include +2 in size for ": "
						ci = tableComment.lastIndexOf(commentAuthorSubstr);
						if (ci < 0) ci = 0; //if not found again, keep single author name
						Debug.log("commentAuthorSubstr", commentAuthorSubstr, ci);
						tableComment = tableComment.substr(ci);
					}
					treeViewHandlerStr_ += //"<td style='font-size:14px; white-space: nowrap;'>" +
						"//" + tableComment;
				}
				else if (comment && comment != "" && !/no comment.{0,2}$/i.test(comment)) { //e.g. "No comment", "No comment.", "no comment!?" are all hidden
					var ci = comment.indexOf(": ");
					if (ci > 2) { //skip past repeated author
						Debug.logv({ comment });
						var commentAuthorSubstr = comment.substr(0, ci + 2); //include +2 in size for ": "
						ci = comment.lastIndexOf(commentAuthorSubstr);
						if (ci < 0) ci = 0; //if not found again, keep single author name
						Debug.log("commentAuthorSubstr", commentAuthorSubstr, ci);
						comment = comment.substr(ci);
					}
					treeViewHandlerStr_ += "//" + comment;
				}
				else
					treeViewHandlerStr_ += "&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"; //for mouse over area
				treeViewHandlerStr_ += "</td>";
				treeViewHandlerStr_ += "</tr></table>"; //close pre/comment table row

				treeViewHandlerStr_ +=
					"<div id='clearDiv'></div>" +
					"<div class='treeNode-Children' id='treeNode-ChildrenOf-" +
					(depth + "-" + uid) + "'>";

				if (childrenLength) {
					recursiveDrawTree(nodes[i], depth + 1, path + nodeName + "/",
						(depth + "-" + uid));
				}

				treeViewHandlerStr_ +=
					"</div>" +
					"</div>" + //end treeNode div
					"<div id='clearDiv'></div>";
				//////////=======================



			} //end children loop
		} //end recursiveDrawTree()

		//==============================================================================
		//getTreeViewTableStrings ~
		function getTreeViewTableStrings(tableLinkName, isLink, linkId,
			childLinkIndex, isGroupLink) {
			var backLinkStr;
			var onmouseupJS = "";
			var newWindowJS = "";
			var newTabJS = "";

			var DEFAULT_treeNavContextMenuItems = [
				"Go-to Table View",
				"See Table Tooltip",
				"Open Table View in this Tab",
				"Open Table View in new Browser Tab",
				"Open Subset Editor in this Tab",
				"Open Subset Editor in new Browser Tab",
				"Create Subset Editor desktop icon",
				"Add new Record to Table"];
			var treeNavContextMenuItems = []
			var treeNavContextMenuItemHandlers = [];
			var menuIndex = 0;

			var tableComment = "";
			var tableTitle = "";

			//search for table link
			for (j = 0; j < treeMemberNames_.length; ++j)
				if (tableLinkName == treeMemberNames_[j])
					break;
			if (j != treeMemberNames_.length) //found table link
			{
				backLinkStr = "setupTableGroupTreeView(\\\"" +
					treeGroupName_ + "\\\",\\\"" +
					treeGroupKey_ + "\\\");";


				//make replace screen js
				{
					onmouseupJS = "setupSpecificTable(\"" +
						treeMemberNames_[j] + "\",\"" +
						treeMemberVersions_[j] + "\",\"" + backLinkStr + "\");";

					treeNavContextMenuItems.push(DEFAULT_treeNavContextMenuItems[menuIndex++]);
					treeNavContextMenuItemHandlers.push(onmouseupJS);
				}

				//see table tooltip
				{
					onmouseupJS = "showTableTooltip(\"" +
						treeMemberNames_[j] + "\");";

					treeNavContextMenuItems.push(DEFAULT_treeNavContextMenuItems[menuIndex++]);
					treeNavContextMenuItemHandlers.push(onmouseupJS);
				}

				//open table-view in new window link
				{
					newWindowStr = "setupSpecificTable(\"" +
						treeMemberNames_[j] + "\",\"" +
						treeMemberVersions_[j] + "\")";
					newWindowStr = newWindowStr.replace(/"/g, "\\\"");

					newWindowStr = location.pathname +
						location.search +
						"&newWindowOps=" + newWindowStr;

					newWindowJS = "DesktopContent.openNewWindow(" +
						"\"Configure\",\"\",\"" +
						newWindowStr + "\",false);";

					treeNavContextMenuItems.push(DEFAULT_treeNavContextMenuItems[menuIndex++]);
					treeNavContextMenuItemHandlers.push(newWindowJS);
				}

				//open table-view in new browser tab link
				{
					newTabJS = "DesktopContent.openNewBrowserTab(" +
						"\"Configure\",\"\",\"" +
						newWindowStr + "\",false);";

					treeNavContextMenuItems.push(DEFAULT_treeNavContextMenuItems[menuIndex++]);
					treeNavContextMenuItemHandlers.push(newTabJS);
				}

				//open Subset-Configuration in new window link
				{
					//make record alias with spaces instead of all one word
					// and remove table
					var recordAlias = "";
					for (var c = 0; c < treeMemberNames_[j].length - ("Table").length; ++c) {
						if (c && c + 1 < treeMemberNames_[j].length &&
							(treeMemberNames_[j][c] >= 'A' &&
								treeMemberNames_[j][c] <= 'Z') &&
							(treeMemberNames_[j][c + 1] >= 'a' &&
								treeMemberNames_[j][c + 1] <= 'z'))
							recordAlias += ' ';
						recordAlias += treeMemberNames_[j][c];
					}
					if (recordAlias.length && recordAlias[recordAlias.length - 1] != 's')
						recordAlias += 's'; //make plural

					newWindowStr = "/WebPath/html/ConfigurationGUI_subset.html?urn=" +
						DesktopContent._localUrnLid +
						"&subsetBasePath=" + treeMemberNames_[j] +
						"&groupingFieldList=AUTO" +
						"&recordAlias=" + recordAlias +
						"&editableFieldList=" + "!*CommentDescription";

					if (isLink) //include special parameters to focus on link targets
					{
						if (isGroupLink) {
							//for group link, pre-select GroupID value
							newWindowStr += "&selectedGroupIDs=" +
								encodeURIComponent(
									childLinkIndex + "=" +
									linkId);
						}
						else {
							//for unique link, presect UID record
							newWindowStr += "&selectedRecords=" + linkId;
						}
					} //end special link parameter handling


					//DesktopContent.openNewWindow = function(name,subname,windowPath,unique,completeHandler) {
					newWindowJS = "DesktopContent.openNewWindow(" +
						"\"" + treeMemberNames_[j] +
						" Subset\",\"\",\"" +
						//windowPath
						newWindowStr +
						"\",false /*unique*/);";

					treeNavContextMenuItems.push(DEFAULT_treeNavContextMenuItems[menuIndex++]);
					treeNavContextMenuItemHandlers.push(newWindowJS);
				}

				//open Subset-Configuration in new browser tab link
				{
					//DesktopContent.openNewBrowserTab = function(name,subname,windowPath,unique)
					newTabJS = "DesktopContent.openNewBrowserTab(" +
						"\"" + treeMemberNames_[j] +
						" Subset\",\"\",\"" +
						newWindowStr + "\",false /*unique*/);";

					treeNavContextMenuItems.push(DEFAULT_treeNavContextMenuItems[menuIndex++]);
					treeNavContextMenuItemHandlers.push(newTabJS);
				}

				//add Subset-Configuration desktop icon
				{
					//DesktopContent.addDesktopIcon = function(caption, altText,
					//	folderPath, unique, permissionString,
					//	imageURL, windowContentURL, linkedApp, parameters)

					newTabJS = "DesktopContent.popUpVerification(" +
						"\"Are you sure you want to create a Subset Editor icon on your desktop?\"," +
						"function(){" +
						"DesktopContent.addDesktopIcon(" +
						"\"" + treeMemberNames_[j] +
						" Subset\",\"CfgSub\",\"Config Subsets\"" +
						", false /*unique*/" +
						", 255 /*permissionsString*/" +
						", \"icon-Configure.png\" /*imageURL*/" +
						", \"ConfigurationGUI_subset.html?urn=\" /*windowContentURL*/" +
						", \"ots::ConfigurationGUISupervisor\" /*linkedApp*/" +
						", /*parameters*/ \"" +
						"subsetBasePath=" + treeMemberNames_[j] +
						"&groupingFieldList=AUTO" +
						"&recordAlias=" + encodeURIComponent(recordAlias) +
						"&editableFieldList=" + encodeURIComponent("!*CommentDescription") +
						"\"" +
						");" +
						"});";

					treeNavContextMenuItems.push(DEFAULT_treeNavContextMenuItems[menuIndex++]);
					treeNavContextMenuItemHandlers.push(newTabJS);
				}


				//make add new row js
				{
					onmouseupJS = "editTreeAddNewRow(\"" +
						treeMemberNames_[j] + "\");";

					if (!isLink) {
						treeNavContextMenuItems.push(DEFAULT_treeNavContextMenuItems[menuIndex++]);
						treeNavContextMenuItemHandlers.push(onmouseupJS);
					}
					else
						++menuIndex; //skip 1st menu item

				}

				tableComment = treeMemberComments_[j];
				//make comment html safe
				tableComment = tableComment.replace(/</g, "&lt");
				tableComment = tableComment.replace(/>/g, "&gt");
				if (tableComment == ConfigurationAPI._DEFAULT_COMMENT) //do not show if default
					tableComment = "";
				tableTitle = "Table: \t\t" + treeMemberNames_[j] + "-v" +
					treeMemberVersions_[j];
				if (tableComment != "")
					tableTitle += "\nComment: \t\"" +
						tableComment + "\"";
			}

			return {
				"tableTitle": tableTitle,
				"tableComment": tableComment,
				"treeNavContextMenuItems": treeNavContextMenuItems,
				"treeNavContextMenuItemHandlers": treeNavContextMenuItemHandlers
			};
		} //end getTreeViewTableStrings()

		//editTreeAddNewRow ~~
		function editTreeAddNewRow(tableName) {
			Debug.log("editTreeAddNewRow " + tableName);

			//find table node element
			var els = document.getElementsByClassName("treeNode-Value-nodeEditType-table");
			{
				var i;
				for (i = 0; i < els.length; ++i)
					if (els[i].textContent == tableName) {
						_editingCellEl = els[i];

					}

					Debug.err("Invalid tree member table targeted!");
					return;

			treeEditingNodeType_ = "table-newRow";
